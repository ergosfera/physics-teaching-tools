<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridiano</title>

<style>
  :root{
    --desktop:#008080;
    --face:#C0C0C0;
    --hi:#FFFFFF;
    --light:#DFDFDF;
    --shadow:#808080;
    --dark:#000000;
    --title:#000080;
    --title-off:#808080;
    --sel:#000080;
    --field:#FFFFFF;
    --ui:Tahoma,"MS Sans Serif",Verdana,Geneva,sans-serif;
    --fixed:"Lucida Console","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--desktop);
    font-family:var(--ui);
    font-size:14px;
    color:#000;
    -webkit-font-smoothing:none;
    padding:8px 8px calc(54px + env(safe-area-inset-bottom));
    overscroll-behavior-y:contain;
  }

  /* ---- Win95 bevels ---- */
  .raised{
    background:var(--face);
    box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--hi),
               inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--light);
  }
  .sunken{
    background:var(--face);
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }
  .thin-sunken{
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow);
  }

  /* ---- window ---- */
  .window{max-width:820px;margin:0 auto;padding:3px}
  .window.hidden{display:none}
  .titlebar{
    background:var(--title);color:#fff;
    display:flex;align-items:center;gap:5px;
    padding:2px 2px 2px 3px;margin-bottom:2px;
  }
  .titlebar .t{
    font-weight:700;font-size:15px;flex:1;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .titlebar svg{display:block;flex:none}
  .tbtn{
    width:24px;height:22px;padding:0;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--ui);font-size:13px;font-weight:700;line-height:1;
    background:var(--face);border:0;color:#000;cursor:pointer;
    box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--hi),
               inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--light);
  }
  .tbtn:active{box-shadow:inset 1px 1px 0 var(--dark), inset 2px 2px 0 var(--shadow);padding:1px 0 0 1px}
  .tbtn:focus-visible{outline:1px dotted #fff;outline-offset:-4px}

  .body{padding:6px}

  /* ---- toolbar ---- */
  .toolbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
  button.b95{
    font-family:var(--ui);font-size:14px;color:#000;background:var(--face);
    border:0;padding:7px 13px;min-height:32px;cursor:pointer;
    box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--hi),
               inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--light);
  }
  button.b95:active,button.b95.pressed{
    box-shadow:inset 1px 1px 0 var(--shadow), inset 2px 2px 0 var(--dark);
    padding:8px 12px 6px 14px;
  }
  button.b95:focus-visible{outline:1px dotted #000;outline-offset:-4px}
  button.b95:disabled{color:var(--shadow);text-shadow:1px 1px 0 var(--hi);cursor:default}
  .daybox{display:flex;align-items:center;gap:4px}
  .daybox .lbl{
    font-family:var(--fixed);font-size:14px;background:var(--field);
    padding:7px 10px;min-width:128px;text-align:center;
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }
  .grow{flex:1}

  /* ---- timeline ---- */
  .well{padding:5px;position:relative}
  .timeline{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .timeline:focus-visible{outline:1px dotted #000;outline-offset:2px}
  .row{padding:8px 5px 6px}
  .row+.row{border-top:1px solid var(--shadow);box-shadow:0 1px 0 var(--hi) inset}
  .rowhead{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
  .city{font-weight:700;font-size:16px}
  .badge{
    font-size:11px;font-weight:700;background:var(--sel);color:#fff;
    padding:2px 6px;letter-spacing:.06em;
  }
  .meta{font-family:var(--fixed);font-size:12px;color:#000;white-space:nowrap}
  .meta em{font-style:normal;color:var(--shadow)}
  .rowtime{margin-left:auto;display:flex;align-items:baseline;gap:6px}
  .rowtime b{font-family:var(--fixed);font-size:22px;font-weight:400;letter-spacing:-.01em}
  .daydiff{font-family:var(--fixed);font-size:12px;color:#800000;font-weight:700}
  .rowacts{display:flex;gap:4px}
  .rowacts button{padding:4px 9px;min-height:0;font-size:13px}
  .rowacts button:active{padding:5px 8px 3px 10px}

  .band{position:relative;height:36px;padding:2px;background:var(--face)}
  .band canvas{display:block;width:100%;height:32px;image-rendering:pixelated}
  .ticks{position:relative;height:16px;margin-top:3px}
  .ticks span{position:absolute;top:0;transform:translateX(-50%);font-family:var(--fixed);font-size:11px;white-space:nowrap}
  .ticks span.minor{display:none}
  @media(min-width:760px){.ticks span.minor{display:block;color:var(--shadow)}}

  .vline{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
  .vline i{position:absolute;top:0;bottom:14px;left:-1px;width:2px;display:block}
  #nowline i{background:#FF0000}
  #scrubline i{
    width:1px;left:0;
    background:repeating-linear-gradient(180deg,#000 0 2px,#fff 2px 4px);
  }
  .hidden{display:none}

  /* ---- legend ---- */
  .legend{display:flex;align-items:center;gap:8px;margin-top:8px}
  .legend canvas{flex:1;height:14px;display:block;width:100%;image-rendering:pixelated}
  .legend span{font-size:12px;font-family:var(--fixed)}

  /* ---- add-city dialog ---- */
  .modal{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;padding:12px;
    background:rgba(0,0,0,.35);
  }
  .modal.hidden{display:none}
  .dlg{width:100%;max-width:420px;padding:3px;display:flex;flex-direction:column;max-height:88vh}
  .dlg .dlgbody{padding:10px;display:flex;flex-direction:column;min-height:0}
  .dlg label{display:block;font-size:14px;margin-bottom:6px}
  .dlgbtns{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:10px}
  .dlgbtns button{min-width:88px}
  .dlgcount{margin-right:auto;font-family:var(--fixed);font-size:12px;color:var(--shadow)}
  input[type=search]{
    width:100%;font-family:var(--ui);font-size:15px;padding:7px 7px;
    background:var(--field);border:0;outline:none;color:#000;
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }
  input[type=search]:focus{outline:none}
  .results{
    margin-top:8px;flex:1;min-height:140px;overflow-y:auto;background:var(--field);
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }
  .results button{
    display:flex;width:100%;align-items:baseline;gap:8px;text-align:left;
    border:0;background:transparent;padding:8px 8px;font-family:var(--ui);
    font-size:14px;color:#000;cursor:pointer;
  }
  .results button:hover{background:var(--light)}
  .results button.sel,.results button.sel:hover{background:var(--sel);color:#fff}
  .results button:focus{outline:1px dotted #000;outline-offset:-2px}
  .results button.sel:focus{outline-color:#fff}
  .results button .r-meta{margin-left:auto;font-family:var(--fixed);font-size:12px}
  .results .none{padding:10px;font-size:14px;color:var(--shadow)}
  .results::-webkit-scrollbar{width:16px}
  .results::-webkit-scrollbar-track{
    background-color:var(--hi);
    background-image:linear-gradient(45deg,var(--face) 25%,transparent 25%,transparent 75%,var(--face) 75%),
                     linear-gradient(45deg,var(--face) 25%,transparent 25%,transparent 75%,var(--face) 75%);
    background-size:2px 2px;background-position:0 0,1px 1px;
  }
  .results::-webkit-scrollbar-thumb{
    background:var(--face);
    box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--hi),
               inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--light);
  }

  /* ---- status bar ---- */
  .status{display:flex;gap:3px;margin-top:8px}
  .status div{
    font-size:13px;padding:5px 8px;
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow);
  }
  .status .s1{flex:1;font-family:var(--fixed)}

  /* ---- desktop icon ---- */
  .icon{
    width:78px;text-align:center;padding:4px;cursor:pointer;background:transparent;border:0;
    display:none;
  }
  .icon.show{display:block}
  .icon .cap{
    color:#fff;font-family:var(--ui);font-size:12px;margin-top:3px;display:inline-block;padding:1px 3px;
    text-shadow:1px 1px 0 #000;
  }
  .icon:focus-visible .cap{outline:1px dotted #fff;background:var(--sel)}

  /* ---- taskbar ---- */
  .taskbar{
    position:fixed;left:0;right:0;bottom:0;height:44px;
    background:var(--face);display:flex;align-items:center;gap:4px;
    padding:4px 4px calc(4px + env(safe-area-inset-bottom));
    box-shadow:inset 0 1px 0 var(--hi), inset 0 2px 0 var(--light);
  }
  .taskbtn{
    display:flex;align-items:center;gap:6px;font-weight:700;padding:6px 10px;min-height:34px;
  }
  .tray{
    margin-left:auto;font-family:var(--fixed);font-size:14px;padding:8px 12px;
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <svg width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
    <rect x="1" y="1" width="14" height="14" fill="#C0C0C0"/>
    <rect x="1" y="1" width="14" height="1" fill="#FFF"/><rect x="1" y="1" width="1" height="14" fill="#FFF"/>
    <rect x="1" y="14" width="14" height="1" fill="#000"/><rect x="14" y="1" width="1" height="14" fill="#000"/>
    <rect x="3" y="3" width="10" height="10" fill="#000080"/>
    <rect x="7" y="5" width="1" height="4" fill="#FFFF00"/><rect x="8" y="8" width="3" height="1" fill="#FFFF00"/>
  </svg>
  <span class="cap">Meridiano</span>
</button>

<div class="window raised" id="win">
  <div class="titlebar">
    <svg width="17" height="17" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="2" y="2" width="12" height="12" fill="#C0C0C0"/>
      <rect x="3" y="3" width="10" height="10" fill="#000080"/>
      <rect x="7" y="5" width="1" height="4" fill="#FFFF00"/><rect x="8" y="8" width="3" height="1" fill="#FFFF00"/>
    </svg>
    <span class="t">Meridiano</span>
    <button class="tbtn" id="btnMin" title="Minimize" aria-label="Minimize">_</button>
    <button class="tbtn" id="btnWide" title="Maximize" aria-label="Toggle width">□</button>
    <button class="tbtn" id="btnClose" title="Close" aria-label="Close">✕</button>
  </div>

  <div class="body" id="winBody">
    <div class="toolbar">
      <div class="daybox">
        <button class="b95" id="dayPrev" aria-label="Previous day">◄</button>
        <span class="lbl" id="dayLabel">—</span>
        <button class="b95" id="dayNext" aria-label="Next day">►</button>
      </div>
      <button class="b95" id="nowBtn">Now</button>
      <button class="b95" id="fmtBtn">24h</button>
      <button class="b95" id="addBtn">Add city...</button>
      <span class="grow"></span>
      <button class="b95" id="copyBtn">Copy times</button>
    </div>

    <div class="well sunken">
      <div class="timeline" id="timeline" tabindex="0" role="group"
           aria-label="Hour bands. Drag across, or use the arrow keys, to compare one moment in every city.">
        <div id="rows"></div>
        <div class="vline" id="nowline"><i></i></div>
        <div class="vline hidden" id="scrubline"><i></i></div>
      </div>
    </div>

    <div class="legend">
      <span>night</span><canvas id="legendC" height="10"></canvas><span>day</span>
    </div>

    <div class="status">
      <div class="s1 sunken-t" id="statusText">—</div>
      <div id="statusCount">—</div>
    </div>
  </div>
</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="dlg raised">
    <div class="titlebar">
      <svg width="17" height="17" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
        <rect x="2" y="2" width="12" height="12" fill="#C0C0C0"/>
        <rect x="3" y="3" width="10" height="10" fill="#000080"/>
        <rect x="7" y="5" width="1" height="4" fill="#FFFF00"/><rect x="8" y="8" width="3" height="1" fill="#FFFF00"/>
      </svg>
      <span class="t" id="dlgTitle">Add a city</span>
      <button class="tbtn" id="dlgX" title="Cancel" aria-label="Cancel">✕</button>
    </div>
    <div class="dlgbody">
      <label for="search">City or country:</label>
      <input id="search" type="search" autocomplete="off" placeholder="Type to filter the list">
      <div class="results" id="results" role="listbox" aria-label="Available cities"></div>
      <div class="dlgbtns">
        <span class="dlgcount" id="dlgCount"></span>
        <button class="b95" id="dlgAdd" disabled>Add</button>
        <button class="b95" id="dlgCancel">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div class="taskbar">
  <button class="b95 taskbtn" id="taskBtn">
    <svg width="17" height="17" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="2" y="2" width="12" height="12" fill="#000080"/>
      <rect x="7" y="5" width="1" height="4" fill="#FFFF00"/><rect x="8" y="8" width="3" height="1" fill="#FFFF00"/>
    </svg>
    Meridiano
  </button>
  <span class="tray" id="tray">—</span>
</div>

/* ───────── storage: sandbox-safe, falls back to memory ───────── */
const memCache = {};
const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k,false); if(r) return JSON.parse(r.value); } }catch(e){}
    return (k in memCache) ? memCache[k] : null;
  },
  async set(k,v){
    memCache[k] = v;
    try{ if(window.storage) await window.storage.set(k, JSON.stringify(v), false); }catch(e){}
  }
};

const HOUR = 3600000, DAY = 86400000;
const DEFAULTS = ["Bogotá|America/Bogota","London|Europe/London","New York|America/New_York"];
let state = { cities:[], home:0, h24:true };
state.cities = DEFAULTS.map(k => byKey[k]).filter(i => i !== undefined);
if(!state.cities.length) state.cities = [0];
state.home = state.cities[0];
let dayShift = 0, scrubFrac = null, winStart = 0;

/* ───────── time helpers ───────── */
const partCache = new Map();
function getParts(ms, tz){
  const key = tz + "@" + Math.floor(ms/60000);
  if(partCache.has(key)) return partCache.get(key);
  const f = new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,weekday:"short",
    year:"numeric",month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  const o = {};
  for(const p of f.formatToParts(new Date(ms))) o[p.type] = p.value;
  const MON = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const H = (+o.hour) % 24;
  const asUTC = Date.UTC(+o.year, MON[o.month], +o.day, H, +o.minute);
  const res = { y:+o.year, mo:MON[o.month], d:+o.day, h:H, mi:+o.minute, wd:o.weekday, mon:o.month,
                off:Math.round((asUTC - Math.floor(ms/60000)*60000)/60000) };
  if(partCache.size > 4000) partCache.clear();
  partCache.set(key,res);
  return res;
}
function offLabel(off){
  const s = off < 0 ? "-" : "+", a = Math.abs(off);
  const h = Math.floor(a/60), m = a % 60;
  return "UTC" + s + h + (m ? ":" + String(m).padStart(2,"0") : "");
}
function fmtTime(p){
  if(state.h24) return String(p.h).padStart(2,"0") + ":" + String(p.mi).padStart(2,"0");
  const ap = p.h < 12 ? "am" : "pm", h12 = p.h % 12 === 0 ? 12 : p.h % 12;
  return h12 + ":" + String(p.mi).padStart(2,"0") + ap;
}
function localMidnight(tz, shiftDays){
  const t = Date.now() + shiftDays*DAY;
  const p = getParts(t, tz);
  const p2 = getParts(Date.UTC(p.y,p.mo,p.d) - p.off*60000, tz);
  return Date.UTC(p.y, p.mo, p.d) - p2.off*60000;
}
function dayDelta(a,b){ return Math.sign(Date.UTC(b.y,b.mo,b.d) - Date.UTC(a.y,a.mo,a.d)); }

/* ───────── solar geometry ───────── */
function solarElevation(ms, lat, lon){
  const yStart = Date.UTC(new Date(ms).getUTCFullYear(), 0, 1);
  const n = (ms - yStart)/DAY + 1;
  const B = 2*Math.PI*(n - 81)/364;
  const eot = 9.87*Math.sin(2*B) - 7.53*Math.cos(B) - 1.5*Math.sin(B);
  const decl = (23.44*Math.PI/180) * Math.sin(2*Math.PI*(n - 81)/365);
  const utcH = ((ms/HOUR) % 24 + 24) % 24;
  const Ha = ((utcH + lon/15 + eot/60) - 12) * 15 * Math.PI/180;
  const phi = lat*Math.PI/180;
  const s = Math.sin(phi)*Math.sin(decl) + Math.cos(phi)*Math.cos(decl)*Math.cos(Ha);
  return Math.asin(Math.max(-1, Math.min(1, s))) * 180/Math.PI;
}

/* ───────── 16-colour ordered dithering ─────────
   Anchors use only Windows 95 native palette entries. Between two anchors the
   pixels are dithered with a 4x4 Bayer matrix, the way the shell faked gradients. */
const RAMP = [
  [-30, [0,0,0]],        // black
  [-15, [0,0,128]],      // navy
  [ -7, [128,0,128]],    // purple
  [ -2, [128,0,0]],      // maroon
  [  1, [255,0,0]],      // red
  [  7, [255,255,0]],    // yellow
  [ 20, [255,255,255]]   // white
];
const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
function rampAt(e){
  if(e <= RAMP[0][0]) return [RAMP[0][1], RAMP[0][1], 0];
  for(let i=1;i<RAMP.length;i++){
    if(e <= RAMP[i][0]){
      const t = (e - RAMP[i-1][0])/(RAMP[i][0] - RAMP[i-1][0]);
      return [RAMP[i-1][1], RAMP[i][1], t];
    }
  }
  const last = RAMP[RAMP.length-1][1];
  return [last, last, 0];
}
function paintBand(cv, lat, lon){
  const W = Math.max(1, Math.round(cv.clientWidth || 300)), H = 32;
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(W, H);
  const d = img.data;
  for(let x=0;x<W;x++){
    const [a,b,t] = rampAt(solarElevation(winStart + (x/W)*DAY, lat, lon));
    for(let y=0;y<H;y++){
      const th = (BAYER[(y%4)*4 + (x%4)] + 0.5)/16;
      const c = t > th ? b : a;
      const o = (y*W + x)*4;
      d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}
function paintLegend(){
  const cv = document.getElementById("legendC");
  const W = Math.max(1, Math.round(cv.clientWidth || 200)), H = 14;
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(W,H), d = img.data;
  for(let x=0;x<W;x++){
    const e = -30 + (x/(W-1))*55;
    const [a,b,t] = rampAt(e);
    for(let y=0;y<H;y++){
      const th = (BAYER[(y%4)*4 + (x%4)] + 0.5)/16;
      const c = t > th ? b : a, o = (y*W + x)*4;
      d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}

/* ───────── rendering ───────── */
const $ = id => document.getElementById(id);
const rowsEl = $("rows");

function render(){
  const home = CITIES[state.home];
  winStart = localMidnight(home[2], dayShift);
  rowsEl.innerHTML = "";
  for(const idx of state.cities) rowsEl.appendChild(buildRow(idx));
  const hp = getParts(winStart + 12*HOUR, home[2]);
  $("dayLabel").textContent = hp.wd + " " + String(hp.d).padStart(2,"0") + " " + hp.mon;
  $("statusCount").textContent = state.cities.length + (state.cities.length === 1 ? " city" : " cities");
  requestAnimationFrame(paintAll);
  positionNow();
  updateReadouts();
}
function paintAll(){
  for(const row of rowsEl.children){
    const c = CITIES[+row.dataset.idx];
    paintBand(row.querySelector("canvas"), c[3], c[4]);
  }
  paintLegend();
}

function buildRow(idx){
  const c = CITIES[idx], name = c[0], country = c[1], tz = c[2];
  const row = document.createElement("div");
  row.className = "row";
  row.dataset.idx = idx;

  const p = getParts(winStart + 12*HOUR, tz);
  const head = document.createElement("div");
  head.className = "rowhead";
  head.innerHTML = '<span class="city"></span>' +
    (idx === state.home ? '<span class="badge">HOME</span>' : "") +
    '<span class="meta"></span>' +
    '<span class="rowtime"><b class="tval">--:--</b><span class="daydiff"></span></span>';
  head.querySelector(".city").textContent = name;
  const meta = head.querySelector(".meta");
  meta.textContent = offLabel(p.off);
  const em = document.createElement("em");
  em.textContent = "  " + country;
  meta.appendChild(em);

  if(idx !== state.home){
    const acts = document.createElement("span");
    acts.className = "rowacts";
    const bh = document.createElement("button");
    bh.className = "b95"; bh.textContent = "Home"; bh.setAttribute("aria-label","Set " + name + " as home");
    bh.onclick = e => { e.stopPropagation(); state.home = idx; save(); render(); };
    const bx = document.createElement("button");
    bx.className = "b95"; bx.textContent = "✕"; bx.setAttribute("aria-label","Remove " + name);
    bx.onclick = e => { e.stopPropagation(); state.cities = state.cities.filter(i => i !== idx); save(); render(); };
    acts.append(bh,bx);
    head.querySelector(".rowtime").after(acts);
  }

  const band = document.createElement("div");
  band.className = "band sunken";
  band.appendChild(document.createElement("canvas"));

  const ticks = document.createElement("div");
  ticks.className = "ticks";
  const startLocal = winStart + p.off*60000;
  for(let t = Math.ceil(startLocal/HOUR)*HOUR; t < startLocal + DAY; t += HOUR){
    const h = new Date(t).getUTCHours();
    const frac = (t - startLocal)/DAY;
    const s = document.createElement("span");
    if(frac < 0.02){ s.style.left = "0"; s.style.transform = "none"; }
    else if(frac > 0.96){ s.style.left = "100%"; s.style.transform = "translateX(-100%)"; }
    else s.style.left = (frac*100).toFixed(3) + "%";
    s.textContent = state.h24 ? String(h).padStart(2,"0")
                              : (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? "a" : "p");
    if(h % 3 !== 0) s.className = "minor";
    ticks.appendChild(s);
  }

  row.append(head, band, ticks);
  return row;
}

const currentInstant = () => scrubFrac === null ? Date.now() : winStart + scrubFrac*DAY;

function updateReadouts(){
  const t = currentInstant(), home = CITIES[state.home];
  const hp = getParts(t, home[2]);
  $("statusText").textContent = home[0] + "  " + hp.wd + " " + String(hp.d).padStart(2,"0") + " " + hp.mon + " " + hp.y
                                + (scrubFrac === null ? "" : "  (selected)");
  $("tray").textContent = fmtTime(getParts(Date.now(), home[2]));
  for(const row of rowsEl.children){
    const c = CITIES[+row.dataset.idx], p = getParts(t, c[2]);
    row.querySelector(".tval").textContent = fmtTime(p);
    const dd = dayDelta(hp,p);
    row.querySelector(".daydiff").textContent = dd === 0 ? "" : (dd > 0 ? "+1d" : "-1d");
  }
  $("nowBtn").classList.toggle("pressed", scrubFrac === null && dayShift === 0);
}
function positionNow(){
  const f = (Date.now() - winStart)/DAY, el = $("nowline");
  if(f < 0 || f > 1){ el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  el.style.left = (f*100) + "%";
}

/* ───────── scrubbing ───────── */
const tl = $("timeline");
function setScrub(clientX){
  const r = tl.getBoundingClientRect();
  scrubFrac = Math.max(0, Math.min(1, (clientX - r.left)/r.width));
  const sl = $("scrubline");
  sl.classList.remove("hidden");
  sl.style.left = (scrubFrac*100) + "%";
  updateReadouts();
}
let dragging = false;
tl.addEventListener("pointerdown", e => {
  if(e.target.closest("button")) return;
  dragging = true; tl.setPointerCapture(e.pointerId); setScrub(e.clientX);
});
tl.addEventListener("pointermove", e => { if(dragging) setScrub(e.clientX); });
tl.addEventListener("pointerup", () => dragging = false);
tl.addEventListener("pointercancel", () => dragging = false);
tl.addEventListener("keydown", e => {
  if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
    e.preventDefault();
    const step = e.shiftKey ? 1/96 : 1/24;
    const base = scrubFrac === null ? (Date.now()-winStart)/DAY : scrubFrac;
    scrubFrac = Math.max(0, Math.min(1, base + (e.key === "ArrowRight" ? step : -step)));
    const sl = $("scrubline"); sl.classList.remove("hidden"); sl.style.left = (scrubFrac*100) + "%";
    updateReadouts();
  }
  if(e.key === "Escape") resetNow();
});
function clearScrub(){ scrubFrac = null; $("scrubline").classList.add("hidden"); }
function resetNow(){ clearScrub(); dayShift = 0; render(); }

/* ───────── controls ───────── */
$("nowBtn").onclick = resetNow;
$("dayPrev").onclick = () => { dayShift--; clearScrub(); render(); };
$("dayNext").onclick = () => { dayShift++; clearScrub(); render(); };
$("fmtBtn").onclick = () => { state.h24 = !state.h24; $("fmtBtn").textContent = state.h24 ? "24h" : "12h"; save(); render(); };
$("copyBtn").onclick = async () => {
  const t = currentInstant(), hp = getParts(t, CITIES[state.home][2]);
  const lines = [hp.wd + ", " + hp.d + " " + hp.mon + " " + hp.y];
  for(const idx of state.cities){
    const c = CITIES[idx], p = getParts(t, c[2]), dd = dayDelta(hp,p);
    lines.push(c[0] + "  " + fmtTime(p) + (dd === 0 ? "" : dd > 0 ? " (+1 day)" : " (-1 day)"));
  }
  try{ await navigator.clipboard.writeText(lines.join("\n")); flash("Times copied"); }
  catch(e){ flash("Copy blocked — select the text instead"); }
};
let flashTimer;
function flash(msg){
  const el = $("statusText"), old = el.textContent;
  el.textContent = msg;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(updateReadouts, 1800);
}

/* ───────── window chrome ───────── */
const win = $("win"), winBody = $("winBody"), deskIcon = $("deskIcon");
let minimized = false, closed = false, wide = false;
function showWindow(){ closed = false; minimized = false; win.classList.remove("hidden"); winBody.style.display = ""; deskIcon.classList.remove("show"); requestAnimationFrame(paintAll); }

/* ───────── add-city dialog ───────── */
const searchEl = $("search"), resultsEl = $("results"), modal = $("modal");
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let picked = null;

function fillList(){
  const q = norm(searchEl.value.trim());
  resultsEl.innerHTML = "";
  const hits = [];
  for(let i=0;i<CITIES.length;i++){
    if(state.cities.includes(i)) continue;
    const c = CITIES[i];
    if(!q || norm(c[0]).includes(q) || norm(c[1]).includes(q) || norm(c[2]).includes(q)) hits.push(i);
  }
  if(!hits.length){
    resultsEl.innerHTML = '<div class="none">No city matches that. Try the country instead.</div>';
    $("dlgCount").textContent = "0 of " + CITIES.length;
    setPicked(null);
    return;
  }
  $("dlgCount").textContent = hits.length + " of " + CITIES.length;
  for(const i of hits){
    const c = CITIES[i];
    const b = document.createElement("button");
    b.type = "button"; b.dataset.idx = i; b.setAttribute("role","option");
    b.innerHTML = '<span class="r-name"></span><span class="r-meta"></span>';
    b.querySelector(".r-name").textContent = c[0] + ", " + c[1];
    b.querySelector(".r-meta").textContent = offLabel(getParts(Date.now(), c[2]).off);
    b.onclick = () => setPicked(i);
    b.ondblclick = () => { setPicked(i); commitAdd(); };
    resultsEl.appendChild(b);
  }
  if(q && hits.length === 1) setPicked(hits[0]); else setPicked(null);
}
function setPicked(i){
  picked = i;
  for(const b of resultsEl.querySelectorAll("button")){
    const on = +b.dataset.idx === i;
    b.classList.toggle("sel", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  }
  $("dlgAdd").disabled = (i === null);
}
function openDialog(){
  searchEl.value = "";
  fillList();
  modal.classList.remove("hidden");
  setTimeout(() => searchEl.focus(), 0);
}
function closeDialog(){
  modal.classList.add("hidden");
  setPicked(null);
  $("addBtn").focus();
}
function commitAdd(){
  if(picked === null) return;
  state.cities.push(picked);
  closeDialog();
  save();
  render();
}
$("addBtn").onclick = openDialog;
$("dlgAdd").onclick = commitAdd;
$("dlgCancel").onclick = closeDialog;
$("dlgX").onclick = closeDialog;
searchEl.addEventListener("input", fillList);
searchEl.addEventListener("keydown", e => {
  if(e.key === "Enter"){ e.preventDefault(); commitAdd(); }
  if(e.key === "ArrowDown"){
    e.preventDefault();
    const first = resultsEl.querySelector("button");
    if(first){ first.focus(); setPicked(+first.dataset.idx); }
  }
});
resultsEl.addEventListener("keydown", e => {
  const items = [...resultsEl.querySelectorAll("button")];
  const at = items.indexOf(document.activeElement);
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    const next = items[at + (e.key === "ArrowDown" ? 1 : -1)];
    if(next){ next.focus(); setPicked(+next.dataset.idx); }
    else if(e.key === "ArrowUp") searchEl.focus();
  }
  if(e.key === "Enter"){ e.preventDefault(); commitAdd(); }
});
modal.addEventListener("keydown", e => { if(e.key === "Escape") closeDialog(); });

/* ───────── persistence ───────── */
function save(){
  store.set("meridiano:v1", {
    cities: state.cities.map(i => CITIES[i][0] + "|" + CITIES[i][2]),
    home: CITIES[state.home][0] + "|" + CITIES[state.home][2],
    h24: state.h24
  });
}
async function load(){
  const s = await store.get("meridiano:v1");
  if(!s) return;
  const list = (s.cities || []).map(k => byKey[k]).filter(i => i !== undefined);
  if(list.length) state.cities = list;
  state.home = (byKey[s.home] !== undefined && state.cities.includes(byKey[s.home])) ? byKey[s.home] : state.cities[0];
  if(typeof s.h24 === "boolean") state.h24 = s.h24;
  $("fmtBtn").textContent = state.h24 ? "24h" : "12h";
}

/* ───────── go ───────── */
(async () => {
  await load();
  render();
  setInterval(() => { positionNow(); updateReadouts(); }, 20000);
  let rt;
  window.addEventListener("resize", () => {
    positionNow();
    clearTimeout(rt);
    rt = setTimeout(paintAll, 120);
  });
})();
</script>
