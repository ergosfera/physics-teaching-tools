<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Field — Dot Timer</title>
<style>
  :root {
    --desktop: #086060;
    --face: #3b3b3b;
    --bevel-hi: #6e6e6e;
    --bevel-lt: #545454;
    --bevel-sh: #1c1c1c;
    --bevel-dk: #000000;
    --win-text: #e8e8e8;
    --title-from: #0a0a5c;
    --title-to: #163a70;
    --title-text: #ffffff;

    --bg: #060607;
    --dot-idle-border: rgba(255,255,255,0.10);
    --dot-setup-fill: #cfcdc6;
    --dot-active: #f4f1ea;
    --dot-active-glow: rgba(244,241,234,0.30);
    --dot-elapsed: #333338;

    --lcd-bg: #7fae86;
    --lcd-digit: #16321c;

    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", "JetBrains Mono", monospace;
    --font-ui: Tahoma, "MS Sans Serif", Geneva, Verdana, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--desktop);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    font-family: var(--font-ui);
  }

  body { display: flex; }

  .bevel-raised {
    box-shadow:
      inset -1px -1px var(--bevel-dk),
      inset  1px  1px var(--bevel-hi),
      inset -2px -2px var(--bevel-sh),
      inset  2px  2px var(--bevel-lt);
  }
  .bevel-sunken {
    box-shadow:
      inset -1px -1px var(--bevel-hi),
      inset  1px  1px var(--bevel-dk),
      inset -2px -2px var(--bevel-lt),
      inset  2px  2px var(--bevel-sh);
  }

  #win95-window {
    flex: 1;
    margin: 3px;
    display: flex;
    flex-direction: column;
    background: var(--face);
    overflow: hidden;
  }

  #win95-titlebar {
    flex-shrink: 0;
    height: 26px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 3px 0 6px;
    background: linear-gradient(90deg, var(--title-from), var(--title-to));
    color: var(--title-text);
    font-weight: bold;
    font-size: 12px;
  }
  .tb-icon { font-size: 13px; }
  .tb-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tb-btns { display: flex; gap: 2px; }
  .tb-btn {
    width: 18px; height: 16px; padding: 0;
    min-width: 0; min-height: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--face); color: var(--win-text);
    border: none; font-size: 10px; line-height: 1; cursor: pointer;
  }
  .tb-close:hover { background: #c00000; color: #fff; }

  .screen-wrap {
    flex: 1;
    padding: 6px;
    min-height: 0;
  }

  .app {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--bg);
    touch-action: none;
    user-select: none;
    cursor: default;
    overflow: hidden;
  }

  .app[data-state="setup"] { cursor: ns-resize; }

  .grid {
    position: absolute;
    inset: 0;
    display: grid;
    justify-content: center;
    align-content: center;
    transition: opacity 0.4s ease;
  }

  .app[data-paused="true"] .grid { opacity: 0.45; }

  .dot {
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--dot-idle-border);
  }

  .dot.setup-fill {
    background: var(--dot-setup-fill);
    border-color: transparent;
  }

  .dot.active {
    background: var(--dot-active);
    border-color: transparent;
    box-shadow: 0 0 5px var(--dot-active-glow);
  }

  .dot.gray {
    background: var(--dot-elapsed);
    border-color: transparent;
    box-shadow: none;
  }

  .grid.pulse .dot.gray {
    animation: breathe 1.1s ease-in-out 2;
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .panel {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .panel.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .lcd {
    background: var(--lcd-bg);
    padding: 12px 24px;
    pointer-events: none;
  }

  .readout {
    font-family: var(--font-mono);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.4rem, 10vw, 4.4rem);
    letter-spacing: 0.02em;
    color: var(--lcd-digit);
    line-height: 1;
    pointer-events: none;
  }

  .hint {
    font-family: var(--font-ui);
    font-size: 0.75rem;
    color: var(--win-text);
    letter-spacing: 0.02em;
    pointer-events: none;
  }

  .start-btn {
    background: var(--face);
    color: var(--win-text);
    border: none;
    font-family: var(--font-ui);
    font-weight: bold;
    font-size: 0.85rem;
    padding: 9px 24px;
    cursor: pointer;
    margin-top: 2px;
  }

  .start-btn:active {
    box-shadow:
      inset -1px -1px var(--bevel-hi),
      inset  1px  1px var(--bevel-dk),
      inset -2px -2px var(--bevel-lt),
      inset  2px  2px var(--bevel-sh);
    padding: 10px 23px 8px 25px;
  }
  .start-btn:focus-visible { outline: 1px dotted var(--win-text); outline-offset: -4px; }

  .running-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 6px 6px 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease;
  }

  .running-hud.visible { opacity: 1; visibility: visible; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .cancel-btn {
    width: 22px;
    height: 20px;
    background: var(--face);
    border: none;
    color: var(--win-text);
    font-family: var(--font-ui);
    font-size: 0.95rem;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    pointer-events: auto;
  }

  .cancel-btn:hover { background: #c00000; color: #fff; }
  .cancel-btn:active {
    box-shadow:
      inset -1px -1px var(--bevel-hi),
      inset  1px  1px var(--bevel-dk),
      inset -2px -2px var(--bevel-lt),
      inset  2px  2px var(--bevel-sh);
  }
  .cancel-btn:focus-visible { outline: 1px dotted var(--win-text); outline-offset: -3px; }

  .paused-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--face);
    color: var(--win-text);
    padding: 7px 16px;
    font-family: var(--font-ui);
    font-size: 0.72rem;
    font-weight: bold;
    letter-spacing: 0.02em;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
  }

  .app[data-paused="true"] .paused-label { opacity: 1; }

  .alert-box {
    background: var(--face);
    width: 230px;
  }

  .alert-title {
    background: linear-gradient(90deg, var(--title-from), var(--title-to));
    color: var(--title-text);
    font-weight: bold;
    font-size: 0.72rem;
    padding: 5px 8px;
  }

  .done-label {
    font-family: var(--font-ui);
    font-size: 0.85rem;
    color: var(--win-text);
    padding: 20px 14px 12px;
    text-align: center;
  }

  .restart-btn {
    display: block;
    margin: 0 auto 16px;
    background: var(--face);
    color: var(--win-text);
    border: none;
    font-family: var(--font-ui);
    font-weight: bold;
    font-size: 0.78rem;
    padding: 6px 24px;
    cursor: pointer;
  }

  .restart-btn:active {
    box-shadow:
      inset -1px -1px var(--bevel-hi),
      inset  1px  1px var(--bevel-dk),
      inset -2px -2px var(--bevel-lt),
      inset  2px  2px var(--bevel-sh);
  }
  .restart-btn:focus-visible { outline: 1px dotted var(--win-text); outline-offset: -4px; }

  @media (prefers-reduced-motion: reduce) {
    .dot, .grid, .panel, .running-hud, .paused-label {
      transition-duration: 0.01ms !important;
    }
    .grid.pulse .dot.gray { animation: none; }
  }
</style>
</head>
<body>

<div id="win95-window">
  <div id="win95-titlebar">
    <span class="tb-icon">&#8987;</span>
    <span class="tb-title">Field Timer</span>
    <div class="tb-btns">
      <button class="tb-btn" tabindex="-1" aria-hidden="true">_</button>
      <button class="tb-btn" tabindex="-1" aria-hidden="true">&#9633;</button>
      <button class="tb-btn tb-close" tabindex="-1" aria-hidden="true">&#10005;</button>
    </div>
  </div>

  <div class="screen-wrap bevel-sunken">
    <div class="app" id="app" data-state="setup" data-paused="false">
      <div class="grid" id="grid"></div>

      <div class="hud">
        <div class="panel visible" id="setupPanel">
          <div class="lcd bevel-sunken">
            <div class="readout" id="readout">10:00</div>
          </div>
          <div class="hint">Drag the field to set time</div>
          <button class="start-btn bevel-raised" id="startBtn" aria-label="Start timer">&#9654; Start</button>
        </div>

        <div class="running-hud" id="runningHud">
          <div class="remaining sr-only" id="remaining" aria-live="off">10:00</div>
          <button class="cancel-btn bevel-raised" id="cancelBtn" aria-label="Cancel timer">&times;</button>
        </div>
        <div class="paused-label bevel-raised">Paused &mdash; tap to resume</div>

        <div class="panel" id="donePanel">
          <div class="alert-box bevel-raised">
            <div class="alert-title">Field Timer</div>
            <div class="done-label" aria-live="polite">&#8987; Time&rsquo;s up!</div>
            <button class="restart-btn bevel-raised" id="restartBtn">OK</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var DOT = 11, GAP = 11, CELL = DOT + GAP, PAD = 18;
  var MIN_SECONDS = 1, MAX_SECONDS = 6 * 60 * 60;
  var LOG_MIN = Math.log(MIN_SECONDS), LOG_MAX = Math.log(MAX_SECONDS);

  var app = document.getElementById('app');
  var gridEl = document.getElementById('grid');
  var setupPanel = document.getElementById('setupPanel');
  var donePanel = document.getElementById('donePanel');
  var runningHud = document.getElementById('runningHud');
  var readoutEl = document.getElementById('readout');
  var remainingEl = document.getElementById('remaining');
  var startBtn = document.getElementById('startBtn');
  var cancelBtn = document.getElementById('cancelBtn');
  var restartBtn = document.getElementById('restartBtn');

  var state = 'setup';
  var cols = 0, rows = 0, total = 0;
  var dots = [];
  var order = [];
  var selectedSeconds = 600;
  var durationMs = 0, startTime = 0, pausedAt = 0, pausedAccum = 0;
  var rafId = null;

  function buildGrid() {
    var w = app.clientWidth, h = app.clientHeight;
    cols = Math.max(1, Math.floor((w - PAD * 2) / CELL));
    rows = Math.max(1, Math.floor((h - PAD * 2) / CELL));
    total = cols * rows;

    gridEl.style.gridTemplateColumns = 'repeat(' + cols + ', ' + DOT + 'px)';
    gridEl.style.gridTemplateRows = 'repeat(' + rows + ', ' + DOT + 'px)';
    gridEl.style.gap = GAP + 'px';
    gridEl.innerHTML = '';
    dots = [];

    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var d = document.createElement('div');
        d.className = 'dot';
        gridEl.appendChild(d);
        dots.push({ el: d, row: r, col: c });
      }
    }

    if (state === 'setup') {
      applySetupFill(selectedSeconds);
    } else if (state === 'running' || state === 'done') {
      order = bottomUpIndexOrder();
      applyRunningFrame();
    }
  }

  function bottomUpIndexOrder() {
    var arr = dots.map(function (d, i) { return i; });
    arr.sort(function (a, b) {
      var da = dots[a], db = dots[b];
      if (da.row !== db.row) return db.row - da.row;
      return db.col - da.col;
    });
    return arr;
  }

  function secondsToFrac(seconds) {
    seconds = Math.min(MAX_SECONDS, Math.max(MIN_SECONDS, seconds));
    return (Math.log(seconds) - LOG_MIN) / (LOG_MAX - LOG_MIN);
  }

  function fracToSeconds(frac) {
    frac = Math.min(1, Math.max(0, frac));
    return Math.round(Math.exp(LOG_MIN + frac * (LOG_MAX - LOG_MIN)));
  }

  function applySetupFill(seconds) {
    var frac = secondsToFrac(seconds);
    var count = Math.round(frac * total);
    var fillOrder = bottomUpIndexOrder();
    for (var i = 0; i < dots.length; i++) {
      dots[i].el.className = 'dot';
    }
    for (var j = 0; j < count; j++) {
      dots[fillOrder[j]].el.className = 'dot setup-fill';
    }
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function formatDuration(totalSeconds) {
    totalSeconds = Math.max(0, Math.round(totalSeconds));
    var h = Math.floor(totalSeconds / 3600);
    var m = Math.floor((totalSeconds % 3600) / 60);
    var s = totalSeconds % 60;
    if (h > 0) return h + ':' + pad2(m) + ':' + pad2(s);
    return m + ':' + pad2(s);
  }

  function formatReadout(seconds) {
    readoutEl.textContent = formatDuration(seconds);
  }

  function formatClock(ms) {
    return formatDuration(Math.ceil(ms / 1000));
  }

  // --- setup drag-to-set ---
  var dragging = false;

  function setDurationFromClientY(y) {
    var rect = app.getBoundingClientRect();
    var frac = 1 - (y - rect.top) / rect.height;
    frac = Math.min(1, Math.max(0, frac));
    var seconds = fracToSeconds(frac);
    if (seconds !== selectedSeconds) {
      selectedSeconds = seconds;
      formatReadout(selectedSeconds);
    }
    applySetupFill(selectedSeconds);
  }

  app.addEventListener('pointerdown', function (e) {
    if (state !== 'setup') return;
    if (e.target.closest('.start-btn')) return;
    dragging = true;
    app.setPointerCapture(e.pointerId);
    setDurationFromClientY(e.clientY);
  });

  app.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    setDurationFromClientY(e.clientY);
  });

  app.addEventListener('pointerup', function () { dragging = false; });
  app.addEventListener('pointercancel', function () { dragging = false; });

  // --- running / pause via tap ---
  app.addEventListener('click', function (e) {
    if (state !== 'running' && state !== 'paused') return;
    if (e.target.closest('.cancel-btn')) return;
    togglePause();
  });

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      pausedAt = performance.now();
      app.setAttribute('data-paused', 'true');
    } else if (state === 'paused') {
      pausedAccum += performance.now() - pausedAt;
      state = 'running';
      app.setAttribute('data-paused', 'false');
    }
  }

  function applyRunningFrame() {
    for (var i = 0; i < dots.length; i++) {
      dots[i].el.className = 'dot active';
    }
  }

  function tick() {
    if (state === 'running') {
      var now = performance.now();
      var elapsed = now - startTime - pausedAccum;
      var frac = Math.min(1, elapsed / durationMs);
      var grayCount = Math.floor(frac * total);

      for (var i = 0; i < grayCount; i++) {
        var d = dots[order[i]];
        if (d.el.className !== 'dot gray') d.el.className = 'dot gray';
      }

      remainingEl.textContent = formatClock(durationMs - elapsed);

      if (frac >= 1) {
        finish();
        return;
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function finish() {
    state = 'done';
    for (var i = 0; i < dots.length; i++) dots[i].el.className = 'dot gray';
    remainingEl.textContent = '00:00';
    setPanels();
    gridEl.classList.add('pulse');
    setTimeout(function () { gridEl.classList.remove('pulse'); }, 2400);
  }

  function setPanels() {
    setupPanel.classList.toggle('visible', state === 'setup');
    donePanel.classList.toggle('visible', state === 'done');
    runningHud.classList.toggle('visible', state === 'running' || state === 'paused');
    app.setAttribute('data-state', state);
  }

  function start() {
    state = 'running';
    app.setAttribute('data-paused', 'false');
    durationMs = selectedSeconds * 1000;
    startTime = performance.now();
    pausedAccum = 0;
    order = bottomUpIndexOrder();
    applyRunningFrame();
    remainingEl.textContent = formatClock(durationMs);
    setPanels();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  }

  function reset() {
    state = 'setup';
    if (rafId) cancelAnimationFrame(rafId);
    app.setAttribute('data-paused', 'false');
    formatReadout(selectedSeconds);
    applySetupFill(selectedSeconds);
    setPanels();
  }

  startBtn.addEventListener('click', function (e) { e.stopPropagation(); start(); });
  cancelBtn.addEventListener('click', function (e) { e.stopPropagation(); reset(); });
  restartBtn.addEventListener('click', function (e) { e.stopPropagation(); reset(); });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildGrid, 200);
  });

  formatReadout(selectedSeconds);
  buildGrid();
  setPanels();
})();
</script>

</body>
</html>
