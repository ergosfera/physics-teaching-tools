<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Hooke's Law Teacher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="stylesheet" href="../lab-teacher.css">
</head>
<body>
<script src="../lab-teacher.js"></script>
<script>
// Hooke's Law: the parts specific to this lab. Everything else comes from ../lab-teacher.js.
const PRED_TEXT = { same: 'Stays about the same', less: 'Increases, less than double', double: 'Doubles', more: 'More than double' };

function modelTest(t, L0) {
  const pred = num(t.pred), meas = num(t.meas);
  if (!t.locked || !isFinite(pred) || !isFinite(meas)) return NaN;
  return Math.abs(pred - meas) / Math.abs(meas - L0) * 100;
}

// ── Plots ───────────────────────────────────────────────────
function plotFx(svg, groups, W = 720, H = 420) {
  const M = { l: 62, r: 20, t: 18, b: 50 };
  const all = groups.flatMap(G => G.pts);
  const xs = all.map(p => p.x * 100), ys = all.map(p => p.y);
  const xStep = niceStep(Math.max(1, ...xs) - Math.min(0, ...xs), 6), yStep = niceStep(Math.max(0.5, ...ys), 6);
  const x0 = Math.floor(Math.min(0, ...xs) / xStep) * xStep, x1 = Math.ceil(Math.max(1, ...xs) / xStep) * xStep;
  const y0 = Math.floor(Math.min(0, ...ys) / yStep) * yStep, y1 = Math.ceil(Math.max(0.5, ...ys) / yStep) * yStep;
  const X = v => M.l + (v - x0) / (x1 - x0) * (W - M.l - M.r);
  const Y = v => H - M.b - (v - y0) / (y1 - y0) * (H - M.t - M.b);
  let s = `<defs><clipPath id="clip-${svg.id}"><rect x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}"/></clipPath></defs>`;
  for (let v = x0; v <= x1 + 1e-9; v += xStep) s += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${M.t}" y2="${H - M.b}"/><text x="${X(v)}" y="${H - M.b + 18}" text-anchor="middle">${fmt(v)}</text>`;
  for (let v = y0; v <= y1 + 1e-9; v += yStep) s += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${M.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  s += `<line class="axis" x1="${X(0)}" x2="${X(0)}" y1="${M.t}" y2="${H - M.b}"/><line class="axis" x1="${M.l}" x2="${W - M.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  s += `<text class="lbl" x="${(M.l + W - M.r) / 2}" y="${H - 8}" text-anchor="middle">Stretch Δx (cm)</text>`;
  s += `<text class="lbl" transform="translate(16 ${(M.t + H - M.b) / 2}) rotate(-90)" text-anchor="middle">Force F (N)</text>`;
  groups.forEach(G => {
    if (G.fit) {
      const f = xc => G.fit.k * xc / 100 + G.fit.b;
      s += `<line x1="${X(x0)}" y1="${Y(f(x0))}" x2="${X(x1)}" y2="${Y(f(x1))}" stroke="${G.color}" stroke-width="2" stroke-opacity=".75" clip-path="url(#clip-${svg.id})"/>`;
    }
    G.pts.forEach(p => { s += `<circle cx="${X(p.x * 100)}" cy="${Y(p.y)}" r="5.5" fill="${G.color}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(label(G))}: Δx=${fmt(p.x * 100)} cm, F=${fmt(p.y)} N</title></circle>`; });
  });
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = s;
}

function plotK(svg, groups) {
  const W = 520, H = 420, M = { l: 56, r: 16, t: 18, b: 70 };
  const gs = groups.filter(G => G.fit)
    .sort((a, b) => norm(a.s.spring).localeCompare(norm(b.s.spring)) || num(a.s.group) - num(b.s.group));
  if (!gs.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">No fits yet</text>`; return; }
  const hi = Math.max(...gs.map(G => G.fit.k + (G.fit.sk || 0)), ...gs.map(G => isFinite(G.ref) ? G.ref : 0));
  const lo = Math.min(0, ...gs.map(G => G.fit.k - (G.fit.sk || 0)));
  const step = niceStep(hi - lo, 6), y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi * 1.05 / step) * step;
  const Y = v => H - M.b - (v - y0) / (y1 - y0) * (H - M.t - M.b);
  const bw = (W - M.l - M.r) / gs.length, X = i => M.l + bw * (i + 0.5);
  let s = '';
  for (let v = y0; v <= y1 + 1e-9; v += step) s += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${M.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  s += `<text class="lbl" transform="translate(16 ${(M.t + H - M.b) / 2}) rotate(-90)" text-anchor="middle">k (N/m)</text>`;
  let start = 0;
  gs.forEach((G, i) => {
    const sp = norm(G.s.spring);
    if (i === gs.length - 1 || norm(gs[i + 1].s.spring) !== sp) {
      const xa = M.l + bw * start, xb = M.l + bw * (i + 1);
      if (start > 0) s += `<line class="axis" x1="${xa}" x2="${xa}" y1="${M.t}" y2="${H - M.b}" stroke-dasharray="2 4"/>`;
      const ref = isFinite(G.ref) ? G.ref : median(gs.filter(o => norm(o.s.spring) === sp).map(o => o.fit.k));
      s += `<line x1="${xa + 4}" x2="${xb - 4}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="6 4" opacity=".7"/>`;
      s += `<text class="lbl" x="${(xa + xb) / 2}" y="${H - 14}" text-anchor="middle">Spring ${esc(G.s.spring || '?')}</text>`;
      start = i + 1;
    }
  });
  gs.forEach((G, i) => {
    const x = X(i), k = G.fit.k, e = isFinite(G.fit.sk) ? G.fit.sk : 0;
    s += `<line x1="${x}" x2="${x}" y1="${Y(k - e)}" y2="${Y(k + e)}" stroke="${G.color}" stroke-width="2"/>`;
    s += `<line x1="${x - 6}" x2="${x + 6}" y1="${Y(k - e)}" y2="${Y(k - e)}" stroke="${G.color}" stroke-width="2"/><line x1="${x - 6}" x2="${x + 6}" y1="${Y(k + e)}" y2="${Y(k + e)}" stroke="${G.color}" stroke-width="2"/>`;
    s += `<circle cx="${x}" cy="${Y(k)}" r="6.5" fill="${G.color}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(label(G))}: k = ${fmt(k)} ± ${fmt(e, 2)} N/m</title></circle>`;
    s += `<text x="${x}" y="${H - M.b + 18}" text-anchor="middle">G${esc(G.s.group || '?')}</text>`;
  });
  svg.innerHTML = s;
}

function springTiles(fits) {
  return [...new Set(fits.map(G => G.s.spring || '?'))].sort().slice(0, 3).map(sp => {
    const ks = fits.filter(G => (G.s.spring || '?') === sp).map(G => G.fit.k);
    return `<div class="tile"><div class="k">Spring ${esc(sp)} · median k</div><div class="v">${fmt(median(ks))} <small>N/m</small></div><div class="s">${ks.length} group${ks.length === 1 ? '' : 's'} · range ${fmt(Math.min(...ks))}–${fmt(Math.max(...ks))}</div></div>`;
  }).join('');
}

LabTeacher({
  id: 'hookes-law',
  title: "Hooke's Law",
  icon: '🧪',
  studentPage: 'hookes_law_lab.html',
  tagline: 'Force vs stretch · spring constant k · predictions and conclusions',

  errors: {
    parallax: 'Parallax reading the ruler', oscillating: 'Spring still moving', reference: 'Changing reference points',
    ruler: 'Ruler not vertical / fixed', masses: 'Mass values not exact', limit: 'Beyond elastic limit',
  },
  questions: [
    { id: 'prediction', title: 'Prediction: if you double the mass, the stretch will…', get: s => s.prediction?.why, chart: 'pred' },
    { id: 'linear', title: 'Do the points fall on a straight line? Should it pass through the origin?', get: s => s.discuss?.linear },
    { id: 'slope', title: 'What does k tell you about the spring? How would a stiffer spring look?', get: s => s.answers?.slope },
    { id: 'intercept', title: 'What should the intercept be for an ideal spring? Why isn\'t yours?', get: s => s.answers?.intercept },
    { id: 'predcheck', title: 'Was your prediction right?', get: s => s.answers?.predcheck },
    { id: 'errors', title: 'Sources of error', get: s => s.conclusion?.errtext, chart: 'errors' },
    { id: 'conclusion', title: 'Conclusion', get: s => s.conclusion?.text },
    { id: 'roles', title: 'How did the pair share the work?', get: s => s.conclusion?.roles },
  ],
  questionChart(q) {
    const counts = {}; GROUPS.forEach(G => { const c = G.s.prediction?.choice; if (c) counts[c] = (counts[c] || 0) + 1; });
    return `<div class="bars">${Object.keys(PRED_TEXT).map(c => bar(PRED_TEXT[c], counts[c] || 0)).join('')}</div>`;
  },
  answerPrefix: (q, s) => q.id === 'prediction' && s.prediction?.choice ? PRED_TEXT[s.prediction.choice] + '.' : '',

  analyze(s) {
    const g = num(s.g) || 9.8, L0 = num(s.L0);
    const rows = (s.data || []).map(r => ({ m: num(r.m), L: num(r.L) })).filter(r => isFinite(r.m) && isFinite(r.L));
    const pts = isFinite(L0) ? rows.map(r => ({ x: (r.L - L0) / 100, y: r.m / 1000 * g })) : [];
    const fit = linfit(pts);
    return { g, L0, rows, pts, fit: fit && pts.length >= 3 ? fit : null, test: modelTest(s.test || {}, L0) };
  },
  // Reference k per spring: median of the OTHER groups with the same spring
  finish(groups) {
    groups.forEach(G => {
      const others = groups.filter(o => o !== G && norm(o.s.spring) === norm(G.s.spring) && o.fit).map(o => o.fit.k);
      G.ref = others.length >= 2 ? median(others) : NaN;
      G.refSrc = others.length >= 2 ? 'class median' : '';
    });
  },
  checks(G) {
    const s = G.s, f = G.fit, out = [];
    const n = G.pts.length;
    if (n < 5) out.push(['Only ' + n + ' points', 'red']);
    if (G.pts.some(p => p.x < 0)) out.push(['Δx < 0', 'red']);
    if (f) {
      if (f.r2 < 0.97) out.push(['Low R²', '']);
      const Fmax = Math.max(...G.pts.map(p => p.y));
      if (Math.abs(f.b) > 2 * (f.sb || 0) && Math.abs(f.b) > 0.15 * Fmax) out.push(['Large intercept', '']);
      if (isFinite(G.ref) && Math.abs(f.k - G.ref) / G.ref > 0.2) out.push(['k > 20% from ' + G.refSrc, 'red']);
      const kr = num(s.conclusion?.k);
      if (isFinite(kr)) {
        const ratio = kr / f.k;
        if (ratio > 50 || ratio < 0.02) out.push(['Unit error in reported k?', 'red']);
        else if (Math.abs(ratio - 1) > 0.15) out.push(['Reported k ≠ graph', '']);
      }
      if (!(num(s.conclusion?.dk) > 0)) out.push(['No uncertainty', '']);
    }
    if (!s.test?.locked) out.push(['Model test not done', '']);
    return out;
  },

  summaryHtml: `
    <div class="two">
      <div class="card">
        <h3>All groups: Force vs stretch</h3>
        <svg class="plot" id="all-plot" viewBox="0 0 720 420"></svg>
        <div class="legend" id="legend"></div>
      </div>
      <div class="card">
        <h3>Spring constant by group</h3>
        <svg class="plot" id="k-plot" viewBox="0 0 520 420"></svg>
        <div class="muted" style="font-size:.78rem;margin-top:6px">Bars show ± uncertainty of each fit. The dashed line is the class median for each spring.</div>
      </div>
    </div>`,
  renderSummary(on) {
    const fits = GROUPS.filter(G => G.fit);
    const tests = GROUPS.map(G => G.test).filter(isFinite);
    document.getElementById('tiles').innerHTML = `
      <div class="tile"><div class="k">Reports</div><div class="v">${GROUPS.length}</div><div class="s">${CFG.session ? 'session ' + esc(CFG.session) : 'all sessions'}</div></div>
      ${springTiles(fits)}
      <div class="tile"><div class="k">Median R²</div><div class="v">${fits.length ? median(fits.map(G => G.fit.r2)).toFixed(3) : '—'}</div><div class="s">how linear the data is</div></div>
      <div class="tile"><div class="k">Model tests within 10%</div><div class="v">${tests.filter(e => e <= 10).length}<small>/${tests.length}</small></div><div class="s">prediction vs measured stretch</div></div>`;
    plotFx(document.getElementById('all-plot'), on);
    plotK(document.getElementById('k-plot'), on);
  },

  resultsHead: '<th>Spring</th><th>n</th><th>k from graph (N/m)</th><th>R²</th><th>b (N)</th><th>k reported (N/m)</th><th>Model test</th>',
  resultsRow(G) {
    const f = G.fit, c = G.s.conclusion || {};
    return `<td>${esc(G.s.spring || '—')}</td><td>${G.pts.length}</td>
      <td>${f ? `<b>${fmt(f.k)}</b> <span class="muted">± ${fmt(f.sk, 2)}</span>` : '—'}</td>
      <td>${f ? f.r2.toFixed(3) : '—'}</td><td>${f ? fmt(f.b) : '—'}</td>
      <td>${c.k ? esc(c.k) + (c.dk ? ` <span class="muted">± ${esc(c.dk)}</span>` : '') : '<span class="muted">—</span>'}</td>
      <td>${isFinite(G.test) ? fmt(G.test, 2) + '% off' : '<span class="muted">—</span>'}</td>`;
  },

  slides(on) {
    return [
      { html: `<h2>What did every group measure?</h2>
        <div class="plot-wrap"><svg class="plot" id="show-fx"></svg></div>
        <div class="legend">${on.map(G => `<span class="chip"><i style="background:${G.color}"></i>${esc(label(G))}</span>`).join('')}</div>`,
        draw: () => plotFx(document.getElementById('show-fx'), on) },
      { html: `<h2>Spring constant k by group</h2>
        <div class="tiles">${springTiles(GROUPS.filter(G => G.fit))}</div>
        <div class="plot-wrap"><svg class="plot" id="show-k"></svg></div>`,
        draw: () => plotK(document.getElementById('show-k'), on) },
    ];
  },

  detail(G) {
    const s = G.s, f = G.fit, t = s.test || {}, c = s.conclusion || {};
    return `
      <div class="tiles">
        <div class="tile"><div class="k">k from graph</div><div class="v">${f ? fmt(f.k) : '—'} <small>N/m</small></div><div class="s">± ${f ? fmt(f.sk, 2) : '—'} · R² ${f ? f.r2.toFixed(4) : '—'} · b ${f ? fmt(f.b) : '—'} N</div></div>
        <div class="tile"><div class="k">k they reported</div><div class="v">${esc(c.k || '—')} <small>± ${esc(c.dk || '—')} N/m</small></div><div class="s">spring ${esc(s.spring || '—')}${isFinite(G.ref) ? ` · ${G.refSrc} ${fmt(G.ref)}` : ''}</div></div>
        <div class="tile"><div class="k">Model test</div><div class="v">${isFinite(G.test) ? fmt(G.test, 2) + '<small>% off</small>' : '—'}</div><div class="s">${esc(t.m || '—')} g: predicted ${esc(t.pred || '—')} cm, measured ${esc(t.meas || '—')} cm</div></div>
        ${sentTile(G)}
      </div>
      ${G.checks.length ? `<div>${flagsHtml(G)}</div>` : ''}
      <div class="two">
        <div class="card"><h3>Their data</h3><svg class="plot" id="detail-plot"></svg></div>
        <div class="card"><h3>Measurements (L₀ = ${esc(s.L0)} cm, ruler ${esc(s.res)} mm, g = ${fmt(G.g)})</h3>
          <div class="table-wrap"><table class="t"><thead><tr><th>m (g)</th><th>L (cm)</th><th>F (N)</th><th>Δx (cm)</th></tr></thead><tbody>
          ${G.rows.map(r => `<tr><td>${fmt(r.m, 4)}</td><td>${fmt(r.L, 4)}</td><td>${fmt(r.m / 1000 * G.g)}</td><td>${fmt(r.L - G.L0)}</td></tr>`).join('')}
          </tbody></table></div></div>
      </div>
      <div class="answers">
        ${detailAnswer('Prediction: ' + (PRED_TEXT[s.prediction?.choice] || '—'), s.prediction?.why)}
        ${detailAnswer('Is it linear? Through the origin?', s.discuss?.linear)}
        ${detailAnswer('Meaning of k', s.answers?.slope)}
        ${detailAnswer('Meaning of the intercept', s.answers?.intercept)}
        ${detailAnswer('Was the prediction right?', s.answers?.predcheck)}
        ${detailAnswer(errorsTitle(c), c.errtext)}
        ${detailAnswer('Conclusion', c.text)}
        ${detailAnswer('How they shared the work', c.roles)}
      </div>`;
  },
  drawDetail: G => plotFx(document.getElementById('detail-plot'), [G], 640, 380),

  computed: G => ({ fit_N_per_m: G.fit, model_test_percent_off: isFinite(G.test) ? G.test : null }),
  csv: {
    head: ['session', 'group', 'students', 'spring', 'n', 'k_fit_N_per_m', 'k_unc', 'R2', 'intercept_N', 'k_reported', 'dk_reported', 'model_test_pct_off'],
    rows: G => {
      const f = G.fit || {};
      return [[G.s.session, G.s.group, who(G), G.s.spring, G.pts.length, f.k, f.sk, f.r2, f.b, G.s.conclusion?.k, G.s.conclusion?.dk, G.test]];
    },
  },

  demo() {
    const rnd = (a, b) => a + Math.random() * (b - a);
    const names = ['Ana Ruiz', 'Juan Pérez', 'Laura Gómez', 'Andrés Díaz', 'Sofía Castro', 'Mateo Rojas', 'Valentina Mora', 'Samuel Ortiz',
      'Isabella Vargas', 'Tomás Herrera', 'Mariana López', 'Nicolás Silva', 'Camila Torres', 'Daniel Ramírez', 'Sara Medina', 'Felipe Ríos'];
    const preds = ['double', 'double', 'double', 'more', 'less', 'double', 'same', 'double'];
    const texts = {
      linear: ['Yes, the points look like a straight line. It should pass through the origin because with no extra force the spring does not stretch.',
        'Most points are on a line but the last one is a bit higher. With zero mass there is zero stretch so it should go through (0,0).'],
      slope: ['k tells us how much force is needed to stretch the spring one meter. A stiffer spring would have a steeper line because it needs more force for the same stretch.',
        'The slope is the spring constant. A bigger k means a harder spring, so the graph would be steeper.'],
      intercept: ['It should be zero because no force means no stretch. Ours is not zero because the first coils of the spring were pressed together and because of reading errors on the ruler.',
        'Ideally zero. We think the hanger was not included at first and our measurements have parallax errors.'],
      predcheck: ['Yes, when we went from 100 g to 200 g the stretch went from 4.1 cm to 8.0 cm, almost double.', 'No, we thought it would be more than double, but the data shows it doubles.'],
      conclusion: ['We found that the force is directly proportional to the stretch of the spring, as Hooke\'s law says. The spring constant is about 25 N/m with an uncertainty of 0.6 N/m. Our R squared is 0.998 so the data is very linear, and the model test predicted the length with only 3% error, so we are confident in the result.',
        'The force and the stretch are proportional. We are fairly confident because the graph is a straight line.'],
      roles: ['Ana hung the masses and Juan read the ruler; we both wrote the answers together.', 'We took turns.'],
    };
    const reports = [];
    for (let gi = 1; gi <= 8; gi++) {
      const spring = gi <= 5 ? 'A' : 'B', ktrue = spring === 'A' ? 25 : 42, L0 = +rnd(10, 13).toFixed(1);
      const nPts = gi === 7 ? 4 : 6 + (gi % 3), good = gi !== 7 && gi !== 4;
      const data = [];
      for (let i = 1; i <= nPts; i++) {
        const m = (spring === 'A' ? 50 : 100) * i;
        const dx = m / 1000 * 9.8 / ktrue * 100 + rnd(-0.25, 0.25) * (good ? 1 : 4) + (gi === 4 ? 0.8 : 0);
        data.push({ m: String(m), L: (L0 + dx).toFixed(1) });
      }
      const f = linfit(data.map(r => ({ x: (num(r.L) - L0) / 100, y: num(r.m) / 1000 * 9.8 })));
      const tm = spring === 'A' ? 275 : 450, tdx = tm / 1000 * 9.8 / f.k * 100;
      const pick = k => good ? texts[k][0] : texts[k][1];
      reports.push({
        schema: 1, lab: 'hookes-law', id: 'demo' + gi, session: 'DEMO', group: String(gi), students: [names[gi * 2 - 2], names[gi * 2 - 1]], spring,
        g: 9.8, L0: String(L0), res: '1', prediction: { choice: preds[gi - 1], why: 'Because the force doubles, so the spring should stretch twice as much.' },
        data, discuss: { linear: pick('linear') },
        answers: { slope: pick('slope'), intercept: pick('intercept'), predcheck: preds[gi - 1] === 'double' ? texts.predcheck[0] : texts.predcheck[1] },
        test: { m: String(tm), pred: (L0 + tdx * (gi === 6 ? 1.3 : 1)).toFixed(1), locked: gi !== 7, meas: gi === 7 ? '' : (L0 + tm / 1000 * 9.8 / ktrue * 100 + rnd(-0.3, 0.3)).toFixed(1) },
        conclusion: { k: gi === 3 ? fmt(f.k / 100) : fmt(f.k), dk: gi === 5 ? '' : fmt(f.sk, 2), errors: ['parallax', 'oscillating', 'masses', 'reference'].filter(() => Math.random() < 0.5),
          errtext: gi === 2 ? 'The spring kept bouncing for a long time with the heavier masses.' : '', text: pick('conclusion'), roles: pick('roles') },
        startedAt: new Date().toISOString(), submittedAt: new Date(Date.now() - (9 - gi) * 60000).toISOString(),
      });
    }
    return reports;
  },
});
</script>
</body>
</html>
