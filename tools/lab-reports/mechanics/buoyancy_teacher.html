<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Buoyant Force Teacher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="stylesheet" href="../lab-teacher.css">
</head>
<body>
<script src="../lab-teacher.js"></script>
<script>
// Buoyant Force: the parts specific to this lab. Everything else comes from ../lab-teacher.js.
// Each group measures one liquid; the class graph of slope against density gives the density dependence.
const G_REF = 9.8;
const PRED_IN = { same: 'Stays the same', up: 'Goes up', down: 'Goes down' };
const PRED_DEPTH = { same: 'Stays about the same', less: 'Grows, less than double', double: 'Doubles', more: 'More than double' };
const PRED_DENS = { smaller: 'Smaller', same: 'The same', bigger: 'Bigger' };

function modelTest(t) {
  const pred = num(t.pred), meas = num(t.meas);
  if (!t.locked || !isFinite(pred) || !isFinite(meas) || meas === 0) return NaN;
  return Math.abs(pred - meas) / Math.abs(meas) * 100;
}

// Class fit of slope (N/m³) against density (kg/m³): its slope is g. The densities span a narrow
// range, so a free intercept swings with one bad group; zero density means zero force, so fit y = k·x.
function classPoints(groups) { return groups.filter(G => G.fit && isFinite(G.rho)).map(G => ({ x: G.rho, y: G.fit.k, e: G.fit.sk, G })); }
function classFit(groups) {
  const p = classPoints(groups), n = p.length;
  if (n < 3) return null;
  const sxx = p.reduce((a, q) => a + q.x * q.x, 0), k = p.reduce((a, q) => a + q.x * q.y, 0) / sxx;
  const ssr = p.reduce((a, q) => a + (q.y - k * q.x) ** 2, 0), my = p.reduce((a, q) => a + q.y, 0) / n;
  const syy = p.reduce((a, q) => a + (q.y - my) ** 2, 0);
  return { n, k, b: 0, sk: Math.sqrt(ssr / (n - 1) / sxx), r2: syy > 0 ? 1 - ssr / syy : 1 };
}

// ── Plots ───────────────────────────────────────────────────
// series: [{ pts: [{x, y, e?, tip?}] in SI, fit?, color, name }]; o.xs scales x for display (m³ → cm³).
// o.ref draws a dashed reference line y = o.ref · x (in SI). Both axes include the origin.
function plotXY(svg, series, o, W = 720, H = 420) {
  const M = { l: 72, r: 20, t: 18, b: 50 }, xs = o.xs || 1;
  const all = series.flatMap(s => s.pts);
  const xv = all.map(p => p.x * xs), yv = all.flatMap(p => [p.y + (p.e || 0), p.y - (p.e || 0)]);
  const xMax = Math.max(...xv, 0) || 10, yMax = Math.max(...yv, 0) || 0.5;
  const xStep = niceStep(xMax - Math.min(0, ...xv), 6), yStep = niceStep(yMax - Math.min(0, ...yv), 6);
  const x0 = Math.floor(Math.min(0, ...xv) / xStep) * xStep, x1 = Math.ceil(xMax / xStep) * xStep;
  const y0 = Math.floor(Math.min(0, ...yv) / yStep) * yStep, y1 = Math.ceil(yMax / yStep) * yStep;
  const X = v => M.l + (v - x0) / (x1 - x0) * (W - M.l - M.r);
  const Y = v => H - M.b - (v - y0) / (y1 - y0) * (H - M.t - M.b);
  let s = `<defs><clipPath id="clip-${svg.id}"><rect x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}"/></clipPath></defs>`;
  for (let v = x0; v <= x1 + 1e-9 * xStep; v += xStep) s += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${M.t}" y2="${H - M.b}"/><text x="${X(v)}" y="${H - M.b + 18}" text-anchor="middle">${fmt(v)}</text>`;
  for (let v = y0; v <= y1 + 1e-9 * yStep; v += yStep) s += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${M.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  s += `<line class="axis" x1="${X(0)}" x2="${X(0)}" y1="${M.t}" y2="${H - M.b}"/><line class="axis" x1="${M.l}" x2="${W - M.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  s += `<text class="lbl" x="${(M.l + W - M.r) / 2}" y="${H - 8}" text-anchor="middle">${o.xl}</text>`;
  s += `<text class="lbl" transform="translate(16 ${(M.t + H - M.b) / 2}) rotate(-90)" text-anchor="middle">${o.yl}</text>`;
  if (o.ref) s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(x1)}" y2="${Y(o.ref * x1 / xs)}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="6 4" opacity=".6" clip-path="url(#clip-${svg.id})"/>`;
  series.forEach(sr => {
    if (!sr.fit) return;
    const f = xd => sr.fit.k * xd / xs + sr.fit.b;
    s += `<line x1="${X(x0)}" y1="${Y(f(x0))}" x2="${X(x1)}" y2="${Y(f(x1))}" stroke="${sr.color}" stroke-width="${sr.wide ? 3 : 2}" stroke-opacity=".8" clip-path="url(#clip-${svg.id})"/>`;
  });
  series.forEach(sr => sr.pts.forEach(p => {
    if (p.e > 0) s += `<line x1="${X(p.x * xs)}" x2="${X(p.x * xs)}" y1="${Y(p.y - p.e)}" y2="${Y(p.y + p.e)}" stroke="${p.color || sr.color}" stroke-width="1.5"/>`;
    s += `<circle cx="${X(p.x * xs)}" cy="${Y(p.y)}" r="${p.big ? 7 : 5.5}" fill="${p.color || sr.color}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(p.name || sr.name)}${p.tip ? ' · ' + esc(p.tip) : ''}</title></circle>`;
    if (p.label) s += `<text x="${X(p.x * xs) + 9}" y="${Y(p.y) - 8}">${esc(p.label)}</text>`;
  }));
  if (!all.length) s += `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">No data yet</text>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = s;
}

// Every group's F_b vs V with its fit
function plotFV(svg, groups, W, H) {
  plotXY(svg, groups.map(G => ({ pts: G.pts, fit: G.fit, color: G.color, name: label(G) + ' · ' + G.liquid })),
    { xs: 1e6, xl: 'Volume under the liquid V (cm³)', yl: 'Buoyant force Fb (N)' }, W, H);
}
// The class graph: one point per group (its slope against its density) and the class fit
function plotDens(svg, groups, W, H, labels = true) {
  const pts = classPoints(groups).map(p => ({ x: p.x, y: p.y, e: p.e, color: p.G.color, big: true, name: label(p.G),
    label: labels ? p.G.liquid : '', tip: `${p.G.liquid}: ρ=${fmt(p.x)} kg/m³, slope=${fmt(p.y)} N/m³` }));
  plotXY(svg, [{ pts, fit: classFit(groups), color: 'var(--text)', name: 'Class', wide: true }],
    { xs: 1, xl: 'Density of the liquid ρ (kg/m³)', yl: 'Slope of Fb vs V (N/m³)' }, W, H);
}

function plotG(svg, groups) {
  const W = 520, H = 420, M = { l: 56, r: 16, t: 18, b: 70 };
  const gs = groups.filter(G => isFinite(G.gq)).sort((a, b) => a.rho - b.rho || num(a.s.group) - num(b.s.group));
  if (!gs.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">No results yet</text>`; return; }
  const errs = G => isFinite(G.dgq) ? G.dgq : 0;
  const hi = Math.max(G_REF, ...gs.map(G => G.gq + errs(G))), lo = Math.min(0, ...gs.map(G => G.gq - errs(G)));
  const step = niceStep(hi - lo, 6), y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi * 1.05 / step) * step;
  const Y = v => H - M.b - (v - y0) / (y1 - y0) * (H - M.t - M.b);
  const bw = (W - M.l - M.r) / gs.length, X = i => M.l + bw * (i + 0.5);
  let s = '';
  for (let v = y0; v <= y1 + 1e-9; v += step) s += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${M.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  s += `<text class="lbl" transform="translate(16 ${(M.t + H - M.b) / 2}) rotate(-90)" text-anchor="middle">slope ÷ density (N/kg)</text>`;
  s += `<line x1="${M.l}" x2="${W - M.r}" y1="${Y(G_REF)}" y2="${Y(G_REF)}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="6 4" opacity=".7"/>`;
  s += `<text x="${W - M.r - 4}" y="${Y(G_REF) - 6}" text-anchor="end">g = ${G_REF}</text>`;
  gs.forEach((G, i) => {
    const x = X(i), k = G.gq, e = errs(G);
    s += `<line x1="${x}" x2="${x}" y1="${Y(k - e)}" y2="${Y(k + e)}" stroke="${G.color}" stroke-width="2"/>`;
    s += `<line x1="${x - 6}" x2="${x + 6}" y1="${Y(k - e)}" y2="${Y(k - e)}" stroke="${G.color}" stroke-width="2"/><line x1="${x - 6}" x2="${x + 6}" y1="${Y(k + e)}" y2="${Y(k + e)}" stroke="${G.color}" stroke-width="2"/>`;
    s += `<circle cx="${x}" cy="${Y(k)}" r="6.5" fill="${G.color}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(label(G))} (${esc(G.liquid)}): ${fmt(k)} ± ${fmt(e, 2)} N/kg</title></circle>`;
    s += `<text x="${x}" y="${H - M.b + 18}" text-anchor="middle">G${esc(G.s.group || '?')}</text>`;
    s += `<text x="${x}" y="${H - M.b + 34}" text-anchor="middle" font-size="10">${esc(G.liquid.slice(0, 10))}</text>`;
  });
  svg.innerHTML = s;
}

function classTiles(on) {
  const cf = classFit(on), liquids = new Set(on.filter(G => G.fit).map(G => norm(G.liquid)));
  return `<div class="tile"><div class="k">Class g (slope vs density)</div><div class="v">${cf ? fmt(cf.k) : '—'} <small>N/kg</small></div><div class="s">${cf ? `± ${fmt(cf.sk, 2)} · R² ${cf.r2.toFixed(3)}` : 'needs 3 groups with results'}</div></div>
    <div class="tile"><div class="k">Liquids measured</div><div class="v">${liquids.size}</div><div class="s">${classPoints(on).length} groups on the class graph</div></div>`;
}

LabTeacher({
  id: 'buoyancy',
  title: 'Buoyant Force',
  icon: '🚢',
  studentPage: 'buoyancy_lab.html',
  tagline: 'One liquid per group · buoyant force vs volume · the class finds the density dependence',

  errors: {
    touching: 'Touched bottom / wall', depth: 'Reading the depth mark', tilt: 'Cylinder not vertical',
    balance: 'Balance not steady / tared', bubbles: 'Air bubbles', density: 'Density imprecise',
  },
  questions: [
    { id: 'prediction', title: 'Predictions: the reading when the cylinder goes in, twice as deep, and in a denser liquid', get: s => s.prediction?.why, chart: 'pred' },
    { id: 'linear', title: 'Is F vs V a straight line? Through the origin?', get: s => s.discuss?.linear },
    { id: 'slope', title: 'What does the slope (N/m³) mean?', get: s => s.answers?.slope },
    { id: 'gslope', title: 'Slope ÷ density: which constant? Why?', get: s => s.answers?.gslope },
    { id: 'others', title: 'How will the other liquids\' lines compare with yours?', get: s => s.answers?.others },
    { id: 'law', title: 'Their formula: F_b = …', get: s => s.answers?.law },
    { id: 'predcheck', title: 'Were the predictions right?', get: s => s.answers?.predcheck },
    { id: 'errors', title: 'Sources of error', get: s => s.conclusion?.errtext, chart: 'errors' },
    { id: 'conclusion', title: 'Conclusion', get: s => s.conclusion?.text },
    { id: 'roles', title: 'How did the pair share the work?', get: s => s.conclusion?.roles },
  ],
  questionChart(q) {
    const tally = (key, names) => {
      const counts = {}; GROUPS.forEach(G => { const c = G.s.prediction?.[key]; if (c) counts[c] = (counts[c] || 0) + 1; });
      return `<div class="bars">${Object.keys(names).map(c => bar(names[c], counts[c] || 0)).join('')}</div>`;
    };
    return `<div class="muted" style="font-size:.8rem">When the cylinder goes in, the reading…</div>${tally('into', PRED_IN)}
      <div class="muted" style="font-size:.8rem;margin-top:8px">Twice as deep, the change…</div>${tally('depth', PRED_DEPTH)}
      <div class="muted" style="font-size:.8rem;margin-top:8px">A denser liquid gives a change that is…</div>${tally('dens', PRED_DENS)}`;
  },
  answerPrefix: (q, s) => q.id === 'prediction' && s.prediction?.depth
    ? [PRED_IN[s.prediction.into], PRED_DEPTH[s.prediction.depth], PRED_DENS[s.prediction.dens]].filter(Boolean).join(' · ') + '.' : '',

  analyze(s) {
    const g = num(s.g) || G_REF, d = num(s.d), A = d > 0 ? Math.PI * d * d / 4 : NaN;
    const l = s.liquid || {}, V = num(l.V), m = num(l.m), rho = V > 0 && m > 0 ? m / V * 1000 : NaN;
    const rows = (s.data || []).map(r => ({ h: num(r.h), R: num(r.R) })).filter(r => isFinite(r.h) && isFinite(r.R));
    const pts = A > 0 ? rows.filter(r => r.h >= 0).map(r => ({ x: A * r.h * 1e-6, y: r.R / 1000 * g, tip: `h=${fmt(r.h)} cm, ${fmt(r.R)} g` })) : [];
    const fit = pts.length >= 3 ? linfit(pts) : null;
    const gq = fit && rho > 0 ? fit.k / rho : NaN, dgq = fit && rho > 0 ? fit.sk / rho : NaN;
    return { g, d, A, liquid: String(l.name || '').trim() || '?', V, m, rho, rows, pts, fit, gq, dgq, test: modelTest(s.test || {}) };
  },
  checks(G) {
    const s = G.s, out = [];
    if (G.pts.length < 5) out.push(['Only ' + G.pts.length + ' points', 'red']);
    if (!isFinite(G.rho)) out.push(['No density', 'red']);
    else if (/^\s*(water|agua)\s*$/i.test(G.liquid) ? Math.abs(G.rho - 1000) > 100 : G.rho < 600 || G.rho > 1600) out.push(['ρ = ' + fmt(G.rho) + ' kg/m³?', '']);
    if (G.rows.some(r => r.R < 0)) out.push(['Negative readings', 'red']);
    if (G.fit && G.fit.r2 < 0.97) out.push(['Low R²', '']);
    if (isFinite(G.gq) && Math.abs(G.gq - G_REF) / G_REF > 0.15) out.push(['slope ÷ ρ > 15% from ' + G_REF, 'red']);
    const c = s.conclusion || {}, gr = num(c.g);
    if (isFinite(gr) && isFinite(G.gq)) {
      const ratio = gr / G.gq;
      if (ratio > 50 || ratio < 0.02) out.push(['Unit error in reported g?', 'red']);
      else if (Math.abs(ratio - 1) > 0.15) out.push(['Reported g ≠ graph', '']);
    }
    if (G.fit && !(num(c.dg) > 0)) out.push(['No uncertainty', '']);
    if (!s.test?.locked) out.push(['Model test not done', '']);
    return out;
  },

  summaryHtml: `
    <div class="two">
      <div class="card">
        <h3>The class graph: slope of F<sub>b</sub> vs V against the density of the liquid</h3>
        <svg class="plot" id="dens-plot" viewBox="0 0 720 420"></svg>
        <div class="muted" style="font-size:.78rem;margin-top:6px">Each point is one group and its liquid; the bars are the uncertainty of its slope. The line is the fit of all groups through the origin: its slope is g.</div>
      </div>
      <div class="card">
        <h3>Slope ÷ density, by group</h3>
        <svg class="plot" id="g-plot" viewBox="0 0 520 420"></svg>
        <div class="muted" style="font-size:.78rem;margin-top:6px">Sorted by density. The dashed line is 9.8 N/kg.</div>
      </div>
    </div>
    <div class="card" style="margin-top:18px">
      <h3>All groups: F<sub>b</sub> vs V</h3>
      <svg class="plot" id="all-plot" viewBox="0 0 720 420"></svg>
      <div class="legend" id="legend"></div>
    </div>`,
  renderSummary(on) {
    const tests = GROUPS.map(G => G.test).filter(isFinite), fits = GROUPS.filter(G => G.fit);
    document.getElementById('tiles').innerHTML = `
      <div class="tile"><div class="k">Reports</div><div class="v">${GROUPS.length}</div><div class="s">${CFG.session ? 'session ' + esc(CFG.session) : 'all sessions'}</div></div>
      ${classTiles(on)}
      <div class="tile"><div class="k">Median R²</div><div class="v">${fits.length ? median(fits.map(G => G.fit.r2)).toFixed(3) : '—'}</div><div class="s">how linear F vs V is</div></div>
      <div class="tile"><div class="k">Model tests within 10%</div><div class="v">${tests.filter(e => e <= 10).length}<small>/${tests.length}</small></div><div class="s">predicted vs measured reading</div></div>`;
    plotDens(document.getElementById('dens-plot'), on);
    plotG(document.getElementById('g-plot'), on);
    plotFV(document.getElementById('all-plot'), on);
  },

  resultsHead: '<th>Liquid</th><th>ρ (kg/m³)</th><th>n</th><th>Slope (N/m³)</th><th>R²</th><th>slope ÷ ρ (N/kg)</th><th>g reported (N/kg)</th><th>Model test</th>',
  resultsRow(G) {
    const f = G.fit, c = G.s.conclusion || {};
    return `<td>${esc(G.liquid)}</td><td>${fmt(G.rho)}</td><td>${G.pts.length}</td>
      <td>${f ? `<b>${fmt(f.k)}</b> <span class="muted">± ${fmt(f.sk, 2)}</span>` : '—'}</td>
      <td>${f ? f.r2.toFixed(3) : '—'}</td>
      <td>${isFinite(G.gq) ? `<b>${fmt(G.gq)}</b> <span class="muted">± ${fmt(G.dgq, 2)}</span>` : '—'}</td>
      <td>${c.g ? esc(c.g) + (c.dg ? ` <span class="muted">± ${esc(c.dg)}</span>` : '') : '<span class="muted">—</span>'}</td>
      <td>${isFinite(G.test) ? fmt(G.test, 2) + '% off' : '<span class="muted">—</span>'}</td>`;
  },

  slides(on) {
    const legend = `<div class="legend">${on.map(G => `<span class="chip"><i style="background:${G.color}"></i>${esc(label(G))} · ${esc(G.liquid)}</span>`).join('')}</div>`;
    return [
      { html: `<h2>Every group, every liquid: F<sub>b</sub> against V</h2>
        <div class="plot-wrap"><svg class="plot" id="show-fv"></svg></div>${legend}`,
        draw: () => plotFV(document.getElementById('show-fv'), on) },
      { html: `<h2>Why are the slopes different? Slope against density</h2>
        <div class="tiles">${classTiles(on)}</div>
        <div class="plot-wrap"><svg class="plot" id="show-dens"></svg></div>`,
        draw: () => plotDens(document.getElementById('show-dens'), on) },
      { html: `<h2>Slope ÷ density for every group</h2>
        <div class="plot-wrap"><svg class="plot" id="show-g"></svg></div>`,
        draw: () => plotG(document.getElementById('show-g'), on) },
    ];
  },

  detail(G) {
    const s = G.s, f = G.fit, t = s.test || {}, c = s.conclusion || {};
    return `
      <div class="tiles">
        <div class="tile"><div class="k">Slope from graph</div><div class="v">${f ? fmt(f.k) : '—'} <small>N/m³</small></div><div class="s">± ${f ? fmt(f.sk, 2) : '—'} · R² ${f ? f.r2.toFixed(4) : '—'} · b ${f ? fmt(f.b) : '—'} N</div></div>
        <div class="tile"><div class="k">Slope ÷ density</div><div class="v">${fmt(G.gq)} <small>N/kg</small></div><div class="s">${esc(G.liquid)}, ρ = ${fmt(G.rho)} kg/m³ (${esc(s.liquid?.m || '—')} g in ${esc(s.liquid?.V || '—')} mL)</div></div>
        <div class="tile"><div class="k">They reported</div><div class="v" style="font-size:1rem">slope ${esc(c.k || '—')} ± ${esc(c.dk || '—')} N/m³<br>g ${esc(c.g || '—')} ± ${esc(c.dg || '—')} N/kg</div><div class="s">formula: F<sub>b</sub> = ${esc(s.answers?.law || '—')}</div></div>
        <div class="tile"><div class="k">Model test</div><div class="v">${isFinite(G.test) ? fmt(G.test, 2) + '<small>% off</small>' : '—'}</div><div class="s">h ${esc(t.h || '—')} cm: predicted ${esc(t.pred || '—')} g, measured ${esc(t.meas || '—')} g</div></div>
        ${sentTile(G)}
      </div>
      ${G.checks.length ? `<div>${flagsHtml(G)}</div>` : ''}
      <div class="two">
        <div class="card"><h3>Their data</h3><svg class="plot" id="detail-plot"></svg></div>
        <div class="card"><h3>Measurements (cylinder ${esc(s.cyl || '—')}, d = ${esc(s.d || '—')} cm, A = ${fmt(G.A)} cm², g = ${fmt(G.g)})</h3>
          <div class="table-wrap"><table class="t"><thead><tr><th>h (cm)</th><th>Reading (g)</th><th>V (cm³)</th><th>F<sub>b</sub> (N)</th></tr></thead><tbody>
          ${G.rows.map(r => `<tr><td>${fmt(r.h, 4)}</td><td>${fmt(r.R, 4)}</td><td>${fmt(G.A * r.h)}</td><td>${fmt(r.R / 1000 * G.g)}</td></tr>`).join('')}
          </tbody></table></div></div>
      </div>
      <div class="answers">
        ${detailAnswer('Prediction: ' + [PRED_IN[s.prediction?.into], PRED_DEPTH[s.prediction?.depth], PRED_DENS[s.prediction?.dens]].map(x => x || '—').join(' · '), s.prediction?.why)}
        ${detailAnswer('Is F vs V linear? Through the origin?', s.discuss?.linear)}
        ${detailAnswer('Meaning of the slope', s.answers?.slope)}
        ${detailAnswer('Slope ÷ density', s.answers?.gslope)}
        ${detailAnswer('How will other liquids compare?', s.answers?.others)}
        ${detailAnswer('Were the predictions right?', s.answers?.predcheck)}
        ${detailAnswer(errorsTitle(c), c.errtext)}
        ${detailAnswer('Conclusion', c.text)}
        ${detailAnswer('How they shared the work', c.roles)}
      </div>`;
  },
  drawDetail: G => plotFV(document.getElementById('detail-plot'), [G], 640, 380),

  computed: G => ({ area_cm2: G.A, rho_kg_m3: G.rho, fit_N_per_m3: G.fit, slope_over_rho_N_per_kg: isFinite(G.gq) ? G.gq : null, model_test_percent_off: isFinite(G.test) ? G.test : null }),
  csv: {
    head: ['session', 'group', 'students', 'liquid', 'rho_kg_m3', 'cylinder', 'd_cm', 'n', 'slope_N_per_m3', 'slope_unc', 'R2', 'slope_over_rho', 'k_reported', 'dk_reported', 'g_reported', 'dg_reported', 'law', 'model_test_pct_off'],
    rows: G => {
      const f = G.fit || {}, c = G.s.conclusion || {};
      return [[G.s.session, G.s.group, who(G), G.liquid, G.rho, G.s.cyl, G.d, G.pts.length, f.k, f.sk, f.r2, G.gq, c.k, c.dk, c.g, c.dg, G.s.answers?.law, G.test]];
    },
  },

  demo() {
    const rnd = (a, b) => a + Math.random() * (b - a);
    const names = ['Ana Ruiz', 'Juan Pérez', 'Laura Gómez', 'Andrés Díaz', 'Sofía Castro', 'Mateo Rojas', 'Valentina Mora', 'Samuel Ortiz',
      'Isabella Vargas', 'Tomás Herrera', 'Mariana López', 'Nicolás Silva', 'Camila Torres', 'Daniel Ramírez', 'Sara Medina', 'Felipe Ríos'];
    const LIQS = [['Water', 1.00], ['Salt water', 1.17], ['Vegetable oil', 0.92], ['Alcohol', 0.80], ['Glycerin', 1.26], ['Water', 1.00], ['Salt water', 1.17], ['Alcohol', 0.80]];
    const texts = {
      linear: ['Yes, the points fall on a straight line. It should pass through the origin because with no volume under the liquid there is no buoyant force.',
        'Mostly a line. With zero depth the balance shows zero so it goes through (0,0).'],
      slope: ['The slope is the buoyant force for each cubic meter of cylinder under the liquid, so it is the weight of one cubic meter of our liquid.',
        'It is how much force per volume.'],
      gslope: ['It is close to g = 9.8 N/kg. N/m³ divided by kg/m³ gives N/kg, because the buoyant force is the weight of the liquid pushed aside: mass is ρV and weight is ρVg.',
        'It is close to gravity, 9.8.'],
      others: ['A denser liquid weighs more per cubic meter, so its line should be steeper, and a lighter liquid like alcohol should give a less steep line. Slope divided by density should be about 9.8 for everyone.',
        'Denser liquids should have steeper lines.'],
      predcheck: ['We predicted it would double and it did: at 3 cm the reading was 14.8 g and at 6 cm it was 29.5 g. We also predicted the reading would go up and it did.',
        'We thought the reading would not change because the cylinder does not touch the beaker, but it went up.'],
      conclusion: ['The buoyant force is directly proportional to the volume of the cylinder under the liquid: R² was 0.999. The slope divided by the density of our liquid gave 9.7 N/kg, close to g, so F = ρ·g·V. Our model test was only 3% off, so we are confident.',
        'The force depends on the volume. Our g was a bit off but close.'],
      roles: ['One of us lowered the cylinder, the other read the balance, and we wrote the answers together.', 'We took turns.'],
    };
    const reports = [];
    for (let gi = 1; gi <= 8; gi++) {
      const good = gi !== 4 && gi !== 7, d = +rnd(2.45, 2.55).toFixed(2), A = Math.PI * d * d / 4;
      const [lname, r] = LIQS[gi - 1], rTrue = r * rnd(0.99, 1.01);
      const data = [];
      for (let h = 1; h <= (gi === 7 ? 4 : 7); h++) data.push({ h: String(h), R: (rTrue * A * h * (gi === 4 ? 0.85 : 1) + rnd(-0.3, 0.3) * (good ? 1 : 3)).toFixed(1) });
      const liquid = { name: lname, V: '50', m: (50 * rTrue * rnd(0.985, 1.015)).toFixed(1) };
      const L = this.analyze({ g: 9.8, d: String(d), liquid, data });
      const pick = k => good ? texts[k][0] : texts[k][1];
      const th = 4.5, predR = rTrue * A * th * (gi === 6 ? 1.3 : 1);
      reports.push({
        schema: 2, lab: 'buoyancy', id: 'demo' + gi, session: 'DEMO', group: String(gi), students: [names[gi * 2 - 2], names[gi * 2 - 1]], cyl: gi <= 4 ? 'A' : 'B',
        g: 9.8, d: String(d), res: '0.1', liquid,
        prediction: { into: gi === 8 ? 'same' : 'up', depth: ['double', 'double', 'more', 'double', 'less', 'double', 'same', 'double'][gi - 1], dens: gi === 5 ? 'same' : 'bigger',
          why: 'The liquid pushes the cylinder up, so the cylinder pushes the liquid down and the balance should feel it more when more of it is inside.' },
        data, discuss: { linear: pick('linear') },
        answers: { slope: pick('slope'), gslope: pick('gslope'), others: pick('others'), law: good ? 'ρ·g·V' : 'ρ·V', predcheck: pick('predcheck') },
        test: { h: String(th), pred: predR.toFixed(1), locked: gi !== 7, meas: gi === 7 ? '' : (rTrue * A * th + rnd(-0.4, 0.4)).toFixed(1) },
        conclusion: { k: L.fit ? fmt(L.fit.k) : '', dk: L.fit ? fmt(L.fit.sk, 2) : '', g: isFinite(L.gq) ? (gi === 3 ? fmt(L.gq / 1000) : fmt(L.gq)) : '', dg: gi === 5 || !isFinite(L.dgq) ? '' : fmt(L.dgq, 2),
          errors: ['touching', 'depth', 'tilt', 'balance', 'bubbles', 'density'].filter(() => Math.random() < 0.4),
          errtext: gi === 2 ? 'The salt water left drops on the beaker wall and the balance kept changing a little.' : '', text: pick('conclusion'), roles: pick('roles') },
        startedAt: new Date().toISOString(), submittedAt: new Date(Date.now() - (9 - gi) * 60000).toISOString(),
      });
    }
    return reports;
  },
});
</script>
