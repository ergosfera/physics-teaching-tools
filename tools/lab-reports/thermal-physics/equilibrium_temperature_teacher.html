<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Equilibrium Temperature Teacher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="stylesheet" href="../lab-teacher.css">
</head>
<body>
<script src="../lab-teacher.js"></script>
<script>
// Equilibrium Temperature: the parts specific to this lab. Everything else comes from ../lab-teacher.js.
const C_WATER = 4186;   // J/(kg·°C)
const PRED_TEXT = { add: 'About 100 °C (they add up)', half: 'About 50 °C', hot: 'Closer to 80 °C', cold: 'Closer to 20 °C' };
const sub = t => `<tspan baseline-shift="sub" font-size="0.75em">${t}</tspan>`;

// Model equilibrium temperature (°C) from masses (g) and temperatures (°C)
const teqModel = (mh, Th, mc, Tc) => (mh * Th + mc * Tc) / (mh + mc);

// Numbers and derived values of one trial, recomputed from what the students typed
function trialCalc(t, n) {
  const mc = num(t.mc), Tc = num(t.Tc), mh = num(t.mh), Th = num(t.Th), pred = num(t.pred), Teq = num(t.Teq);
  const ok = mc > 0 && mh > 0 && isFinite(Tc) && isFinite(Th) && Th !== Tc;
  const model = ok ? teqModel(mh, Th, mc, Tc) : NaN;
  const Qlost = mh / 1000 * C_WATER * (Th - Teq), Qgained = mc / 1000 * C_WATER * (Teq - Tc);
  return {
    n, mc, Tc, mh, Th, pred, Teq, locked: !!t.locked, model,
    complete: ok && !!t.locked && isFinite(pred) && isFinite(Teq),
    x: mh / (mh + mc), y: (Teq - Tc) / (Th - Tc),
    calcErr: pred - model, diff: Teq - model,
    Qlost, Qgained, missingPct: (Qlost - Qgained) / Qlost * 100,
  };
}

// Temperature difference with sign, one decimal (°C)
const signed = v => {
  if (!isFinite(v)) return '—';
  const r = Math.round(v * 10) / 10;
  return (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r).toFixed(1);
};
const trialTitle = (G, c) => `${label(G)}, trial ${c.n}: ${fmt(c.mh)} g at ${fmt(c.Th)} °C + ${fmt(c.mc)} g at ${fmt(c.Tc)} °C → model ${fmt(c.model)} °C, measured ${fmt(c.Teq)} °C`;
const predSummary = s => s.prediction?.equal || s.prediction?.unequal
  ? `Equal masses: ${PRED_TEXT[s.prediction.equal] || '—'} · 50 g + 150 g: ${PRED_TEXT[s.prediction.unequal] || '—'}.` : '';

// ── Plots ───────────────────────────────────────────────────
// Universal plot: fraction of hot water vs fraction of the way from T_c to T_h; the model is the diagonal
function plotUniversal(svg, groups, W = 720, H = 460) {
  const M = { l: 62, r: 20, t: 18, b: 52 };
  const X = v => M.l + (v + 0.05) / 1.1 * (W - M.l - M.r);
  const Y = v => H - M.b - (v + 0.05) / 1.1 * (H - M.t - M.b);
  let s = '';
  for (let v = 0; v <= 1.0001; v += 0.2) {
    s += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${M.t}" y2="${H - M.b}"/><text x="${X(v)}" y="${H - M.b + 18}" text-anchor="middle">${v.toFixed(1)}</text>`;
    s += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${M.l - 8}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(1)}</text>`;
  }
  s += `<line class="axis" x1="${X(0)}" x2="${X(0)}" y1="${M.t}" y2="${H - M.b}"/><line class="axis" x1="${M.l}" x2="${W - M.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="var(--green)" stroke-width="2.2" stroke-dasharray="7 4"/>`;
  s += `<text x="${X(0.9)}" y="${Y(0.9) - 10}" text-anchor="end" fill="var(--green)">model</text>`;
  s += `<text class="lbl" x="${(M.l + W - M.r) / 2}" y="${H - 10}" text-anchor="middle">Fraction of hot water  m${sub('h')} / (m${sub('h')} + m${sub('c')})</text>`;
  s += `<text class="lbl" transform="translate(16 ${(M.t + H - M.b) / 2}) rotate(-90)" text-anchor="middle">(T${sub('eq')} − T${sub('c')}) / (T${sub('h')} − T${sub('c')})</text>`;
  groups.forEach(G => G.trials.forEach(c => {
    s += `<circle cx="${X(c.x)}" cy="${Y(c.y)}" r="6.5" fill="${G.color}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(trialTitle(G, c))}</title></circle>`;
  }));
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = s;
}

// Measured − model (°C) for every trial, one column per group
function plotDiff(svg, groups) {
  const W = 520, H = 420, M = { l: 56, r: 16, t: 18, b: 50 };
  const gs = groups.filter(G => G.trials.length);
  if (!gs.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">No complete trials yet</text>`; return; }
  const ds = gs.flatMap(G => G.trials.map(c => c.diff));
  const lo = Math.min(-1, ...ds), hi = Math.max(1, ...ds);
  const step = niceStep(hi - lo, 6), y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
  const Y = v => H - M.b - (v - y0) / (y1 - y0) * (H - M.t - M.b);
  const bw = (W - M.l - M.r) / gs.length, X = i => M.l + bw * (i + 0.5);
  let s = '';
  for (let v = y0; v <= y1 + 1e-9; v += step) s += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${M.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  s += `<line x1="${M.l}" x2="${W - M.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--green)" stroke-width="2" stroke-dasharray="7 4"/>`;
  s += `<text class="lbl" transform="translate(16 ${(M.t + H - M.b) / 2}) rotate(-90)" text-anchor="middle">T${sub('eq')} measured − model (°C)</text>`;
  gs.forEach((G, i) => {
    const k = G.trials.length;
    G.trials.forEach((c, j) => {
      const x = X(i) + (j - (k - 1) / 2) * Math.min(14, bw / (k + 1));
      s += `<circle cx="${x}" cy="${Y(c.diff)}" r="6.5" fill="${G.color}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(trialTitle(G, c))} (${c.diff > 0 ? '+' : ''}${fmt(c.diff, 2)} °C)</title></circle>`;
    });
    s += `<text x="${X(i)}" y="${H - M.b + 18}" text-anchor="middle">G${esc(G.s.group || '?')}</text>`;
  });
  svg.innerHTML = s;
}

function classStats() {
  const trials = GROUPS.flatMap(G => G.trials);
  const mean = f => trials.length ? trials.reduce((a, c) => a + f(c), 0) / trials.length : NaN;
  return {
    n: trials.length,
    meanDiff: mean(c => c.diff),
    within2: trials.filter(c => Math.abs(c.diff) <= 2).length,
    calcOk: trials.filter(c => Math.abs(c.calcErr) <= 0.5).length,
    meanMissing: mean(c => c.missingPct),
  };
}
function statTiles(st) {
  return `
    <div class="tile"><div class="k">Measured − model</div><div class="v">${signed(st.meanDiff)} <small>°C</small></div><div class="s">average of all trials; negative = cooler</div></div>
    <div class="tile"><div class="k">Within 2 °C of the model</div><div class="v">${st.within2}<small>/${st.n}</small></div><div class="s">trials</div></div>
    <div class="tile"><div class="k">Energy missing</div><div class="v">${isFinite(st.meanMissing) ? fmt(st.meanMissing, 2) : '—'}<small>%</small></div><div class="s">heat lost by hot − gained by cold</div></div>`;
}

LabTeacher({
  id: 'equilibrium-temperature',
  title: 'Equilibrium Temperature',
  icon: '🌡️',
  studentPage: 'equilibrium_temperature_lab.html',
  tagline: 'Predicting the final temperature with Q = m·c·ΔT',
  titleExtra: () => ` · ${classStats().n} trials`,

  errors: {
    air: 'Heat lost to the air', beaker: 'Heat absorbed by the beaker', thermometer: 'Thermometer not stabilized',
    evaporation: 'Evaporation while heating', stirring: 'Water not fully mixed', delay: 'Hot water cooled before pouring',
  },
  questions: [
    { id: 'prediction', title: 'Prediction: what will the final temperature be?', get: s => s.prediction?.why, chart: 'pred' },
    { id: 'first', title: 'After trial 1: was it higher or lower than predicted? Where could the energy have gone?', get: s => s.discuss?.first },
    { id: 'missing', title: 'Did the cold water gain all the energy the hot water lost? Where did the difference go?', get: s => s.answers?.missing },
    { id: 'c', title: 'Why does c cancel out? When would it matter?', get: s => s.answers?.c },
    { id: 'predcheck', title: 'Was your prediction right?', get: s => s.answers?.predcheck },
    { id: 'errors', title: 'Sources of error', get: s => s.conclusion?.errtext, chart: 'errors' },
    { id: 'conclusion', title: 'Conclusion', get: s => s.conclusion?.text },
    { id: 'roles', title: 'How did the pair share the work?', get: s => s.conclusion?.roles },
  ],
  questionChart(q) {
    const part = (key, title) => {
      const counts = {}; GROUPS.forEach(G => { const c = G.s.prediction?.[key]; if (c) counts[c] = (counts[c] || 0) + 1; });
      return `<div class="muted" style="font-weight:700;margin:4px 0 8px">${title}</div><div class="bars">${Object.keys(PRED_TEXT).map(c => bar(PRED_TEXT[c], counts[c] || 0)).join('')}</div>`;
    };
    return part('equal', '100 g at 80 °C + 100 g at 20 °C') + '<div style="height:14px"></div>' + part('unequal', '50 g at 80 °C + 150 g at 20 °C');
  },
  answerPrefix: (q, s) => q.id === 'prediction' ? predSummary(s) : '',

  analyze(s) {
    const all = (s.trials || []).map((t, i) => trialCalc(t, i + 1));
    const trials = all.filter(c => c.complete);
    const mean = f => trials.length ? trials.reduce((a, c) => a + f(c), 0) / trials.length : NaN;
    return { all, trials, meanDiff: mean(c => c.diff), meanCalc: mean(c => Math.abs(c.calcErr)), meanMissing: mean(c => c.missingPct) };
  },
  checks(G) {
    const out = [], n = G.trials.length;
    if (n < 2) out.push([n === 1 ? 'Only 1 trial' : 'No complete trials', 'red']);
    if (G.all.some(c => isFinite(c.Th) && isFinite(c.Tc) && c.Th <= c.Tc)) out.push(['T_h ≤ T_c', 'red']);
    const outside = G.trials.filter(c => c.Teq < Math.min(c.Tc, c.Th) - 0.05 || c.Teq > Math.max(c.Tc, c.Th) + 0.05).map(c => c.n);
    if (outside.length) out.push(['T_eq outside T_c–T_h (trial ' + outside.join(', ') + ')', 'red']);
    const badCalc = G.trials.filter(c => Math.abs(c.calcErr) > 2).map(c => c.n);
    if (badCalc.length) out.push(['Calculation error? (trial ' + badCalc.join(', ') + ')', '']);
    const above = G.trials.filter(c => c.diff > 1).map(c => c.n);
    if (above.length) out.push(['Warmer than the model (trial ' + above.join(', ') + ')', '']);
    if (n >= 2 && Math.max(...G.trials.map(c => c.x)) - Math.min(...G.trials.map(c => c.x)) < 0.08) out.push(['Same proportion in every trial', '']);
    return out;
  },

  summaryHtml: `
    <div class="two">
      <div class="card">
        <h3>All trials: how far did each mixture get toward the hot temperature?</h3>
        <svg class="plot" id="all-plot" viewBox="0 0 720 460"></svg>
        <div class="legend" id="legend"></div>
        <div class="muted" style="font-size:.78rem;margin-top:6px">Each point is one trial. Across: fraction of hot water, m<sub>h</sub>/(m<sub>h</sub>+m<sub>c</sub>). Up: (T<sub>eq</sub> − T<sub>c</sub>)/(T<sub>h</sub> − T<sub>c</sub>). On the dashed diagonal the model is exact; below it the mixture ended cooler than the model predicts.</div>
      </div>
      <div class="card">
        <h3>Measured − model temperature (°C)</h3>
        <svg class="plot" id="diff-plot" viewBox="0 0 520 420"></svg>
        <div class="muted" style="font-size:.78rem;margin-top:6px">Each dot is one trial. Below zero: the mixture was cooler than the model predicts (energy lost to the surroundings).</div>
      </div>
    </div>`,
  renderSummary(on) {
    const st = classStats();
    document.getElementById('tiles').innerHTML = `
      <div class="tile"><div class="k">Reports</div><div class="v">${GROUPS.length}</div><div class="s">${CFG.session ? 'session ' + esc(CFG.session) : 'all sessions'} · ${st.n} trials</div></div>
      ${statTiles(st)}
      <div class="tile"><div class="k">Predictions calculated right</div><div class="v">${st.calcOk}<small>/${st.n}</small></div><div class="s">within 0.5 °C of the model</div></div>`;
    plotUniversal(document.getElementById('all-plot'), on);
    plotDiff(document.getElementById('diff-plot'), on);
  },

  resultsHead: '<th>Trials</th><th>Prediction vs model (°C)</th><th>Measured − model (°C)</th><th>Energy missing</th>',
  resultsRow: G => `
    <td>${G.trials.length}</td>
    <td>${G.trials.length ? G.trials.map(c => signed(c.calcErr)).join(' · ') : '—'}</td>
    <td>${G.trials.length ? `<b>${G.trials.map(c => signed(c.diff)).join(' · ')}</b>` : '—'}</td>
    <td>${isFinite(G.meanMissing) ? fmt(G.meanMissing, 2) + '%' : '—'}</td>`,

  slides(on) {
    return [
      { html: `<h2>Did the mixtures reach the predicted temperature?</h2>
        <div class="plot-wrap"><svg class="plot" id="show-uni"></svg></div>
        <div class="legend">${on.map(G => `<span class="chip"><i style="background:${G.color}"></i>${esc(label(G))}</span>`).join('')}</div>`,
        draw: () => plotUniversal(document.getElementById('show-uni'), on) },
      { html: `<h2>How far from the model?</h2>
        <div class="tiles">${statTiles(classStats())}</div>
        <div class="plot-wrap"><svg class="plot" id="show-diff"></svg></div>`,
        draw: () => plotDiff(document.getElementById('show-diff'), on) },
    ];
  },

  detail(G) {
    const s = G.s, c = s.conclusion || {};
    return `
      <div class="tiles">
        <div class="tile"><div class="k">Measured − model</div><div class="v">${signed(G.meanDiff)} <small>°C</small></div><div class="s">average of ${G.trials.length} trial${G.trials.length === 1 ? '' : 's'}</div></div>
        <div class="tile"><div class="k">Prediction vs model</div><div class="v">${isFinite(G.meanCalc) ? fmt(G.meanCalc, 2) : '—'} <small>°C</small></div><div class="s">average calculation error</div></div>
        <div class="tile"><div class="k">Energy missing</div><div class="v">${isFinite(G.meanMissing) ? fmt(G.meanMissing, 2) : '—'}<small>%</small></div><div class="s">heat lost by hot − gained by cold</div></div>
        ${sentTile(G)}
      </div>
      ${G.checks.length ? `<div>${flagsHtml(G)}</div>` : ''}
      <div class="card"><h3>Trials</h3>
        <div class="table-wrap"><table class="t"><thead><tr><th>Trial</th><th>Cold: m (g), T (°C)</th><th>Hot: m (g), T (°C)</th><th>Predicted (°C)</th><th>Model (°C)</th><th>Measured (°C)</th><th>Measured − model</th><th>Q lost / gained (J)</th><th>Missing</th></tr></thead><tbody>
        ${G.all.map(t => `<tr><td>${t.n}</td><td>${fmt(t.mc, 4)} g, ${fmt(t.Tc, 3)} °C</td><td>${fmt(t.mh, 4)} g, ${fmt(t.Th, 3)} °C</td>
          <td>${fmt(t.pred, 3)}${t.locked ? '' : ' <span class="flag">not locked</span>'}</td><td>${fmt(t.model, 3)}</td><td>${fmt(t.Teq, 3)}</td>
          <td>${t.complete ? signed(t.diff) + ' °C' : '—'}</td><td>${t.complete ? fmt(t.Qlost) + ' / ' + fmt(t.Qgained) : '—'}</td><td>${t.complete ? fmt(t.missingPct, 2) + '%' : '—'}</td></tr>`).join('')}
        </tbody></table></div>
      </div>
      <div class="card"><h3>Their trials on the class chart</h3><svg class="plot" id="detail-plot"></svg></div>
      <div class="answers">
        ${detailAnswer('Prediction: ' + (predSummary(s) || '—'), s.prediction?.why)}
        ${detailAnswer('After trial 1: higher or lower? Where did the energy go?', s.discuss?.first)}
        ${detailAnswer('Where did the missing energy go?', s.answers?.missing)}
        ${detailAnswer('Why does c cancel out?', s.answers?.c)}
        ${detailAnswer('Was the prediction right?', s.answers?.predcheck)}
        ${detailAnswer(errorsTitle(c), c.errtext)}
        ${detailAnswer('Conclusion', c.text)}
        ${detailAnswer('How they shared the work', c.roles)}
      </div>`;
  },
  drawDetail: G => plotUniversal(document.getElementById('detail-plot'), [G], 640, 400),

  computed: G => ({
    trials: G.trials.map(c => ({
      trial: c.n, model_C: c.model, prediction_minus_model_C: c.calcErr, measured_minus_model_C: c.diff,
      Q_lost_J: c.Qlost, Q_gained_J: c.Qgained, energy_missing_percent: c.missingPct,
    })),
  }),
  // One row per trial, ready for a spreadsheet
  csv: {
    head: ['session', 'group', 'students', 'trial', 'm_cold_g', 'T_cold_C', 'm_hot_g', 'T_hot_C', 'predicted_C', 'model_C', 'measured_C', 'measured_minus_model_C', 'Q_lost_J', 'Q_gained_J', 'energy_missing_pct'],
    rows: G => G.all.map(c => [G.s.session, G.s.group, who(G), c.n, c.mc, c.Tc, c.mh, c.Th, c.pred, c.model, c.Teq,
      c.complete ? c.diff : '', c.complete ? c.Qlost : '', c.complete ? c.Qgained : '', c.complete ? c.missingPct : '']),
  },

  demo() {
    const rnd = (a, b) => a + Math.random() * (b - a);
    const r1 = v => String(Math.round(v * 10) / 10);
    const names = ['Ana Ruiz', 'Juan Pérez', 'Laura Gómez', 'Andrés Díaz', 'Sofía Castro', 'Mateo Rojas', 'Valentina Mora', 'Samuel Ortiz',
      'Isabella Vargas', 'Tomás Herrera', 'Mariana López', 'Nicolás Silva', 'Camila Torres', 'Daniel Ramírez', 'Sara Medina', 'Felipe Ríos'];
    const predEqual = ['half', 'half', 'add', 'half', 'half', 'hot', 'half', 'half'];
    const predUnequal = ['cold', 'cold', 'add', 'half', 'cold', 'hot', 'cold', 'half'];
    const texts = {
      why: ['With equal masses the hot water cools as much as the cold water warms, so it ends halfway. With more cold water the result is closer to the cold temperature.',
        'Because mixing waters averages their temperatures.'],
      first: ['It was 1.8 °C lower than our prediction. Some energy went to the air and to the beaker, which was at room temperature, so the mixture ended cooler.',
        'Lower, maybe the thermometer was not good.'],
      missing: ['No. In trial 1 the hot water lost about 600 J more than the cold water gained. That energy heated the beaker and the air around it while we poured and stirred.',
        'The cold water gained less because heat escaped to the air.'],
      c: ['Both liquids are water, so c is the same on both sides of the equation and it cancels. If we mixed water with oil we would need both specific heats because they are different.',
        'Because it is the same number on both sides.'],
      predcheck: ['Yes, with equal masses we measured 47.5 °C, close to halfway. With more cold water the result was closer to the cold temperature, as we predicted.',
        'Not completely, the temperature does not just average, it depends on the masses.'],
      conclusion: ['The model Q = mcΔT predicts the equilibrium temperature well: our measurements were between 1 and 2.5 °C below the predictions in every trial. The difference always goes in the same direction because the mixture loses energy to the beaker and the air, which the model ignores. The calculation itself worked.',
        'The model works more or less. The temperatures were a bit lower than predicted.'],
      roles: ['Ana weighed the water and used the microwave, Juan read the thermometer, and we did the calculations together.', 'We did everything together.'],
    };
    const reports = [];
    for (let gi = 1; gi <= 8; gi++) {
      const good = ![3, 6].includes(gi), nTrials = gi === 7 ? 1 : gi % 3 === 0 ? 3 : 2;
      const props = gi === 5 ? [[100, 100], [105, 100], [100, 95]] : [[100, 100], [60, 150], [150, 60]];
      const trials = [];
      for (let t = 0; t < nTrials; t++) {
        const [mh, mc] = props[t].map(m => Math.round(m + rnd(-4, 4)));
        const Tc = rnd(19, 22), Th = rnd(55, 72), model = teqModel(mh, Th, mc, Tc);
        const loss = rnd(0.8, 2.6) * (good ? 1 : 1.6);
        const calc = gi === 3 && t === 1 ? (Th + Tc) / 2 : model + rnd(-0.2, 0.2);
        trials.push({ mc: String(mc), Tc: r1(Tc), mh: String(mh), Th: r1(Th), pred: r1(calc), locked: true,
          Teq: r1(gi === 8 && t === 1 ? model + 1.6 : model - loss) });
      }
      const pick = k => good ? texts[k][0] : texts[k][1];
      reports.push({
        schema: 1, lab: 'equilibrium-temperature', id: 'demo' + gi, session: 'DEMO', group: String(gi), students: [names[gi * 2 - 2], names[gi * 2 - 1]],
        prediction: { equal: predEqual[gi - 1], unequal: predUnequal[gi - 1], why: pick('why') }, practice: '60',
        trials, discuss: { first: pick('first') },
        answers: { missing: pick('missing'), c: pick('c'), predcheck: pick('predcheck') },
        conclusion: { errors: ['air', 'beaker', 'thermometer', 'delay'].filter(() => Math.random() < 0.55),
          errtext: gi === 2 ? 'The microwave queue was long, so our hot water waited a minute before we poured it.' : '', text: pick('conclusion'), roles: pick('roles') },
        startedAt: new Date().toISOString(), submittedAt: new Date(Date.now() - (9 - gi) * 60000).toISOString(),
      });
    }
    return reports;
  },
});
</script>
</body>
</html>
