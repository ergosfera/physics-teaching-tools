<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linear Regression Visualizer</title>

<style>
  :root{
    --desktop:#008080;
    --face:#C0C0C0;
    --hi:#FFFFFF;
    --light:#DFDFDF;
    --shadow:#808080;
    --dark:#000000;
    --title:#000080;
    --title-off:#808080;
    --sel:#000080;
    --field:#FFFFFF;
    --ui:Tahoma,"MS Sans Serif",Verdana,Geneva,sans-serif;
    --fixed:"Lucida Console","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--desktop);
    font-family:var(--ui);
    font-size:14px;
    color:#000;
    -webkit-font-smoothing:none;
    padding:4px 4px calc(48px + env(safe-area-inset-bottom));
    overscroll-behavior-y:contain;
    overflow:hidden;
  }

  /* ---- Win95 bevels ---- */
  .raised{
    background:var(--face);
    box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--hi),
               inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--light);
  }
  .sunken{
    background:var(--face);
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }
  .field-sunken{
    background:var(--field);
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }

  /* ---- window ---- */
  .window{
    display:flex;flex-direction:column;
    height:calc(100vh - 8px - 48px - env(safe-area-inset-bottom));
    padding:3px;
  }
  .titlebar{
    background:var(--title);color:#fff;
    display:flex;align-items:center;gap:5px;
    padding:2px 2px 2px 3px;margin-bottom:2px;
    flex-shrink:0;
  }
  .titlebar .t{
    font-weight:700;font-size:15px;flex:1;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .titlebar svg{display:block;flex:none}
  .tbtn{
    width:24px;height:22px;padding:0;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--ui);font-size:13px;font-weight:700;line-height:1;
    background:var(--face);border:0;color:#000;cursor:pointer;
    box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--hi),
               inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--light);
  }
  .tbtn:active{box-shadow:inset 1px 1px 0 var(--dark), inset 2px 2px 0 var(--shadow);padding:1px 0 0 1px}

  /* ---- main layout ---- */
  .main{display:flex;flex:1;overflow:hidden}

  /* ---- left panel ---- */
  .left-panel{
    width:260px;min-width:220px;
    background:var(--face);
    border-right:2px solid var(--shadow);
    display:flex;flex-direction:column;
    overflow-y:auto;
    padding:6px;
    gap:8px;
  }

  .section-label{
    font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.6px;
    color:#000;margin-bottom:3px;
  }
  .section-hint{
    font-size:11px;font-weight:400;
    text-transform:none;letter-spacing:0;
    color:var(--shadow);
  }

  /* ---- buttons ---- */
  button.b95{
    font-family:var(--ui);font-size:14px;color:#000;background:var(--face);
    border:0;padding:5px 10px;min-height:26px;cursor:pointer;
    box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--hi),
               inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--light);
  }
  button.b95:active,button.b95.pressed{
    box-shadow:inset 1px 1px 0 var(--shadow), inset 2px 2px 0 var(--dark);
    padding:6px 9px 4px 11px;
  }
  button.b95:focus-visible{outline:1px dotted #000;outline-offset:-4px}
  button.b95:disabled{color:var(--shadow);text-shadow:1px 1px 0 var(--hi);cursor:default}
  button.b95.primary{font-weight:700;outline:1px solid #000;outline-offset:-4px}

  /* ---- data table ---- */
  #data-table{width:100%;border-collapse:collapse;font-size:13px}

  #data-table thead th{
    background:var(--face);color:#000;
    padding:4px 4px;text-align:center;font-weight:700;
    box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--hi),
               inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--light);
  }
  #data-table thead th[contenteditable="true"]{cursor:text;outline:none}
  #data-table thead th[contenteditable="true"]:focus{background:var(--sel);color:#fff}
  #data-table thead th.del-th{width:22px;padding:0}

  #data-table tbody tr:nth-child(even){background:#d8d8d8}
  #data-table tbody td{padding:1px 2px;border-bottom:1px solid var(--shadow)}
  #data-table tbody td:first-child{border-right:1px solid var(--shadow)}

  .del-cell{width:22px;text-align:center;border-left:1px solid var(--shadow)}

  #data-table tbody td input{
    width:100%;border:0;padding:3px 4px;
    font-size:13px;text-align:right;
    background:var(--field);color:#000;
    font-family:var(--fixed);
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow);
  }
  #data-table tbody td input:focus{
    outline:none;background:#fff;
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--dark);
  }

  .del-btn{
    background:none;border:none;color:var(--shadow);
    font-size:12px;cursor:pointer;padding:1px 4px;line-height:1;
  }
  .del-btn:hover{color:#800000}

  /* ---- table actions ---- */
  .table-actions{display:flex;gap:3px;margin-top:4px}

  /* ---- units ---- */
  .units-grid{display:flex;flex-direction:column;gap:4px}
  .units-row{display:flex;align-items:center;gap:5px;font-size:13px}
  .units-row label{
    font-weight:700;color:#000;min-width:24px;
    font-family:var(--fixed);font-size:13px;
  }
  .unit-input{
    flex:1;border:0;padding:3px 5px;
    font-size:13px;color:#000;background:var(--field);
    font-family:var(--ui);min-width:0;
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }
  .unit-input:focus{outline:none}

  /* ---- toggle / checkbox ---- */
  .toggle-box{
    display:flex;align-items:center;gap:6px;
    padding:5px 6px;
    background:var(--face);
    font-size:13px;cursor:pointer;user-select:none;
  }
  .toggle-box input[type="checkbox"]{
    width:13px;height:13px;cursor:pointer;
    accent-color:var(--title);flex-shrink:0;
  }

  .reset-view{
    font-size:12px;color:var(--shadow);cursor:pointer;
    text-align:right;margin-top:2px;
    text-decoration:underline;
  }
  .reset-view:hover{color:#000}

  /* ---- coefficients / residuals ---- */
  .coeff-box{
    background:var(--field);
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }
  .coeff-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:4px 8px;font-size:13px;
  }
  .coeff-row:not(:last-child){border-bottom:1px solid var(--light)}
  .coeff-name{font-weight:700;color:#000}
  .coeff-desc{font-size:11px;color:var(--shadow);margin-left:2px}
  .coeff-val{font-family:var(--fixed);font-weight:700;color:#800000;font-size:13px}
  .coeff-val.pos{color:#006400}
  .coeff-val.neg{color:#804000}

  /* ---- action buttons row ---- */
  .btn-row{display:flex;gap:4px}
  .btn-row button{flex:1}

  /* ---- right panel (plot) ---- */
  .right-panel{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:6px;overflow:hidden;
    background:var(--face);
  }

  .plot-well{
    padding:4px;
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
    background:var(--field);
    display:flex;align-items:center;justify-content:center;
  }

  #plot{display:block;max-width:100%;max-height:100%;background:#fff}

  /* ---- status bar ---- */
  .status{display:flex;gap:3px;margin-top:auto;padding-top:4px;flex-shrink:0}
  .status div{
    font-size:12px;padding:3px 6px;font-family:var(--fixed);
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow);
  }
  .status .s1{flex:1}

  /* ---- taskbar ---- */
  .taskbar{
    position:fixed;left:0;right:0;bottom:0;height:40px;
    background:var(--face);display:flex;align-items:center;gap:4px;
    padding:4px 4px calc(4px + env(safe-area-inset-bottom));
    box-shadow:inset 0 1px 0 var(--hi), inset 0 2px 0 var(--light);
  }
  .taskbtn{
    display:flex;align-items:center;gap:6px;font-weight:700;padding:4px 10px;min-height:30px;
  }
  .tray{
    margin-left:auto;font-family:var(--fixed);font-size:13px;padding:5px 10px;
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }

  /* scrollbar */
  .left-panel::-webkit-scrollbar{width:16px}
  .left-panel::-webkit-scrollbar-track{
    background-color:var(--hi);
    background-image:linear-gradient(45deg,var(--face) 25%,transparent 25%,transparent 75%,var(--face) 75%),
                     linear-gradient(45deg,var(--face) 25%,transparent 25%,transparent 75%,var(--face) 75%);
    background-size:2px 2px;background-position:0 0,1px 1px;
  }
  .left-panel::-webkit-scrollbar-thumb{
    background:var(--face);
    box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--hi),
               inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--light);
  }

  /* CSV file input hidden */
  #csv-file{display:none}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!-- ═══════════════ WINDOW ═══════════════ -->
<div class="window raised" id="win">
  <div class="titlebar">
    <svg width="17" height="17" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="2" y="2" width="12" height="12" fill="#C0C0C0"/>
      <rect x="3" y="3" width="10" height="10" fill="#000080"/>
      <rect x="5" y="5" width="6" height="1" fill="#FFFF00"/>
      <rect x="5" y="7" width="4" height="1" fill="#FF0000"/>
      <rect x="5" y="9" width="5" height="1" fill="#FFFF00"/>
    </svg>
    <span class="t">Linear Regression Visualizer</span>
    <button class="tbtn" title="Minimize" aria-label="Minimize">_</button>
    <button class="tbtn" title="Maximize" aria-label="Maximize">□</button>
    <button class="tbtn" title="Close" aria-label="Close">✕</button>
  </div>

  <div class="main">

    <!-- ── Left Panel ── -->
    <div class="left-panel">

      <!-- Data -->
      <div>
        <div class="section-label">Data <span class="section-hint">— click headers to rename</span></div>
        <table id="data-table">
          <thead>
            <tr>
              <th contenteditable="true" spellcheck="false" title="Click to rename">X</th>
              <th contenteditable="true" spellcheck="false" title="Click to rename">Y</th>
              <th class="del-th"></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="table-actions">
          <button class="b95" id="add-row-btn" style="flex:1">+ Add row</button>
          <button class="b95" id="csv-btn">CSV</button>
        </div>
        <input type="file" id="csv-file" accept=".csv,.tsv,.txt">
      </div>

      <!-- Units -->
      <div>
        <div class="section-label">Units <span class="section-hint">— axis labels</span></div>
        <div class="units-grid">
          <div class="units-row">
            <label id="lbl-unit-x">X</label>
            <input class="unit-input" id="unit-x" type="text" placeholder="e.g. cm" spellcheck="false">
          </div>
          <div class="units-row">
            <label id="lbl-unit-y">Y</label>
            <input class="unit-input" id="unit-y" type="text" placeholder="e.g. kg" spellcheck="false">
          </div>
        </div>
      </div>

      <!-- Options -->
      <div>
        <div class="section-label">Options</div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <label class="toggle-box" id="origin-box">
            <input type="checkbox" id="through-origin">
            <span>Line through origin (0, 0)</span>
          </label>
          <label class="toggle-box" id="pan-box">
            <input type="checkbox" id="pan-mode-chk">
            <span>Pan mode [P]</span>
          </label>
          <div class="reset-view" id="reset-view">Reset view</div>
        </div>
      </div>

      <!-- Coefficients -->
      <div>
        <div class="section-label">Coefficients</div>
        <div class="coeff-box">
          <div class="coeff-row">
            <span><span class="coeff-name">a</span><span class="coeff-desc"> slope</span></span>
            <span class="coeff-val" id="coeff-a">—</span>
          </div>
          <div class="coeff-row">
            <span><span class="coeff-name">b</span><span class="coeff-desc"> intercept</span></span>
            <span class="coeff-val" id="coeff-b">—</span>
          </div>
          <div class="coeff-row">
            <span><span class="coeff-name">r</span><span class="coeff-desc"> correlation</span></span>
            <span class="coeff-val" id="coeff-r">—</span>
          </div>
          <div class="coeff-row">
            <span><span class="coeff-name">r²</span><span class="coeff-desc"> determination</span></span>
            <span class="coeff-val" id="coeff-r2">—</span>
          </div>
        </div>
      </div>

      <!-- Residuals -->
      <div>
        <div class="section-label">Residuals</div>
        <div class="coeff-box">
          <div class="coeff-row">
            <span><span class="coeff-name" style="color:#006400">Σ</span><span class="coeff-desc"> above BFL</span></span>
            <span class="coeff-val pos" id="resid-pos">—</span>
          </div>
          <div class="coeff-row">
            <span><span class="coeff-name" style="color:#804000">Σ</span><span class="coeff-desc"> below BFL</span></span>
            <span class="coeff-val neg" id="resid-neg">—</span>
          </div>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="btn-row">
        <button class="b95 primary" id="adjust-btn">Adjust!</button>
        <button class="b95" id="clear-btn">Clear</button>
        <button class="b95" id="export-btn" title="Export chart as PNG">PNG</button>
      </div>

      <!-- Status -->
      <div class="status">
        <div class="s1" id="statusText">Ready</div>
        <div id="statusCount">0 pts</div>
      </div>
    </div>

    <!-- ── Right Panel ── -->
    <div class="right-panel">
      <div class="plot-well">
        <canvas id="plot"></canvas>
      </div>
    </div>

  </div>
</div>

<!-- ═══════════════ TASKBAR ═══════════════ -->
<div class="taskbar">
  <button class="b95 taskbtn" id="taskBtn">
    <svg width="17" height="17" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="2" y="2" width="12" height="12" fill="#000080"/>
      <rect x="5" y="5" width="6" height="1" fill="#FFFF00"/>
      <rect x="5" y="7" width="4" height="1" fill="#FF0000"/>
      <rect x="5" y="9" width="5" height="1" fill="#FFFF00"/>
    </svg>
    Linear Regression
  </button>
  <span class="tray" id="tray">—</span>
</div>

<script>
"use strict";

/* ── Tray clock ── */
function updateTray(){
  const d = new Date();
  document.getElementById('tray').textContent =
    d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
updateTray(); setInterval(updateTray, 30000);

/* ── Status helpers ── */
function updateStatus(){
  const n = validPts().length;
  document.getElementById('statusCount').textContent = n + ' pt' + (n!==1?'s':'');
  if(regression.a !== null){
    const xN = getVarName('x'), yN = getVarName('y');
    document.getElementById('statusText').textContent =
      yN + ' = ' + parseFloat(regression.a.toPrecision(4)) + '·' + xN +
      (regression.b >= 0 ? ' + ' : ' − ') + parseFloat(Math.abs(regression.b).toPrecision(4));
  } else {
    document.getElementById('statusText').textContent = 'Ready';
  }
}

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
const NUM_INIT = 8;
const POINT_R  = 7;
const MARGIN   = { top: 36, right: 36, bottom: 58, left: 62 };

let data          = [];
let regression    = { a: null, b: null, r: null };
let throughOrigin = false;
let panMode       = false;
let panOffsetX    = 0;
let panOffsetY    = 0;
let dragState     = null;
let panDrag       = null;
let scale         = null;
let hoverPos      = null;
let hoverRAF      = null;

const canvas = document.getElementById('plot');
const ctx    = canvas.getContext('2d');

// ─────────────────────────────────────────────
//  Variable name / unit helpers
// ─────────────────────────────────────────────
function getVarName(col) {
  const sel = col === 'x' ? '#data-table thead th:first-child'
                          : '#data-table thead th:nth-child(2)';
  return document.querySelector(sel)?.textContent.trim() || (col === 'x' ? 'X' : 'Y');
}

function getUnit(col) {
  return document.getElementById(col === 'x' ? 'unit-x' : 'unit-y')?.value.trim() || '';
}

function getAxisLabel(col) {
  const unit = getUnit(col);
  return unit ? `${getVarName(col)} (${unit})` : getVarName(col);
}

function syncUnitLabels() {
  document.getElementById('lbl-unit-x').textContent = getVarName('x');
  document.getElementById('lbl-unit-y').textContent = getVarName('y');
}

// ─────────────────────────────────────────────
//  Table
// ─────────────────────────────────────────────
function renderTable() {
  const tbody = document.querySelector('#data-table tbody');
  tbody.innerHTML = '';

  data.forEach((d, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td><input type="number" step="any" inputmode="decimal"
                  data-row="${i}" data-col="x" placeholder="—"
                  value="${d.x !== null ? fmtNum(d.x) : ''}"></td>
       <td><input type="number" step="any" inputmode="decimal"
                  data-row="${i}" data-col="y" placeholder="—"
                  value="${d.y !== null ? fmtNum(d.y) : ''}"></td>
       <td class="del-cell">
         <button class="del-btn" data-row="${i}" title="Remove row">×</button>
       </td>`;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => {
      const val = parseFloat(inp.value);
      data[+inp.dataset.row][inp.dataset.col] = isNaN(val) ? null : val;
      draw();
    });
    inp.addEventListener('keydown', e => handleTableKey(e, inp));
  });

  tbody.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      data.splice(+btn.dataset.row, 1);
      renderTable();
      draw();
    });
  });
}

function handleTableKey(e, inp) {
  const row = +inp.dataset.row;
  const col =  inp.dataset.col;

  switch (e.key) {
    case 'Enter':
      e.preventDefault();
      if (row + 1 >= data.length) { data.push({ x: null, y: null }); renderTable(); }
      focusCell(row + 1, col);
      break;
    case 'ArrowDown':
      e.preventDefault();
      if (row + 1 < data.length) focusCell(row + 1, col);
      break;
    case 'ArrowUp':
      e.preventDefault();
      if (row > 0) focusCell(row - 1, col);
      break;
    case 'ArrowRight':
      if (col === 'x' && cursorAtEnd(inp))   { e.preventDefault(); focusCell(row, 'y'); }
      break;
    case 'ArrowLeft':
      if (col === 'y' && cursorAtStart(inp)) { e.preventDefault(); focusCell(row, 'x'); }
      break;
  }
}

function cursorAtEnd(inp)   { try { return inp.selectionStart === inp.value.length; } catch (_) { return true; } }
function cursorAtStart(inp) { try { return inp.selectionStart === 0;                } catch (_) { return true; } }

function focusCell(row, col) {
  document.querySelectorAll('#data-table tbody tr')[row]
    ?.querySelector(`input[data-col="${col}"]`)?.focus();
}

function writeRow(i) {
  const trs = document.querySelectorAll('#data-table tbody tr');
  if (!trs[i]) return;
  const xi = trs[i].querySelector('input[data-col="x"]');
  const yi = trs[i].querySelector('input[data-col="y"]');
  if (xi) xi.value = data[i].x !== null ? fmtNum(data[i].x) : '';
  if (yi) yi.value = data[i].y !== null ? fmtNum(data[i].y) : '';
}

function fmtNum(v) { return String(parseFloat(v.toPrecision(5))); }

// ─────────────────────────────────────────────
//  CSV import
// ─────────────────────────────────────────────
function detectDelimiter(line) {
  if (line.includes('\t')) return '\t';
  if ((line.match(/;/g) || []).length >= (line.match(/,/g) || []).length) return ';';
  return ',';
}

function parseCSVCell(s) {
  return s.trim().replace(/^["']|["']$/g, '');
}

function importCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length === 0) return;

  const delim   = detectDelimiter(lines[0]);
  const first   = lines[0].split(delim).map(parseCSVCell);
  const isHeader = first.length >= 2 &&
                   (isNaN(parseFloat(first[0])) || isNaN(parseFloat(first[1])));

  if (isHeader && first.length >= 2) {
    const xTh = document.querySelector('#data-table thead th:first-child');
    const yTh = document.querySelector('#data-table thead th:nth-child(2)');
    if (first[0]) xTh.textContent = first[0];
    if (first[1]) yTh.textContent = first[1];
    syncUnitLabels();
  }

  const startIdx = isHeader ? 1 : 0;
  const newData  = [];

  for (let i = startIdx; i < lines.length; i++) {
    const cells = lines[i].split(delim).map(parseCSVCell);
    if (cells.length < 2) continue;
    const x = parseFloat(cells[0]);
    const y = parseFloat(cells[1]);
    if (!isNaN(x) && !isNaN(y)) newData.push({ x, y });
  }

  if (newData.length > 0) {
    data = newData;
    panOffsetX = 0; panOffsetY = 0;
    renderTable();
    draw();
  }
}

// ─────────────────────────────────────────────
//  Regression
// ─────────────────────────────────────────────
function validPts() { return data.filter(d => d.x !== null && d.y !== null); }

function computeRegression() {
  const pts = validPts();
  if (pts.length < 2) { regression = { a: null, b: null, r: null }; return; }

  const n    = pts.length;
  const sumX  = pts.reduce((s, p) => s + p.x, 0);
  const sumY  = pts.reduce((s, p) => s + p.y, 0);
  const sumXY = pts.reduce((s, p) => s + p.x * p.y, 0);
  const sumX2 = pts.reduce((s, p) => s + p.x * p.x, 0);

  let a, b;
  if (throughOrigin) {
    if (Math.abs(sumX2) < 1e-14) { regression = { a: null, b: null, r: null }; return; }
    a = sumXY / sumX2; b = 0;
  } else {
    const D = n * sumX2 - sumX * sumX;
    if (Math.abs(D) < 1e-14) { regression = { a: null, b: null, r: null }; return; }
    a = (n * sumXY - sumX * sumY) / D;
    b = (sumY - a * sumX) / n;
  }

  const mx = sumX / n, my = sumY / n;
  const num = pts.reduce((s, p) => s + (p.x - mx) * (p.y - my), 0);
  const dx2 = pts.reduce((s, p) => s + (p.x - mx) ** 2, 0);
  const dy2 = pts.reduce((s, p) => s + (p.y - my) ** 2, 0);
  const den = Math.sqrt(dx2 * dy2);

  regression = { a, b, r: den < 1e-14 ? 0 : num / den };
}

function showCoeffs() {
  const fmt5 = v => v !== null ? v.toFixed(5) : '—';
  document.getElementById('coeff-a').textContent  = fmt5(regression.a);
  document.getElementById('coeff-b').textContent  = fmt5(regression.b);
  document.getElementById('coeff-r').textContent  = fmt5(regression.r);
  document.getElementById('coeff-r2').textContent =
    regression.r !== null ? (regression.r ** 2).toFixed(5) : '—';

  if (regression.a !== null) {
    let pos = 0, neg = 0;
    validPts().forEach(d => {
      const res = d.y - (regression.a * d.x + regression.b);
      if (res > 0) pos += res; else neg += res;
    });
    document.getElementById('resid-pos').textContent = '+' + pos.toFixed(5);
    document.getElementById('resid-neg').textContent = neg.toFixed(5);
  } else {
    document.getElementById('resid-pos').textContent = '—';
    document.getElementById('resid-neg').textContent = '—';
  }

  updateStatus();
}

// ─────────────────────────────────────────────
//  Canvas sizing
// ─────────────────────────────────────────────
function resizeCanvas() {
  const panel = document.querySelector('.right-panel');
  const size  = Math.min(panel.clientWidth - 20, panel.clientHeight - 20);
  canvas.width  = size;
  canvas.height = size;
}

// ─────────────────────────────────────────────
//  Scale
// ─────────────────────────────────────────────
function buildScale() {
  const pts = validPts();
  let xMin, xMax, yMin, yMax;

  if (pts.length === 0) {
    xMin = -10; xMax = 10; yMin = -10; yMax = 10;
  } else {
    xMin = Math.min(...pts.map(p => p.x));
    xMax = Math.max(...pts.map(p => p.x));
    yMin = Math.min(...pts.map(p => p.y));
    yMax = Math.max(...pts.map(p => p.y));

    if (throughOrigin) {
      xMin = Math.min(xMin, 0); xMax = Math.max(xMax, 0);
      yMin = Math.min(yMin, 0); yMax = Math.max(yMax, 0);
    }

    if (regression.a !== null) {
      const yL = regression.a * xMin + regression.b;
      const yR = regression.a * xMax + regression.b;
      yMin = Math.min(yMin, yL, yR);
      yMax = Math.max(yMax, yL, yR);
    }

    const xPad = (xMax - xMin || 1) * 0.22;
    const yPad = (yMax - yMin || 1) * 0.22;
    xMin -= xPad; xMax += xPad;
    yMin -= yPad; yMax += yPad;
  }

  xMin += panOffsetX; xMax += panOffsetX;
  yMin += panOffsetY; yMax += panOffsetY;

  const W = canvas.width  - MARGIN.left - MARGIN.right;
  const H = canvas.height - MARGIN.top  - MARGIN.bottom;

  return {
    xMin, xMax, yMin, yMax, W, H,
    cx:  x  => MARGIN.left + (x  - xMin) / (xMax - xMin) * W,
    cy:  y  => MARGIN.top  + H - (y  - yMin) / (yMax - yMin) * H,
    dx: cx  => xMin + (cx - MARGIN.left) / W * (xMax - xMin),
    dy: cy  => yMin + (MARGIN.top + H - cy) / H * (yMax - yMin),
  };
}

// ─────────────────────────────────────────────
//  Draw helpers
// ─────────────────────────────────────────────
function niceStep(range, n) {
  const rough = range / n;
  const pow   = Math.pow(10, Math.floor(Math.log10(rough)));
  return [1, 2, 2.5, 5, 10].find(f => f * pow >= rough - 1e-9) * pow;
}

function trimNum(v) {
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || (a < 0.01 && a > 0)) return v.toExponential(1);
  return parseFloat(v.toPrecision(4)).toString();
}

function drawGrid(s) {
  ctx.save();

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#fdfdfd';
  ctx.fillRect(MARGIN.left, MARGIN.top, s.W, s.H);

  const xStep = niceStep(s.xMax - s.xMin, 7);
  const yStep = niceStep(s.yMax - s.yMin, 7);

  ctx.font = '11px Tahoma, "MS Sans Serif", Verdana, sans-serif';
  ctx.strokeStyle = '#e2e6ea'; ctx.lineWidth = 1;

  ctx.textAlign = 'center'; ctx.fillStyle = '#999';
  for (let x = Math.ceil(s.xMin / xStep) * xStep; x <= s.xMax + 1e-9; x += xStep) {
    const cx = s.cx(x);
    ctx.beginPath(); ctx.moveTo(cx, MARGIN.top); ctx.lineTo(cx, MARGIN.top + s.H); ctx.stroke();
    ctx.fillText(trimNum(x), cx, MARGIN.top + s.H + 16);
  }

  ctx.textAlign = 'right';
  for (let y = Math.ceil(s.yMin / yStep) * yStep; y <= s.yMax + 1e-9; y += yStep) {
    const cy = s.cy(y);
    ctx.beginPath(); ctx.moveTo(MARGIN.left, cy); ctx.lineTo(MARGIN.left + s.W, cy); ctx.stroke();
    ctx.fillText(trimNum(y), MARGIN.left - 6, cy + 4);
  }

  ctx.strokeStyle = '#aab'; ctx.lineWidth = 1.5;
  if (s.xMin <= 0 && 0 <= s.xMax) {
    const cx = s.cx(0);
    ctx.beginPath(); ctx.moveTo(cx, MARGIN.top); ctx.lineTo(cx, MARGIN.top + s.H); ctx.stroke();
  }
  if (s.yMin <= 0 && 0 <= s.yMax) {
    const cy = s.cy(0);
    ctx.beginPath(); ctx.moveTo(MARGIN.left, cy); ctx.lineTo(MARGIN.left + s.W, cy); ctx.stroke();
  }

  ctx.strokeStyle = '#808080'; ctx.lineWidth = 1;
  ctx.strokeRect(MARGIN.left, MARGIN.top, s.W, s.H);
  ctx.restore();
}

function drawResiduals(s) {
  if (regression.a === null) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(MARGIN.left, MARGIN.top, s.W, s.H); ctx.clip();
  ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);

  data.forEach(d => {
    if (d.x === null || d.y === null) return;
    const yHat = regression.a * d.x + regression.b;
    const res  = d.y - yHat;
    if (Math.abs(res) < 1e-10) return;
    ctx.strokeStyle = res > 0 ? 'rgba(0,100,0,0.8)' : 'rgba(128,64,0,0.8)';
    ctx.beginPath();
    ctx.moveTo(s.cx(d.x), s.cy(d.y));
    ctx.lineTo(s.cx(d.x), s.cy(yHat));
    ctx.stroke();
  });
  ctx.restore();
}

function drawBFL(s) {
  if (regression.a === null) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(MARGIN.left, MARGIN.top, s.W, s.H); ctx.clip();
  ctx.strokeStyle = '#800000'; ctx.lineWidth = 2.5; ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(s.cx(s.xMin), s.cy(regression.a * s.xMin + regression.b));
  ctx.lineTo(s.cx(s.xMax), s.cy(regression.a * s.xMax + regression.b));
  ctx.stroke();
  ctx.restore();
}

function drawEquation(s) {
  if (regression.a === null) return;
  const fmtC  = v => String(parseFloat(v.toPrecision(4)));
  const xName = getVarName('x'), yName = getVarName('y');
  const a = regression.a, b = regression.b;

  let eq;
  if (throughOrigin || Math.abs(b) < 1e-10) {
    eq = `${yName} = ${fmtC(a)}·${xName}`;
  } else {
    const sign = b >= 0 ? '+' : '−';
    eq = `${yName} = ${fmtC(a)}·${xName} ${sign} ${fmtC(Math.abs(b))}`;
  }

  ctx.save();
  ctx.font = 'bold 12px Tahoma, "MS Sans Serif", Verdana, sans-serif';
  const tw = ctx.measureText(eq).width;
  const px = MARGIN.left + s.W - 10, py = MARGIN.top + 24, pad = 7;

  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath(); ctx.roundRect(px - tw - pad * 2, py - 15, tw + pad * 2 + 2, 22, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(128,0,0,0.35)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#800000'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(eq, px, py);
  ctx.restore();
}

function drawPoints(s) {
  data.forEach((d, i) => {
    if (d.x === null || d.y === null) return;
    const cx = s.cx(d.x), cy = s.cy(d.y);
    const dragging = dragState?.index === i;

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, POINT_R, 0, Math.PI * 2);
    ctx.fillStyle = dragging ? '#804000' : '#000080';
    ctx.fill();
    ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    ctx.font = 'bold 8px Tahoma, "MS Sans Serif", Verdana, sans-serif';
    ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(i + 1, cx, cy);
  });
}

function drawAxisLabels() {
  const cx = MARGIN.left + scale.W / 2;
  const cy = MARGIN.top  + scale.H / 2;

  ctx.font = 'bold 13px Tahoma, "MS Sans Serif", Verdana, sans-serif';
  ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(getAxisLabel('x'), cx, canvas.height - 10);

  ctx.save();
  ctx.translate(15, cy); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle';
  ctx.fillText(getAxisLabel('y'), 0, 0);
  ctx.restore();
}

function drawCrosshair(s) {
  if (!hoverPos || panMode || regression.a === null || dragState || panDrag) return;
  if (hoverPos.x < MARGIN.left || hoverPos.x > MARGIN.left + s.W) return;
  if (hoverPos.y < MARGIN.top  || hoverPos.y > MARGIN.top  + s.H) return;

  const x     = s.dx(hoverPos.x);
  const yHat  = regression.a * x + regression.b;
  const cyBFL = s.cy(yHat);

  ctx.save();
  ctx.beginPath(); ctx.rect(MARGIN.left, MARGIN.top, s.W, s.H); ctx.clip();

  ctx.strokeStyle = 'rgba(80,80,80,0.3)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(hoverPos.x, MARGIN.top); ctx.lineTo(hoverPos.x, MARGIN.top + s.H); ctx.stroke();

  if (cyBFL >= MARGIN.top && cyBFL <= MARGIN.top + s.H) {
    ctx.beginPath(); ctx.moveTo(MARGIN.left, cyBFL); ctx.lineTo(MARGIN.left + s.W, cyBFL); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(hoverPos.x, cyBFL, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = '#800000'; ctx.fill();
    ctx.strokeStyle = 'white'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  ctx.restore();

  const line1 = `${getVarName('x')}: ${trimNum(x)}`;
  const line2 = `${getVarName('y')}: ${trimNum(yHat)}`;
  ctx.save();
  ctx.font = '11px Tahoma, "MS Sans Serif", Verdana, sans-serif';
  const tw = Math.max(ctx.measureText(line1).width, ctx.measureText(line2).width);
  const pad = 6, bW = tw + pad * 2, bH = 34;

  let tx = hoverPos.x + 10;
  let ty = (cyBFL >= MARGIN.top && cyBFL <= MARGIN.top + s.H)
         ? cyBFL - bH - 6 : hoverPos.y - bH - 6;
  if (tx + bW > MARGIN.left + s.W) tx = hoverPos.x - bW - 10;
  if (ty < MARGIN.top) ty += bH + 14;

  ctx.fillStyle = 'rgba(0,0,128,0.88)';
  ctx.beginPath(); ctx.roundRect(tx, ty, bW, bH, 3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(line1, tx + pad, ty + 5);
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText(line2, tx + pad, ty + 18);
  ctx.restore();
}

// ─────────────────────────────────────────────
//  Main draw
// ─────────────────────────────────────────────
function draw() {
  if (!canvas.width || !canvas.height) return;
  computeRegression();
  showCoeffs();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  scale = buildScale();
  drawGrid(scale);
  drawResiduals(scale);
  drawBFL(scale);
  drawEquation(scale);
  drawPoints(scale);
  drawAxisLabels();
  drawCrosshair(scale);
}

// ─────────────────────────────────────────────
//  Interaction helpers
// ─────────────────────────────────────────────
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - rect.left) * sx, y: (src.clientY - rect.top) * sy };
}

function hitTest(cx, cy) {
  if (!scale) return -1;
  for (let i = 0; i < data.length; i++) {
    const d = data[i];
    if (d.x === null || d.y === null) continue;
    if (Math.hypot(cx - scale.cx(d.x), cy - scale.cy(d.y)) <= POINT_R + 5) return i;
  }
  return -1;
}

function isInPlotArea(pos) {
  return scale &&
    pos.x >= MARGIN.left && pos.x <= MARGIN.left + scale.W &&
    pos.y >= MARGIN.top  && pos.y <= MARGIN.top  + scale.H;
}

function updateCursor(pos) {
  if (panMode) {
    canvas.style.cursor = isInPlotArea(pos) ? (panDrag ? 'grabbing' : 'grab') : 'default';
  } else {
    canvas.style.cursor = hitTest(pos.x, pos.y) !== -1 ? 'grab' : 'crosshair';
  }
}

function movePoint(pos) {
  if (!dragState || !scale) return;
  const idx = dragState.index;
  const cx  = Math.max(MARGIN.left, Math.min(MARGIN.left + scale.W, pos.x));
  const cy  = Math.max(MARGIN.top,  Math.min(MARGIN.top  + scale.H, pos.y));
  data[idx].x = scale.dx(cx);
  data[idx].y = scale.dy(cy);
  writeRow(idx);
  draw();
}

function addPointAt(pos) {
  if (!scale || !isInPlotArea(pos)) return -1;
  const x = scale.dx(pos.x), y = scale.dy(pos.y);
  const emptyIdx = data.findIndex(d => d.x === null && d.y === null);
  let newIdx;
  if (emptyIdx !== -1) { data[emptyIdx] = { x, y }; newIdx = emptyIdx; }
  else                 { data.push({ x, y });         newIdx = data.length - 1; }
  renderTable();
  draw();
  return newIdx;
}

// ─────────────────────────────────────────────
//  Mouse events
// ─────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  hoverPos = null;
  const pos = canvasPos(e);

  if (panMode) {
    if (isInPlotArea(pos) && scale) {
      panDrag = {
        startX: pos.x, startY: pos.y,
        startOffX: panOffsetX, startOffY: panOffsetY,
        xRange: scale.xMax - scale.xMin,
        yRange: scale.yMax - scale.yMin,
        W: scale.W, H: scale.H,
      };
      canvas.style.cursor = 'grabbing';
    }
  } else {
    const idx = hitTest(pos.x, pos.y);
    if (idx !== -1) {
      dragState = { index: idx };
      canvas.style.cursor = 'grabbing';
    } else {
      const newIdx = addPointAt(pos);
      if (newIdx !== -1) { dragState = { index: newIdx }; canvas.style.cursor = 'grabbing'; }
    }
  }
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (panDrag) {
    const pos = canvasPos(e);
    panOffsetX = panDrag.startOffX - (pos.x - panDrag.startX) / panDrag.W * panDrag.xRange;
    panOffsetY = panDrag.startOffY + (pos.y - panDrag.startY) / panDrag.H * panDrag.yRange;
    draw();
    return;
  }

  if (dragState) { movePoint(canvasPos(e)); return; }

  const pos      = canvasPos(e);
  const onCanvas = canvas.contains(e.target) || e.target === canvas;

  if (onCanvas) {
    updateCursor(pos);
    hoverPos = (!panMode && isInPlotArea(pos)) ? pos : null;
  } else {
    hoverPos = null;
  }

  if (!hoverRAF) {
    hoverRAF = requestAnimationFrame(() => { draw(); hoverRAF = null; });
  }
});

document.addEventListener('mouseup', () => {
  if (panDrag) {
    panDrag = null;
    canvas.style.cursor = panMode ? 'grab' : 'crosshair';
    draw();
    return;
  }
  if (dragState) { dragState = null; canvas.style.cursor = panMode ? 'grab' : 'crosshair'; draw(); }
});

canvas.addEventListener('mouseleave', () => {
  if (!dragState && !panDrag && hoverPos) { hoverPos = null; draw(); }
});

// ─────────────────────────────────────────────
//  Touch events
// ─────────────────────────────────────────────
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  hoverPos = null;
  const pos = canvasPos(e);

  if (panMode) {
    if (isInPlotArea(pos) && scale) {
      panDrag = {
        startX: pos.x, startY: pos.y,
        startOffX: panOffsetX, startOffY: panOffsetY,
        xRange: scale.xMax - scale.xMin,
        yRange: scale.yMax - scale.yMin,
        W: scale.W, H: scale.H,
      };
    }
  } else {
    const idx = hitTest(pos.x, pos.y);
    if (idx !== -1) { dragState = { index: idx }; }
    else { const ni = addPointAt(pos); if (ni !== -1) dragState = { index: ni }; }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const pos = canvasPos(e);
  if (panDrag) {
    panOffsetX = panDrag.startOffX - (pos.x - panDrag.startX) / panDrag.W * panDrag.xRange;
    panOffsetY = panDrag.startOffY + (pos.y - panDrag.startY) / panDrag.H * panDrag.yRange;
    draw();
  } else if (dragState) {
    movePoint(pos);
  }
}, { passive: false });

canvas.addEventListener('touchend', () => {
  panDrag = null; dragState = null;
}, { passive: false });

// ─────────────────────────────────────────────
//  Controls
// ─────────────────────────────────────────────
document.getElementById('through-origin').addEventListener('change', e => {
  throughOrigin = e.target.checked;
  draw();
});

document.getElementById('pan-mode-chk').addEventListener('change', e => {
  panMode = e.target.checked;
  hoverPos = null;
  canvas.style.cursor = panMode ? 'grab' : 'crosshair';
  draw();
});

function togglePanMode() {
  const chk = document.getElementById('pan-mode-chk');
  chk.checked = !chk.checked;
  chk.dispatchEvent(new Event('change'));
}

document.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  const editable = document.activeElement?.isContentEditable;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || editable) return;
  if (e.key === 'p' || e.key === 'P') togglePanMode();
});

document.getElementById('reset-view').addEventListener('click', () => {
  panOffsetX = 0; panOffsetY = 0; draw();
});

document.getElementById('adjust-btn').addEventListener('click', draw);

document.getElementById('clear-btn').addEventListener('click', () => {
  data = Array.from({ length: NUM_INIT }, () => ({ x: null, y: null }));
  panOffsetX = 0; panOffsetY = 0;
  renderTable(); draw();
});

document.getElementById('add-row-btn').addEventListener('click', () => {
  data.push({ x: null, y: null });
  renderTable();
  document.querySelectorAll('#data-table tbody input[data-col="x"]')[data.length - 1]?.focus();
});

document.getElementById('csv-btn').addEventListener('click', () => {
  document.getElementById('csv-file').click();
});

document.getElementById('csv-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { importCSV(ev.target.result); };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('export-btn').addEventListener('click', () => {
  hoverPos = null;
  draw();
  const link = document.createElement('a');
  link.download = `regression_${getVarName('x')}_vs_${getVarName('y')}.png`
                    .replace(/\s+/g, '_');
  link.href = canvas.toDataURL('image/png');
  link.click();
});

document.querySelectorAll('#data-table thead th[contenteditable]').forEach(th => {
  th.addEventListener('input', () => { syncUnitLabels(); draw(); });
});

document.getElementById('unit-x').addEventListener('input', draw);
document.getElementById('unit-y').addEventListener('input', draw);

// ─────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────
window.addEventListener('resize', () => { resizeCanvas(); draw(); });

data = Array.from({ length: NUM_INIT }, () => ({ x: null, y: null }));
renderTable();
resizeCanvas();
draw();
</script>
