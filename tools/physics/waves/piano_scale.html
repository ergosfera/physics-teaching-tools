<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Scale Frequencies</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
:root {
  --border:  #c8d4e0;
  --text:    #1a2234;
  --muted:   #607080;
  --accent:  #1858a8;
  --surface: #ffffff;
  --bg:      #f0f4f8;
  --green:   #16a34a;
  --red:     #dc2626;
  --orange:  #ea580c;
  --purple:  #7c3aed;
  --grid:    #e3e9f0;
  --white-key: #fdfdfd;
  --white-key-edge: #9aa6b4;
  --black-key: #1d232c;
  --black-text: #e8eef5;
  --hit:     #f59e0b;
  --sel:     #3b82f6;
}
body.dark {
  --border:  #30363d;
  --text:    #e6edf3;
  --muted:   #8b949e;
  --accent:  #58a6ff;
  --surface: #161b22;
  --bg:      #0d1117;
  --green:   #3fb950;
  --red:     #f85149;
  --orange:  #fb923c;
  --purple:  #a78bfa;
  --grid:    #21262d;
  --white-key: #e8ebef;
  --white-key-edge: #5a6370;
  --black-key: #05070a;
  --black-text: #c9d1d9;
  --hit:     #fbbf24;
  --sel:     #60a5fa;
}
#theme-toggle {
  position: fixed; bottom: 10px; right: 10px; z-index: 50;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 12px; cursor: pointer;
  font-size: 0.8rem; font-weight: 600; color: var(--muted); user-select: none;
}
#theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
html, body { font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); background: var(--bg); font-size: 15px; }
button, input, select { font: inherit; color: inherit; }

#top-bar {
  display: flex; align-items: center; flex-wrap: wrap; padding: 8px 16px; gap: 8px 16px;
  background: var(--surface); border-bottom: 2px solid var(--border);
}
#top-bar h1 { font-size: 1.1rem; font-weight: 800; white-space: nowrap; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); font-weight: 600; }
select, input[type=number] {
  border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 3px 6px;
}
input[type=number] { width: 72px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.seg button { border: none; background: var(--bg); padding: 4px 11px; cursor: pointer; font-size: .82rem; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent); color: #fff; }

main { max-width: 1180px; margin: 0 auto; padding: 14px 16px 60px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.card h2 { font-size: .95rem; font-weight: 800; margin-bottom: 8px; }

/* ── Keyboard ── */
#kbd-wrap { position: relative; }
#kbd { position: relative; height: 230px; user-select: none; touch-action: none; }
.key { position: absolute; top: 0; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-align: center; transition: background .08s; }
.key.white { height: 100%; background: var(--white-key); border: 1px solid var(--white-key-edge); border-radius: 0 0 7px 7px; color: #1a2234; padding-bottom: 8px; }
.key.black { height: 60%; background: var(--black-key); border-radius: 0 0 5px 5px; color: var(--black-text); z-index: 2; padding-bottom: 6px; box-shadow: 0 3px 4px rgba(0,0,0,.35); }
.key .nm { font-weight: 800; font-size: .95rem; }
.key.black .nm { font-size: .72rem; line-height: 1.1; }
.key .fq { font-size: .78rem; font-variant-numeric: tabular-nums; margin-top: 2px; }
.key.black .fq { font-size: .64rem; }
.key .nn { font-size: .68rem; opacity: .6; margin-top: 2px; }
.key .kb { position: absolute; top: 6px; font-size: .65rem; opacity: .45; font-family: Consolas, monospace; }
.key.white.hit { background: var(--hit); }
.key.black.hit { background: var(--hit); color: #1a2234; }
.key.sel { outline: 3px solid var(--sel); outline-offset: -3px; }
.hint { font-size: .8rem; color: var(--muted); margin-top: 8px; }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 2px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 5px 12px; cursor: pointer; font-weight: 700; font-size: .85rem; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }

/* ── Two-column area ── */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

#readout { font-size: .95rem; line-height: 1.6; }
.eq { font-family: 'Cambria Math', Cambria, Georgia, serif; font-size: 1.15rem; padding: 8px 10px; background: var(--bg); border-radius: 8px; margin: 6px 0; overflow-x: auto; white-space: nowrap; }
.big { font-size: 1.25rem; font-weight: 800; color: var(--accent); }
.note { font-size: .82rem; color: var(--muted); }
.box { border-left: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: .9rem; line-height: 1.55; }
.box.warn { border-color: var(--orange); background: color-mix(in srgb, var(--orange) 10%, transparent); }

#plot { width: 100%; height: 320px; display: block; }

table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--grid); }
th { color: var(--muted); font-weight: 700; position: sticky; top: 0; background: var(--surface); }
td:nth-child(2), th:nth-child(2) { text-align: left; }
tr.hit td { background: color-mix(in srgb, var(--hit) 30%, transparent); }
tr { cursor: pointer; }
#tbl-wrap { max-height: 360px; overflow-y: auto; }
.pos { color: var(--orange); } .neg { color: var(--purple); }
.const { color: var(--green); font-weight: 700; }
sup { font-size: .7em; }
</style>
</head>
<body>

<div id="top-bar">
  <h1>🎹 Piano Scale Frequencies</h1>
  <div class="ctl">Tuning
    <div class="seg" id="sys">
      <button data-v="geo" class="on" title="Equal temperament: every semitone multiplies the frequency by the same ratio r">Geometric</button>
      <button data-v="ari" title="What if every semitone added the same number of hertz instead?">Arithmetic</button>
      <button data-v="just" title="Just intonation: simple whole-number ratios">Just ratios</button>
    </div>
  </div>
  <label class="ctl">A4 = <input type="number" id="a4" value="440" min="380" max="480" step="1"> Hz</label>
  <label class="ctl">Start
    <select id="startOct">
      <option value="2">C2</option><option value="3">C3</option><option value="4" selected>C4</option><option value="5">C5</option><option value="6">C6</option>
    </select>
  </label>
  <label class="ctl">Octaves
    <select id="nOct"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option></select>
  </label>
  <label class="ctl">Names
    <select id="names"><option value="en">C D E</option><option value="sol">Do Re Mi</option></select>
  </label>
  <label class="ctl">Sound
    <select id="timbre"><option value="piano">Piano-like</option><option value="sine">Pure sine</option></select>
  </label>
</div>

<main>
  <section class="card" id="kbd-wrap">
    <div id="kbd"></div>
    <div class="hint" id="kbd-hint">Click a key or use your computer keyboard (the letters shown on the keys). Turn on <b>Interval</b> and click two keys to compare them.</div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="play-chrom">▶ Chromatic scale</button>
      <button class="btn" id="play-major">▶ Major scale</button>
      <button class="btn" id="play-melody">▶ Ode to Joy</button>
      <button class="btn ghost" id="play-octave">▶ Octave (n = 0 and 12)</button>
      <span style="flex:1"></span>
      <label class="ctl"><input type="checkbox" id="intMode"> Interval (pick 2 keys)</label>
    </div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2 id="rule-title">The rule</h2>
      <div id="rule"></div>
      <h2 style="margin-top:14px">Selected note</h2>
      <div id="readout"><span class="note">Click a key to see how its frequency is calculated.</span></div>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h2 style="margin:0">Frequency vs. semitone number n</h2>
        <div class="seg" id="yscale">
          <button data-v="lin" class="on">Linear axis</button>
          <button data-v="log">Log axis</button>
        </div>
      </div>
      <canvas id="plot"></canvas>
      <div class="note" id="plot-note"></div>
    </section>
  </div>

  <section class="card">
    <h2>Table of frequencies</h2>
    <div id="tbl-wrap"><table id="tbl"></table></div>
    <div class="note" style="margin-top:8px" id="tbl-note"></div>
  </section>
</main>

<button id="theme-toggle">🌙</button>

<script>
const $ = id => document.getElementById(id);

// ── Musical data ────────────────────────────────────────────────
const EN  = ['C','C♯/D♭','D','D♯/E♭','E','F','F♯/G♭','G','G♯/A♭','A','A♯/B♭','B'];
const SOL = ['Do','Do♯/Re♭','Re','Re♯/Mi♭','Mi','Fa','Fa♯/Sol♭','Sol','Sol♯/La♭','La','La♯/Si♭','Si'];
const BLACK = [false,true,false,true,false,false,true,false,true,false,true,false];
const JUST = [[1,1],[16,15],[9,8],[6,5],[5,4],[4,3],[45,32],[3,2],[8,5],[5,3],[9,5],[15,8]];
const INTERVALS = ['unison','minor second','major second','minor third','major third','perfect fourth',
  'tritone','perfect fifth','minor sixth','major sixth','minor seventh','major seventh','octave'];
const R = Math.pow(2, 1/12);
const KEYS_LOW  = ['z','s','x','d','c','v','g','b','h','n','j','m',','];
const KEYS_HIGH = ['q','2','w','3','e','r','5','t','6','y','7','u','i'];

const S = { sys: 'geo', a4: 440, startOct: 4, nOct: 1, names: 'en', timbre: 'piano', ylog: false,
            current: null, interval: [], intMode: false, hits: new Set() };

const N = () => S.nOct * 12 + 1;                       // number of keys (includes top C)
const f0 = () => S.a4 * Math.pow(2, (12 * (S.startOct + 1) - 69) / 12); // starting C
const freqGeo = n => f0() * Math.pow(R, n);
function freq(n, sys = S.sys) {
  if (sys === 'geo') return freqGeo(n);
  if (sys === 'ari') return f0() * (1 + n / 12);
  const [p, q] = JUST[n % 12];
  return f0() * Math.pow(2, Math.floor(n / 12)) * p / q;
}
function name(n, short) {
  const arr = S.names === 'sol' ? SOL : EN;
  let s = arr[n % 12];
  if (short && s.includes('/')) s = s.split('/')[0];
  return s + (S.startOct + Math.floor(n / 12));
}
const cents = (a, b) => 1200 * Math.log2(a / b);
const fmt = (x, d = 2) => x.toFixed(d);

// ── Audio ───────────────────────────────────────────────────────
let ctx = null, master = null, pianoWave = null;
function audio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.35; master.connect(ctx.destination);
    const h = [0, 1, 0.55, 0.32, 0.18, 0.12, 0.06, 0.04, 0.02];
    pianoWave = ctx.createPeriodicWave(new Float32Array(h.length), new Float32Array(h));
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function tone(f, when = 0, dur = 1.4, vol = 1) {
  const c = audio(), t = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain();
  if (S.timbre === 'sine') o.type = 'sine'; else o.setPeriodicWave(pianoWave);
  o.frequency.value = f;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.6 * vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.25 * vol, t + 0.25);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function flash(n, when = 0, ms = 260) {
  setTimeout(() => {
    S.hits.add(n); paintHits();
    setTimeout(() => { S.hits.delete(n); paintHits(); }, ms);
  }, when * 1000);
}
function press(n, select = true) {
  tone(freq(n)); flash(n);
  if (!select) return;
  if (S.intMode) {
    if (S.interval.length >= 2) S.interval = [];
    S.interval.push(n);
  } else S.interval = [];
  S.current = n;
  renderReadout(); paintHits(); drawPlot();
}
let seqTimers = [];
function playSeq(ns, step = 0.38) {
  seqTimers.forEach(clearTimeout); seqTimers = [];
  ns.forEach((n, i) => {
    if (n < 0 || n >= N()) return;
    tone(freq(n), i * step, 1.0); flash(n, i * step, step * 800);
    seqTimers.push(setTimeout(() => { S.current = n; renderReadout(); drawPlot(); }, i * step * 1000));
  });
}

// ── Keyboard ────────────────────────────────────────────────────
function buildKeyboard() {
  const kbd = $('kbd'); kbd.innerHTML = '';
  const whites = []; for (let n = 0; n < N(); n++) if (!BLACK[n % 12]) whites.push(n);
  const W = 100 / whites.length;
  let wi = 0;
  for (let n = 0; n < N(); n++) {
    const el = document.createElement('div');
    const black = BLACK[n % 12];
    el.className = 'key ' + (black ? 'black' : 'white');
    el.dataset.n = n;
    if (black) { el.style.left = (wi * W - W * 0.31) + '%'; el.style.width = (W * 0.62) + '%'; }
    else { el.style.left = (wi * W) + '%'; el.style.width = W + '%'; wi++; }
    const kb = n <= 12 ? KEYS_LOW[n] : (n <= 25 ? KEYS_HIGH[n - 12] : '');
    const nmFull = (S.names === 'sol' ? SOL : EN)[n % 12];
    const nmHtml = black ? nmFull.replace('/', '<br>') : nmFull;
    el.innerHTML = (kb && !(n === 12 && S.nOct > 1) ? `<span class="kb">${kb === ',' ? ',' : kb.toUpperCase()}</span>` : '') +
      `<div class="nm">${nmHtml}${black ? '' : '<sub style="font-size:.65em">' + (S.startOct + Math.floor(n / 12)) + '</sub>'}</div>` +
      `<div class="fq">${fmt(freq(n), freq(n) < 1000 ? 1 : 0)}</div>` +
      (black ? '' : `<div class="nn">n=${n}</div>`);
    el.addEventListener('pointerdown', e => { e.preventDefault(); press(n); });
    kbd.appendChild(el);
  }
  // In 2+ octaves, n=12 belongs to the high row (Q)
  if (S.nOct > 1) {
    const k12 = kbd.querySelector('[data-n="12"]');
    const span = document.createElement('span'); span.className = 'kb'; span.textContent = 'Q';
    k12.prepend(span);
  }
  paintHits();
}
function paintHits() {
  document.querySelectorAll('#kbd .key').forEach(el => {
    const n = +el.dataset.n;
    el.classList.toggle('hit', S.hits.has(n));
    el.classList.toggle('sel', S.interval.includes(n) || (!S.intMode && S.current === n));
  });
  document.querySelectorAll('#tbl tr[data-n]').forEach(tr => tr.classList.toggle('hit', +tr.dataset.n === S.current || S.hits.has(+tr.dataset.n)));
}
function keyToN(k) {
  k = k.toLowerCase();
  if (S.nOct > 1) { const h = KEYS_HIGH.indexOf(k); if (h >= 0) return h + 12; }
  const l = KEYS_LOW.indexOf(k); if (l >= 0) return l;
  if (S.nOct === 1) { const h = KEYS_HIGH.indexOf(k); if (h >= 0) return h; }
  return -1;
}
const held = new Set();
document.addEventListener('keydown', e => {
  // Only typing fields keep the keys; menus, checkboxes and buttons must not swallow them
  if ((e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') || e.ctrlKey || e.metaKey || e.altKey) return;
  const n = keyToN(e.key);
  if (n < 0 || n >= N()) return;
  e.preventDefault();               // stop a focused menu from jumping to another option
  if (held.has(e.key)) return;
  held.add(e.key); press(n);
});
document.addEventListener('keyup', e => held.delete(e.key));

// ── Rule panel ──────────────────────────────────────────────────
function renderRule() {
  const F0 = f0(), nm0 = name(0);
  let h = '';
  if (S.sys === 'geo') {
    $('rule-title').textContent = 'The rule: a geometric sequence';
    h = `<div class="box">Each semitone <b>multiplies</b> the frequency by the same ratio <i>r</i>.
      Twelve equal steps must make one octave, which <b>doubles</b> the frequency:</div>
      <div class="eq">r<sup>12</sup> = 2 &nbsp;⟹&nbsp; r = <sup>12</sup>√2 ≈ <b>${R.toFixed(6)}</b></div>
      <div class="eq">f<sub>n</sub> = f<sub>0</sub> · r<sup>n</sup> = ${fmt(F0)} Hz · ${R.toFixed(5)}<sup>n</sup></div>
      <div class="note">f<sub>0</sub> = ${nm0} = ${fmt(F0)} Hz, computed from A4 = ${S.a4} Hz (A4 is 9 semitones above C4, so C4 = A4 / r<sup>9</sup>).</div>`;
  } else if (S.sys === 'ari') {
    const d = F0 / 12;
    $('rule-title').textContent = 'What if: an arithmetic sequence';
    h = `<div class="box warn">Here each semitone <b>adds</b> the same amount d, chosen so that 12 steps still double ${nm0}:</div>
      <div class="eq">f<sub>n</sub> = f<sub>0</sub> + n·d, &nbsp; d = f<sub>0</sub>/12 = ${fmt(d)} Hz</div>
      <div class="note">Play the Ode to Joy and compare with Geometric: the steps near the top are too small and the melody sounds out of tune.
      ${S.nOct > 1 ? `With more than one octave the problem is obvious: n = 24 gives 3·f<sub>0</sub>, not 4·f<sub>0</sub>, so the second "octave" is no longer a doubling.` : 'Choose 2 octaves to see that n = 24 gives 3·f<sub>0</sub> instead of 4·f<sub>0</sub>.'}</div>`;
  } else {
    $('rule-title').textContent = 'Comparison: just (whole-number) ratios';
    h = `<div class="box">Older tunings used simple fractions of f<sub>0</sub>: 9/8, 5/4, 4/3, 3/2… They sound very pure in one key, but the steps between neighbors are <b>not all equal</b>, so music in other keys sounds off.</div>
      <div class="eq">f<sub>n</sub> = f<sub>0</sub> · (p/q)</div>
      <div class="note">Equal temperament (geometric) is the compromise: every step is identical, and every interval is within a few cents of a simple ratio (1 cent = 1/100 of a semitone).</div>`;
  }
  $('rule').innerHTML = h;
}

// ── Readout ─────────────────────────────────────────────────────
function closestFraction(x) {
  let best = null;
  for (let q = 1; q <= 16; q++) {
    const p = Math.round(x * q);
    const err = Math.abs(cents(p / q, x));
    if (!best || err < best.err - 0.5) best = { p, q, err };
  }
  return best;
}
function renderReadout() {
  const el = $('readout');
  if (S.intMode && S.interval.length === 2) {
    const [a, b] = [...S.interval].sort((x, y) => x - y), k = b - a;
    const fa = freq(a), fb = freq(b), ratio = fb / fa, cf = closestFraction(ratio);
    const label = k <= 12 ? INTERVALS[k] : (k === 24 ? 'two octaves' : k + ' semitones');
    el.innerHTML = `<div><b>${name(a)}</b> → <b>${name(b)}</b>: k = ${k} semitones (${label})</div>
      <div class="eq">f<sub>${b}</sub> / f<sub>${a}</sub> = ${fmt(fb)} / ${fmt(fa)} = <b>${ratio.toFixed(4)}</b>
      ${S.sys === 'geo' ? ` = r<sup>${k}</sup> = 2<sup>${k}/12</sup>` : ''}</div>
      <div>Closest simple ratio: <b>${cf.p}/${cf.q}</b> = ${(cf.p / cf.q).toFixed(4)}
        <span class="note">(${cf.err < 0.05 ? 'exact' : 'off by ' + cf.err.toFixed(1) + ' cents'})</span></div>
      ${S.sys === 'geo' ? `<div class="note">In the geometric scale the ratio depends only on k, not on which note you start from. Try the same interval from a different key.</div>`
        : `<div class="note">In this tuning the same k can give different ratios depending on the starting note. Try it, then switch to Geometric.</div>`}
      <div class="row" style="margin-top:8px"><button class="btn" id="play-both">▶ Play together</button><button class="btn ghost" id="play-apart">▶ One after the other</button></div>`;
    $('play-both').onclick = () => { tone(fa, 0, 2); tone(fb, 0, 2); flash(a, 0, 800); flash(b, 0, 800); };
    $('play-apart').onclick = () => playSeq([a, b], 0.6);
    return;
  }
  if (S.intMode && S.interval.length === 1) {
    el.innerHTML = `<div><b>${name(S.interval[0])}</b> selected. Now click a second key.</div>`; return;
  }
  const n = S.current;
  if (n == null) { el.innerHTML = '<span class="note">Click a key to see how its frequency is calculated.</span>'; return; }
  const F0 = f0(), f = freq(n), fg = freqGeo(n);
  let h = `<div><b>${name(n)}</b> &nbsp; n = ${n} &nbsp; <span class="big">${fmt(f)} Hz</span></div>`;
  if (S.sys === 'geo') {
    h += `<div class="eq">f<sub>${n}</sub> = ${fmt(F0)} × ${R.toFixed(5)}<sup>${n}</sup> = ${fmt(F0)} × ${Math.pow(R, n).toFixed(5)} = <b>${fmt(f)} Hz</b></div>`;
    if (n > 0) h += `<div class="note">Same as multiplying by r ${n} time${n > 1 ? 's' : ''}: ${fmt(F0)}${' × r'.repeat(Math.min(n, 6))}${n > 6 ? ' × …' : ''}</div>`;
    if (n % 12 === 0 && n > 0) h += `<div class="note">r<sup>${n}</sup> = 2<sup>${n / 12}</sup> = ${Math.pow(2, n / 12)}: exactly ${n === 12 ? 'double' : Math.pow(2, n / 12) + ' times'} f<sub>0</sub>.</div>`;
  } else if (S.sys === 'ari') {
    h += `<div class="eq">f<sub>${n}</sub> = ${fmt(F0)} + ${n} × ${fmt(F0 / 12)} = <b>${fmt(f)} Hz</b></div>`;
    h += `<div>Equal temperament gives ${fmt(fg)} Hz → difference <b class="${f > fg ? 'pos' : 'neg'}">${cents(f, fg) >= 0 ? '+' : ''}${cents(f, fg).toFixed(1)} cents</b></div>`;
  } else {
    const [p, q] = JUST[n % 12], oct = Math.floor(n / 12);
    h += `<div class="eq">f<sub>${n}</sub> = ${fmt(F0)} × ${oct ? Math.pow(2, oct) + ' × ' : ''}${p}/${q} = <b>${fmt(f)} Hz</b></div>`;
    h += `<div>Equal temperament gives ${fmt(fg)} Hz → difference <b class="${f > fg ? 'pos' : 'neg'}">${cents(f, fg) >= 0 ? '+' : ''}${cents(f, fg).toFixed(1)} cents</b></div>`;
  }
  if (n > 0) {
    const fp = freq(n - 1);
    h += `<div class="note" style="margin-top:4px">Step from ${name(n - 1, true)}: ×${(f / fp).toFixed(5)} (ratio), +${fmt(f - fp)} Hz (difference)</div>`;
  }
  el.innerHTML = h;
}

// ── Table ───────────────────────────────────────────────────────
function renderTable() {
  const showCmp = S.sys !== 'geo';
  let h = `<tr><th>n</th><th>Note</th><th>f (Hz)</th><th>f / f<sub>0</sub></th><th>Ratio to previous<br>f<sub>n</sub> / f<sub>n−1</sub></th><th>Difference to previous<br>f<sub>n</sub> − f<sub>n−1</sub> (Hz)</th>${showCmp ? '<th>vs. equal<br>temperament</th>' : ''}</tr>`;
  for (let n = 0; n < N(); n++) {
    const f = freq(n), prev = n ? freq(n - 1) : null;
    const ratio = n ? f / prev : null, diff = n ? f - prev : null;
    const ratioCls = S.sys === 'geo' ? 'const' : '', diffCls = S.sys === 'ari' ? 'const' : '';
    let rel;
    if (S.sys === 'just') { const [p, q] = JUST[n % 12], o = Math.pow(2, Math.floor(n / 12)); rel = (o > 1 ? o + '·' : '') + (p === 1 && q === 1 ? '1' : p + '/' + q); }
    else rel = (f / f0()).toFixed(5);
    const c = cents(f, freqGeo(n));
    h += `<tr data-n="${n}"><td>${n}</td><td>${name(n, true)}</td><td><b>${fmt(f)}</b></td><td>${rel}</td>
      <td class="${ratioCls}">${n ? ratio.toFixed(5) : '—'}</td><td class="${diffCls}">${n ? fmt(diff) : '—'}</td>
      ${showCmp ? `<td class="${c > 0.05 ? 'pos' : c < -0.05 ? 'neg' : ''}">${Math.abs(c) < 0.05 ? '0' : (c > 0 ? '+' : '') + c.toFixed(1)} ¢</td>` : ''}</tr>`;
  }
  $('tbl').innerHTML = h;
  $('tbl').querySelectorAll('tr[data-n]').forEach(tr => tr.addEventListener('click', () => press(+tr.dataset.n)));
  $('tbl-note').innerHTML = S.sys === 'geo'
    ? 'In the geometric scale the <span class="const">ratio</span> column is constant (r ≈ 1.05946) while the differences in hertz keep growing.'
    : S.sys === 'ari'
      ? 'In the arithmetic scale the <span class="const">difference</span> column is constant while the ratio keeps shrinking, so each step sounds smaller than the last.'
      : 'With just ratios neither column is constant. Cents: + means sharper than equal temperament, − flatter.';
  paintHits();
}

// ── Plot ────────────────────────────────────────────────────────
function css(v) { return getComputedStyle(document.body).getPropertyValue(v).trim(); }
function drawPlot() {
  const cv = $('plot'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const C = { grid: css('--grid'), text: css('--muted'), acc: css('--accent'), or: css('--orange'), pu: css('--purple'), hit: css('--hit'), txt: css('--text') };
  const L = 58, Rm = 14, T = 14, B = 34, pw = W - L - Rm, ph = H - T - B;
  const nMax = N() - 1;
  const all = []; for (let n = 0; n <= nMax; n++) all.push(freq(n), freqGeo(n));
  let ymin = Math.min(...all), ymax = Math.max(...all);
  const yv = S.ylog ? (f => Math.log2(f)) : (f => f);
  let a = yv(ymin), b = yv(ymax);
  if (!S.ylog) { const st = niceStep((ymax - ymin) / 5); a = Math.floor(ymin * 0.94 / st) * st; b = ymax + (ymax - a) * 0.06; }
  else { const pad = (b - a) * 0.06; a -= pad; b += pad; }
  const X = n => L + (n / nMax) * pw, Y = f => T + ph - (yv(f) - a) / (b - a) * ph;

  // grid + y ticks
  g.font = '11px Segoe UI, sans-serif'; g.fillStyle = C.text; g.strokeStyle = C.grid; g.lineWidth = 1;
  g.textAlign = 'right'; g.textBaseline = 'middle';
  let ticks = [];
  if (S.ylog) { for (let k = 0; k <= S.nOct + 1; k++) ticks.push(f0() * Math.pow(2, k)); ticks = ticks.filter(t => yv(t) >= a && yv(t) <= b); }
  else { const step = niceStep((b - a) / 5); for (let t = a; t <= b; t += step) ticks.push(t); }
  ticks.forEach(t => { const y = Y(t); g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke(); g.fillText(Math.round(t), L - 6, y); });
  // x ticks
  g.textAlign = 'center'; g.textBaseline = 'top';
  const xs = nMax <= 12 ? 1 : 2;
  for (let n = 0; n <= nMax; n += xs) { g.beginPath(); g.moveTo(X(n), T); g.lineTo(X(n), T + ph); g.stroke(); g.fillText(n, X(n), T + ph + 4); }
  g.fillText('semitone number n', L + pw / 2, T + ph + 18);
  g.save(); g.translate(13, T + ph / 2); g.rotate(-Math.PI / 2); g.fillText(S.ylog ? 'frequency (Hz, log scale)' : 'frequency (Hz)', 0, 0); g.restore();

  // geometric reference curve
  g.strokeStyle = C.acc; g.lineWidth = S.sys === 'geo' ? 2.2 : 1.4; g.setLineDash(S.sys === 'geo' ? [] : [5, 4]);
  g.beginPath();
  for (let i = 0; i <= 200; i++) { const n = nMax * i / 200; const y = Y(f0() * Math.pow(2, n / 12)); i ? g.lineTo(X(n), y) : g.moveTo(X(n), y); }
  g.stroke(); g.setLineDash([]);
  // arithmetic line
  if (S.sys === 'ari') { g.strokeStyle = C.or; g.lineWidth = 2.2; g.beginPath(); g.moveTo(X(0), Y(freq(0))); for (let i = 1; i <= 100; i++) { const n = nMax * i / 100; g.lineTo(X(n), Y(f0() * (1 + n / 12))); } g.stroke(); }

  // points
  const col = S.sys === 'geo' ? C.acc : S.sys === 'ari' ? C.or : C.pu;
  for (let n = 0; n <= nMax; n++) {
    const on = n === S.current || S.interval.includes(n);
    g.beginPath(); g.arc(X(n), Y(freq(n)), on ? 6.5 : 4, 0, 7);
    g.fillStyle = on ? C.hit : col; g.fill();
    if (on) { g.strokeStyle = C.txt; g.lineWidth = 1.5; g.stroke(); }
  }
  // selected label
  if (S.current != null && S.current <= nMax) {
    const n = S.current, f = freq(n);
    g.fillStyle = C.txt; g.font = 'bold 12px Segoe UI, sans-serif'; g.textBaseline = 'bottom';
    g.textAlign = n > nMax * 0.7 ? 'right' : 'left';
    g.fillText(`${name(n, true)}: ${fmt(f, 1)} Hz`, X(n) + (n > nMax * 0.7 ? -9 : 9), Y(f) - 6);
  }
  // legend
  g.font = '11px Segoe UI, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle';
  let ly = T + 8;
  const leg = (c, t, dash) => { g.strokeStyle = c; g.lineWidth = 2; g.setLineDash(dash || []); g.beginPath(); g.moveTo(L + 10, ly); g.lineTo(L + 30, ly); g.stroke(); g.setLineDash([]); g.fillStyle = C.text; g.fillText(t, L + 36, ly); ly += 16; };
  leg(C.acc, 'geometric: f₀·2^(n/12)', S.sys === 'geo' ? null : [5, 4]);
  if (S.sys === 'ari') leg(C.or, 'arithmetic: f₀ + n·d');
  if (S.sys === 'just') { g.fillStyle = C.pu; g.beginPath(); g.arc(L + 20, ly, 4, 0, 7); g.fill(); g.fillStyle = C.text; g.fillText('just ratios', L + 36, ly); }

  $('plot-note').innerHTML = S.ylog
    ? (S.sys === 'geo' ? 'On a log axis the geometric sequence becomes a <b>straight line</b>: equal steps in n are equal steps in log f. Gridlines mark each doubling (octave).' :
       S.sys === 'ari' ? 'On a log axis the arithmetic sequence bends downward: its steps get smaller and smaller as you go up.' :
       'On a log axis the just ratios sit close to, but not exactly on, the straight geometric line.')
    : (S.sys === 'geo' ? 'On a linear axis the frequencies curve upward (exponential growth). Switch to <b>Log axis</b> to straighten it.' :
       S.sys === 'ari' ? 'An arithmetic sequence is a straight line on a linear axis. Compare it with the dashed geometric curve.' :
       'Just ratios are close to the geometric curve but not exactly on it.');
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))), m = x / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }

// ── Controls ────────────────────────────────────────────────────
function segment(id, cb) {
  $(id).querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); cb(b.dataset.v);
  }));
}
function renderAll() { buildKeyboard(); renderRule(); renderReadout(); renderTable(); drawPlot(); }
segment('sys', v => { S.sys = v; renderAll(); });
segment('yscale', v => { S.ylog = v === 'log'; drawPlot(); });
$('a4').addEventListener('input', () => { const v = +$('a4').value; if (v >= 300 && v <= 600) { S.a4 = v; renderAll(); } });
$('startOct').addEventListener('change', () => { S.startOct = +$('startOct').value; renderAll(); });
$('nOct').addEventListener('change', () => { S.nOct = +$('nOct').value; S.interval = S.interval.filter(n => n < N()); if (S.current >= N()) S.current = null; renderAll(); });
$('names').addEventListener('change', () => { S.names = $('names').value; renderAll(); });
$('timbre').addEventListener('change', () => { S.timbre = $('timbre').value; });
$('intMode').addEventListener('change', () => { S.intMode = $('intMode').checked; S.interval = []; renderReadout(); paintHits(); drawPlot(); });
$('play-chrom').onclick = () => playSeq([...Array(N()).keys()], 0.28);
$('play-major').onclick = () => { const m = [0, 2, 4, 5, 7, 9, 11]; const s = []; for (let o = 0; o < S.nOct; o++) m.forEach(x => s.push(x + 12 * o)); s.push(12 * S.nOct); playSeq(s, 0.36); };
$('play-melody').onclick = () => playSeq([4,4,5,7,7,5,4,2,0,0,2,4,4,2,2, -1, 4,4,5,7,7,5,4,2,0,0,2,4,2,0,0], 0.34);
$('play-octave').onclick = () => playSeq([0, 12, 0, 12], 0.55);
window.addEventListener('resize', drawPlot);
// Hand focus back to the page after a menu choice so the computer keyboard plays notes again
document.querySelectorAll('#top-bar select').forEach(s => s.addEventListener('change', () => s.blur()));

renderAll();
</script>

<script>
(function(){
  const btn = document.getElementById('theme-toggle');
  let saved = null; try { saved = localStorage.getItem('theme'); } catch (e) {}
  if (saved === 'dark') { document.body.classList.add('dark'); btn.textContent = '☀'; }
  btn.addEventListener('click', () => {
    const isDark = document.body.classList.toggle('dark');
    btn.textContent = isDark ? '☀' : '🌙';
    try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
    drawPlot();
  });
})();
</script>
</body>
</html>
