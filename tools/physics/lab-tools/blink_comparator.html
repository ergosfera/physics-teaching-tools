<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blink Comparator</title>

<style>
  :root{
    --desktop:#008080;
    --face:#C0C0C0;
    --hi:#FFFFFF;
    --light:#DFDFDF;
    --shadow:#808080;
    --dark:#000000;
    --title:#000080;
    --sel:#000080;
    --field:#FFFFFF;
    --ui:Tahoma,"MS Sans Serif",Verdana,Geneva,sans-serif;
    --fixed:"Lucida Console","Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;margin:0;padding:0}
  body{
    background:var(--desktop);
    font-family:var(--ui);
    font-size:13px;
    color:#000;
    -webkit-font-smoothing:none;
    padding:4px 4px calc(48px + env(safe-area-inset-bottom));
    overflow:hidden;
  }

  /* ---- Win95 bevels ---- */
  .raised{
    background:var(--face);
    box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--hi),
               inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--light);
  }
  .sunken{
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }

  /* ---- window ---- */
  .window{
    display:flex;flex-direction:column;
    height:calc(100vh - 8px - 48px - env(safe-area-inset-bottom));
    padding:3px;
  }
  .titlebar{
    background:var(--title);color:#fff;
    display:flex;align-items:center;gap:5px;
    padding:2px 2px 2px 3px;margin-bottom:2px;
    flex-shrink:0;
  }
  .titlebar .t{
    font-weight:700;font-size:15px;flex:1;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .titlebar svg{display:block;flex:none}
  .tbtn{
    width:24px;height:22px;padding:0;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--ui);font-size:13px;font-weight:700;line-height:1;
    background:var(--face);border:0;color:#000;cursor:pointer;
    box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--hi),
               inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--light);
  }
  .tbtn:active{box-shadow:inset 1px 1px 0 var(--dark), inset 2px 2px 0 var(--shadow);padding:1px 0 0 1px}

  /* ---- body ---- */
  .wbody{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:2px}

  /* ---- toolbar area ---- */
  #controls{
    background:var(--face);
    padding:3px 4px;flex-shrink:0;
  }
  .row{
    display:flex;align-items:center;flex-wrap:wrap;
    gap:4px;padding:2px 0;
  }
  .sep{width:2px;height:18px;margin:0 2px;
    box-shadow:inset -1px 0 0 var(--hi), inset 1px 0 0 var(--shadow);
  }

  /* ---- buttons ---- */
  button.b95{
    font-family:var(--ui);font-size:12px;color:#000;background:var(--face);
    border:0;padding:4px 9px;min-height:22px;cursor:pointer;white-space:nowrap;
    box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--hi),
               inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--light);
  }
  button.b95:active,button.b95.pressed{
    box-shadow:inset 1px 1px 0 var(--shadow), inset 2px 2px 0 var(--dark);
    padding:5px 8px 3px 10px;
  }
  button.b95:disabled{color:var(--shadow);text-shadow:1px 1px 0 var(--hi);cursor:default}

  #btn-blink{font-weight:700;font-size:13px;padding:4px 14px}
  #btn-blink.stop{background:#C0C0C0;color:#800000;font-weight:700}

  /* ---- badge ---- */
  .badge{
    font-size:11px;font-weight:700;background:var(--sel);color:#fff;
    padding:2px 7px;letter-spacing:.04em;
  }

  /* ---- labels ---- */
  label{color:#000;font-size:12px}
  .file-label{font-family:var(--fixed);font-size:12px;color:var(--shadow)}
  .file-label.loaded{color:#000}

  /* ---- inputs ---- */
  input[type=range]{
    width:100px;cursor:pointer;accent-color:var(--title);
  }
  input[type=number]{
    width:40px;padding:2px 4px;border:0;
    font-size:12px;text-align:center;
    font-family:var(--fixed);color:#000;
    background:var(--field);
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow);
  }
  input[type=number]:focus{outline:none}
  .lbl-val{font-family:var(--fixed);font-size:12px;color:var(--title);min-width:28px}
  .lbl-off{font-family:var(--fixed);font-size:12px;color:var(--title)}

  /* ---- status bar ---- */
  .status-wrap{display:flex;gap:3px;padding:2px 0;flex-shrink:0}
  .status-wrap div{
    font-size:12px;padding:3px 6px;font-family:var(--fixed);
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow);
    background:var(--face);
  }
  .status-wrap .s1{flex:1}

  /* ---- canvas ---- */
  #canvas-wrap{
    flex:1;position:relative;overflow:hidden;
    background:#000;
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }
  canvas{display:block;width:100%;height:100%}

  /* ---- taskbar ---- */
  .taskbar{
    position:fixed;left:0;right:0;bottom:0;height:40px;
    background:var(--face);display:flex;align-items:center;gap:4px;
    padding:4px 4px calc(4px + env(safe-area-inset-bottom));
    box-shadow:inset 0 1px 0 var(--hi), inset 0 2px 0 var(--light);
  }
  .taskbtn{
    display:flex;align-items:center;gap:6px;font-weight:700;padding:4px 10px;min-height:30px;
  }
  .tray{
    margin-left:auto;font-family:var(--fixed);font-size:13px;padding:5px 10px;
    box-shadow:inset -1px -1px 0 var(--hi), inset 1px 1px 0 var(--shadow),
               inset -2px -2px 0 var(--light), inset 2px 2px 0 var(--dark);
  }

  /* hidden file inputs */
  .hidden-file{display:none}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!-- ═══════════════ WINDOW ═══════════════ -->
<div class="window raised" id="win">
  <div class="titlebar">
    <svg width="17" height="17" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="2" y="2" width="12" height="12" fill="#C0C0C0"/>
      <rect x="3" y="3" width="10" height="10" fill="#000080"/>
      <rect x="5" y="5" width="3" height="3" fill="#FFFF00"/>
      <rect x="9" y="5" width="3" height="3" fill="#808080"/>
      <rect x="5" y="9" width="3" height="3" fill="#808080"/>
      <rect x="9" y="9" width="3" height="3" fill="#FFFF00"/>
    </svg>
    <span class="t">Blink Comparator</span>
    <button class="tbtn" title="Minimize" aria-label="Minimize">_</button>
    <button class="tbtn" title="Maximize" aria-label="Maximize">□</button>
    <button class="tbtn" title="Close" aria-label="Close">✕</button>
  </div>

  <div class="wbody">
    <div id="controls">

      <!-- Row 1: Load -->
      <div class="row">
        <button class="b95" onclick="pickFile(1)">Load Image 1</button>
        <span id="lbl1" class="file-label">— no image —</span>
        <div class="sep"></div>
        <button class="b95" onclick="pickFile(2)">Load Image 2</button>
        <span id="lbl2" class="file-label">— no image —</span>
      </div>

      <!-- Row 2: Alignment -->
      <div class="row">
        <button class="b95" id="btn-add" onclick="addPair()" disabled>Add Ref Point</button>
        <button class="b95" id="btn-remove" onclick="removeLast()" disabled>Remove Last</button>
        <button class="b95" id="btn-apply" onclick="applyAlign()" disabled>Apply Alignment</button>
        <button class="b95" id="btn-reset" onclick="resetAlignment()" disabled>Reset</button>
        <span id="badge" class="badge">0 pairs</span>
      </div>

      <!-- Row 3: Nudge + timing + blink -->
      <div class="row">
        <label>Nudge:</label>
        <button class="b95" onclick="nudge(-1,0)">&larr;</button>
        <button class="b95" onclick="nudge( 1,0)">&rarr;</button>
        <button class="b95" onclick="nudge( 0,-1)">&uarr;</button>
        <button class="b95" onclick="nudge( 0, 1)">&darr;</button>
        <label>step</label>
        <input type="number" id="step" value="1" min="1" max="100">
        <span id="lbl-off" class="lbl-off">dx=0 dy=0</span>

        <div class="sep"></div>

        <label>Img1 ms:</label>
        <input type="range" id="t1" min="50" max="3000" step="50" value="500" oninput="syncTiming()">
        <span id="v1" class="lbl-val">500</span>

        <label>Img2 ms:</label>
        <input type="range" id="t2" min="50" max="3000" step="50" value="500" oninput="syncTiming()">
        <span id="v2" class="lbl-val">500</span>

        <div class="sep"></div>
        <button class="b95" id="btn-blink" onclick="toggleBlink()" disabled>Start Blinking</button>
      </div>

      <!-- Status -->
      <div class="status-wrap">
        <div class="s1" id="status-bar">Load both images to begin.</div>
      </div>

    </div>

    <div id="canvas-wrap">
      <canvas id="cv"></canvas>
    </div>
  </div>
</div>

<!-- ═══════════════ TASKBAR ═══════════════ -->
<div class="taskbar">
  <button class="b95 taskbtn" id="taskBtn">
    <svg width="17" height="17" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="2" y="2" width="12" height="12" fill="#000080"/>
      <rect x="5" y="5" width="3" height="3" fill="#FFFF00"/>
      <rect x="9" y="5" width="3" height="3" fill="#808080"/>
      <rect x="5" y="9" width="3" height="3" fill="#808080"/>
      <rect x="9" y="9" width="3" height="3" fill="#FFFF00"/>
    </svg>
    Blink Comparator
  </button>
  <span class="tray" id="tray">—</span>
</div>

<!-- Hidden file inputs -->
<input type="file" id="fi1" accept="image/*" class="hidden-file" onchange="onFile(1)">
<input type="file" id="fi2" accept="image/*" class="hidden-file" onchange="onFile(2)">

<script>
"use strict";

/* ── Tray clock ── */
function updateTray(){
  const d = new Date();
  document.getElementById('tray').textContent =
    d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
updateTray(); setInterval(updateTray, 30000);

// ─── State ────────────────────────────────────────────────────────────────────
const S = {
  img1: null, img2: null,
  w1:0, h1:0, w2:0, h2:0,

  img2Aligned: null,
  img2Display: null,

  points1: [], points2: [],
  alignMode: null,
  sbsOn: false,

  L: null, R: null,

  nudgeDx: 0, nudgeDy: 0,

  blinking: false,
  cur: 1,
  timer: null,
  t1: 500, t2: 500,
};

const COLORS = [
  '#FF5555','#55AAFF','#FFCC22','#55DD55',
  '#FF55FF','#22CCCC','#FF8833','#AA55FF',
  '#FFFF44','#44FFaa'
];

const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

// ─── Canvas sizing ────────────────────────────────────────────────────────────
function fitCanvas() {
  cv.width  = wrap.clientWidth;
  cv.height = wrap.clientHeight;
  redraw();
}
new ResizeObserver(fitCanvas).observe(wrap);

// ─── File loading ─────────────────────────────────────────────────────────────
function pickFile(n) { document.getElementById('fi' + n).click(); }

function onFile(n) {
  const inp  = document.getElementById('fi' + n);
  const file = inp.files[0];
  if (!file) return;
  inp.value = '';
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    if (n === 1) {
      S.img1 = img; S.w1 = img.naturalWidth; S.h1 = img.naturalHeight;
      el('lbl1').textContent = file.name; el('lbl1').className = 'file-label loaded';
    } else {
      S.img2 = img; S.w2 = img.naturalWidth; S.h2 = img.naturalHeight;
      el('lbl2').textContent = file.name; el('lbl2').className = 'file-label loaded';
    }
    resetState();
    checkReady();
    redraw();
  };
  img.src = url;
}

function checkReady() {
  const ok = S.img1 && S.img2;
  setDisabled('btn-add', !ok);
  setDisabled('btn-blink', !ok);
  if (ok) status('Add reference points (3+ recommended, spread across the image), then Apply Alignment.');
}

// ─── Alignment ────────────────────────────────────────────────────────────────
function addPair() {
  stopBlink();
  S.sbsOn = true;
  S.alignMode = 'pick1';
  redraw();
  const i = S.points1.length;
  status(`Point ${i+1} — Click landmark on IMAGE 1 (left panel).`);
}

function removeLast() {
  if (S.points1.length) S.points1.pop();
  if (S.points2.length) S.points2.pop();
  updatePairUI();
  if (S.sbsOn) redraw();
}

function resetAlignment() {
  resetState();
  status('Alignment reset.');
  redraw();
}

function resetState() {
  S.points1 = []; S.points2 = [];
  S.alignMode = null; S.sbsOn = false;
  S.img2Aligned = null; S.img2Display = null;
  S.nudgeDx = 0; S.nudgeDy = 0;
  el('lbl-off').textContent = 'dx=0 dy=0';
  setDisabled('btn-apply', true);
  setDisabled('btn-reset', true);
  setDisabled('btn-remove', true);
  el('badge').textContent = '0 pairs';
}

function updatePairUI() {
  const n = S.points1.length, ok = S.points2.length === n;
  el('badge').textContent = n + (n === 1 ? ' pair' : ' pairs');
  setDisabled('btn-apply', !(n >= 1 && ok));
  setDisabled('btn-reset', n === 0);
  setDisabled('btn-remove', n === 0);
}

// Canvas click — pick points
cv.addEventListener('click', e => {
  if (!S.sbsOn || !S.alignMode || !S.L || !S.R) return;
  const r  = cv.getBoundingClientRect();
  const cx = (e.clientX - r.left) * (cv.width  / r.width);
  const cy = (e.clientY - r.top)  * (cv.height / r.height);
  const GAP = 6, hw = (cv.width - GAP) / 2;

  if (S.alignMode === 'pick1' && cx < hw) {
    const ix = (cx - S.L.ox) / S.L.sc;
    const iy = (cy - S.L.oy) / S.L.sc;
    S.points1.push({x: ix, y: iy});
    S.alignMode = 'pick2';
    redraw();
    const i = S.points1.length - 1;
    status(`Point ${i+1} — Now click the SAME landmark on IMAGE 2 (right panel).`);

  } else if (S.alignMode === 'pick2' && cx > hw + GAP) {
    const ix = (cx - S.R.ox) / S.R.sc;
    const iy = (cy - S.R.oy) / S.R.sc;
    S.points2.push({x: ix, y: iy});
    S.alignMode = null;
    updatePairUI();
    redraw();
    const n = S.points1.length, need = Math.max(0, 3 - n);
    status(need > 0
      ? `Pair ${n} added. ${need} more for affine — or Apply now for basic alignment.`
      : `${n} pairs set.  Apply Alignment or add more.`);
  }
});

// Apply alignment
function applyAlign() {
  const n = S.points1.length;
  if (n === 0 || S.points2.length !== n) return;

  if (n >= 3) {
    const p = S.points1;
    const area = Math.abs(
      (p[1].x - p[0].x) * (p[2].y - p[0].y) -
      (p[2].x - p[0].x) * (p[1].y - p[0].y)) / 2;
    if (area < 0.002 * S.w1 * S.h1) {
      alert('The first 3 reference points are nearly collinear (in a straight line).\n' +
            'Please remove and pick points that form a wide triangle across the image.');
      return;
    }
  }

  let p2 = S.points2;
  if (S.w2 !== S.w1 || S.h2 !== S.h1) {
    const sx = S.w1 / S.w2, sy = S.h1 / S.h2;
    p2 = S.points2.map(p => ({x: p.x * sx, y: p.y * sy}));
  }

  const res = computeAffine(S.points1, p2);
  if (!res) { status('Alignment failed: singular transform.'); return; }
  const [coeff, modeName] = res;

  S.img2Aligned = warpImage(S.img2, coeff, S.w1, S.h1);
  if (!S.img2Aligned) { status('Transform failed (degenerate).'); return; }
  S.img2Display = S.img2Aligned;
  S.nudgeDx = 0; S.nudgeDy = 0;
  el('lbl-off').textContent = 'dx=0 dy=0';
  S.sbsOn = false; S.alignMode = null;

  drawBlend();
  status(`Aligned (${modeName}, ${n} pair${n!==1?'s':''}).  `+
         `Blend preview shown — nudge or arrow keys to fine-tune, then Start Blinking.`);
}

function warpImage(srcImg, C, w1, h1) {
  const [a, b, c, d, e, f] = C;
  const det = a * e - b * d;
  if (Math.abs(det) < 1e-10) return null;
  const A = e/det,  B = -d/det;
  const CC = -b/det, D =  a/det;
  const E = (b*f - e*c)/det, F = (d*c - a*f)/det;
  const oc = document.createElement('canvas');
  oc.width = w1; oc.height = h1;
  const ox = oc.getContext('2d');
  ox.setTransform(A, B, CC, D, E, F);
  ox.drawImage(srcImg, 0, 0, w1, h1);
  return oc;
}

// ─── Nudge ────────────────────────────────────────────────────────────────────
function nudge(dx, dy) {
  if (!S.img1) return;
  const step = parseInt(el('step').value) || 1;
  S.nudgeDx += dx * step;
  S.nudgeDy += dy * step;
  el('lbl-off').textContent = `dx=${S.nudgeDx} dy=${S.nudgeDy}`;
  const oc = document.createElement('canvas');
  oc.width = S.w1; oc.height = S.h1;
  const ox = oc.getContext('2d');
  if (S.img2Aligned) {
    ox.drawImage(S.img2Aligned, S.nudgeDx, S.nudgeDy);
  } else {
    ox.drawImage(S.img2, S.nudgeDx, S.nudgeDy, S.w1, S.h1);
  }
  S.img2Display = oc;
  if (!S.blinking) drawSingle(S.img2Display);
}

// ─── Timing ───────────────────────────────────────────────────────────────────
function syncTiming() {
  S.t1 = +el('t1').value; el('v1').textContent = S.t1;
  S.t2 = +el('t2').value; el('v2').textContent = S.t2;
}

// ─── Blinking ─────────────────────────────────────────────────────────────────
function toggleBlink() { S.blinking ? stopBlink() : startBlink(); }

function startBlink() {
  if (!S.img1 || !S.img2) return;
  S.sbsOn = false;
  S.blinking = true; S.cur = 1;
  el('btn-blink').textContent = 'Stop Blinking';
  el('btn-blink').classList.add('stop');
  blinkStep();
}

function stopBlink() {
  if (!S.blinking) return;
  S.blinking = false;
  clearTimeout(S.timer); S.timer = null;
  el('btn-blink').textContent = 'Start Blinking';
  el('btn-blink').classList.remove('stop');
  status('Blinking stopped.');
}

function blinkStep() {
  if (!S.blinking) return;
  if (S.cur === 1) {
    drawSingle(S.img1, S.w1, S.h1);
    status('Image 1');
    S.cur = 2;
    S.timer = setTimeout(blinkStep, S.t1);
  } else {
    const src = S.img2Display || S.img2;
    const w = src instanceof HTMLCanvasElement ? src.width  : S.w2;
    const h = src instanceof HTMLCanvasElement ? src.height : S.h2;
    drawSingle(src, w, h);
    status('Image 2');
    S.cur = 1;
    S.timer = setTimeout(blinkStep, S.t2);
  }
}

// ─── Drawing ──────────────────────────────────────────────────────────────────
function redraw() {
  if (S.sbsOn && S.img1 && S.img2) drawSBS();
  else if (S.img1) drawSingle(S.img1, S.w1, S.h1);
  else { ctx.clearRect(0,0,cv.width,cv.height); }
}

function imgSize(src) {
  return src instanceof HTMLCanvasElement
    ? [src.width, src.height]
    : [src.naturalWidth, src.naturalHeight];
}

function drawSingle(src, iw, ih) {
  if (!src) return;
  if (!iw || !ih) [iw, ih] = imgSize(src);
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const sc = Math.min(W / iw, H / ih);
  const nw = iw * sc, nh = ih * sc;
  const ox = (W - nw) / 2, oy = (H - nh) / 2;
  ctx.drawImage(src, ox, oy, nw, nh);
}

function drawBlend() {
  if (!S.img1 || !S.img2Aligned) return;
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const sc = Math.min(W / S.w1, H / S.h1);
  const nw = S.w1 * sc, nh = S.h1 * sc;
  const ox = (W - nw) / 2, oy = (H - nh) / 2;
  ctx.globalAlpha = 1;   ctx.drawImage(S.img1, ox, oy, nw, nh);
  ctx.globalAlpha = 0.5; ctx.drawImage(S.img2Display || S.img2Aligned, ox, oy, nw, nh);
  ctx.globalAlpha = 1;
}

function drawSBS() {
  const W = cv.width, H = cv.height;
  const GAP = 6, hw = (W - GAP) / 2;
  ctx.clearRect(0, 0, W, H);

  const s1 = Math.min(hw / S.w1, H / S.h1);
  const nw1 = S.w1 * s1, nh1 = S.h1 * s1;
  const ox1 = (hw - nw1) / 2, oy1 = (H - nh1) / 2;
  S.L = {sc: s1, ox: ox1, oy: oy1};
  ctx.drawImage(S.img1, ox1, oy1, nw1, nh1);

  const s2 = Math.min(hw / S.w2, H / S.h2);
  const nw2 = S.w2 * s2, nh2 = S.h2 * s2;
  const ox2 = hw + GAP + (hw - nw2) / 2, oy2 = (H - nh2) / 2;
  S.R = {sc: s2, ox: ox2, oy: oy2};
  ctx.drawImage(S.img2, ox2, oy2, nw2, nh2);

  // Divider
  ctx.fillStyle = '#808080'; ctx.fillRect(hw, 0, GAP, H);

  // Panel labels
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,128,0.7)';
  ctx.fillRect(0, 0, hw, 20); ctx.fillRect(hw+GAP, 0, hw, 20);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Tahoma, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('IMAGE 1 — click here', hw / 2, 14);
  ctx.fillText('IMAGE 2 — click here', hw + GAP + hw / 2, 14);
  ctx.restore();

  // Confirmed pairs
  const n = Math.min(S.points1.length, S.points2.length);
  for (let i = 0; i < n; i++) {
    const col = COLORS[i % COLORS.length];
    crosshair(...lToC(S.points1[i]), col, `P${i+1}`, 0, hw, H);
    crosshair(...rToC(S.points2[i]), col, `P${i+1}`, hw+GAP, W, H);
  }

  // Pending img1 pick
  if (S.alignMode === 'pick2' && S.points1.length > S.points2.length) {
    const i   = S.points1.length - 1;
    const col = COLORS[i % COLORS.length];
    const [cx, cy] = lToC(S.points1[i]);
    crosshair(cx, cy, col, `P${i+1}`, 0, hw, H);
    ctx.save();
    ctx.strokeStyle = col; ctx.globalAlpha = 0.3;
    ctx.setLineDash([4, 8]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(hw, cy); ctx.lineTo(W, cy); ctx.stroke();
    ctx.restore();
  }
}

function lToC(p) { return [p.x * S.L.sc + S.L.ox, p.y * S.L.sc + S.L.oy]; }
function rToC(p) { return [p.x * S.R.sc + S.R.ox, p.y * S.R.sc + S.R.oy]; }

function crosshair(cx, cy, col, lbl, xmin, xmax, ch) {
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.setLineDash([7, 4]);
  ctx.beginPath();
  ctx.moveTo(xmin, cy); ctx.lineTo(xmax, cy);
  ctx.moveTo(cx, 0);    ctx.lineTo(cx, ch);
  ctx.stroke();
  ctx.setLineDash([]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.stroke();
  if (lbl) {
    ctx.fillStyle = col; ctx.font = 'bold 10px Tahoma, sans-serif';
    ctx.fillText(lbl, cx + 10, cy - 8);
  }
  ctx.restore();
}

// ─── Affine math ──────────────────────────────────────────────────────────────
function computeAffine(p1, p2) {
  const n = p1.length;

  if (n === 1) {
    return [[1, 0, p2[0].x - p1[0].x,  0, 1, p2[0].y - p1[0].y], 'translation'];
  }

  if (n === 2) {
    const vx = p1[1].x-p1[0].x, vy = p1[1].y-p1[0].y;
    const wx = p2[1].x-p2[0].x, wy = p2[1].y-p2[0].y;
    const lv = Math.hypot(vx, vy), lw = Math.hypot(wx, wy);
    if (lv < 1e-6) {
      const dx = (p2[0].x-p1[0].x + p2[1].x-p1[1].x) / 2;
      const dy = (p2[0].y-p1[0].y + p2[1].y-p1[1].y) / 2;
      return [[1, 0, dx, 0, 1, dy], 'translation'];
    }
    const sc = lw / lv, ang = Math.atan2(wy, wx) - Math.atan2(vy, vx);
    const a = sc * Math.cos(ang), b = sc * Math.sin(ang);
    const cx1 = (p1[0].x+p1[1].x)/2, cy1 = (p1[0].y+p1[1].y)/2;
    const cx2 = (p2[0].x+p2[1].x)/2, cy2 = (p2[0].y+p2[1].y)/2;
    const c = cx2 - (a*cx1 - b*cy1);
    const f = cy2 - (b*cx1 + a*cy1);
    return [[a, -b, c, b, a, f], 'rotation + scale'];
  }

  // 3+ pairs — full affine via normal equations
  const ATA = [[0,0,0],[0,0,0],[0,0,0]];
  const bx = [0,0,0], by = [0,0,0];
  for (let i = 0; i < n; i++) {
    const r = [p1[i].x, p1[i].y, 1];
    for (let j = 0; j < 3; j++) {
      bx[j] += r[j] * p2[i].x;
      by[j] += r[j] * p2[i].y;
      for (let k = 0; k < 3; k++) ATA[j][k] += r[j] * r[k];
    }
  }
  const cx = gauss3(ATA, bx), cy = gauss3(ATA, by);
  if (!cx || !cy) return null;
  return [[cx[0], cx[1], cx[2], cy[0], cy[1], cy[2]], 'affine'];
}

function gauss3(A, b) {
  const aug = A.map((row, i) => [...row, b[i]]);
  for (let col = 0; col < 3; col++) {
    let max = col;
    for (let r = col+1; r < 3; r++)
      if (Math.abs(aug[r][col]) > Math.abs(aug[max][col])) max = r;
    [aug[col], aug[max]] = [aug[max], aug[col]];
    if (Math.abs(aug[col][col]) < 1e-10) return null;
    for (let r = 0; r < 3; r++) {
      if (r === col) continue;
      const f = aug[r][col] / aug[col][col];
      for (let k = col; k <= 3; k++) aug[r][k] -= f * aug[col][k];
    }
  }
  return aug.map((row, i) => row[3] / row[i]);
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function el(id) { return document.getElementById(id); }
function setDisabled(id, v) { el(id).disabled = v; }
function status(msg) {
  el('status-bar').textContent = msg;
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const map = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] };
  if (map[e.key]) { e.preventDefault(); nudge(...map[e.key]); }
});

fitCanvas();
</script>
