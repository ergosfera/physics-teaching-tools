# Builds the desktop apps and publishes them on GitHub releases:
#   "countdown-timer":    CountdownTimer.dmg (Mac) and CountdownTimer.exe (Windows)
#   "physics-calculator": PhysicsCalculator.dmg (Mac) and PhysicsCalculator.exe (Windows)
name: Desktop apps

on:
  push:
    branches: [main]
    paths:
      - 'desktop-apps/**'
      - '.github/workflows/desktop-apps.yml'
  workflow_dispatch:

jobs:
  timer-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./desktop-apps/countdown-timer-mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: timer-mac
          path: desktop-apps/countdown-timer-mac/build/CountdownTimer.dmg

  timer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop-apps/countdown-timer/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: timer-windows
          path: desktop-apps/countdown-timer/CountdownTimer.exe

  calc-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./desktop-apps/physics-calculator/mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: calc-mac
          path: desktop-apps/physics-calculator/mac/build/PhysicsCalculator.dmg

  calc-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop-apps/physics-calculator/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: calc-windows
          path: desktop-apps/physics-calculator/windows/PhysicsCalculator.exe

  release-timer:
    needs: [timer-mac, timer-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: timer-*
          path: dist
          merge-multiple: true
      - name: Publish to the countdown-timer release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view countdown-timer -R "$REPO" > /dev/null 2>&1 || \
            gh release create countdown-timer -R "$REPO" --latest=false --title "Countdown Timer" \
              --notes "Countdown timer desktop app. Mac: download CountdownTimer.dmg. Windows: download CountdownTimer.exe."
          gh release upload countdown-timer dist/* -R "$REPO" --clobber
          gh release edit countdown-timer -R "$REPO" --draft=false

  release-calc:
    needs: [calc-mac, calc-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: calc-*
          path: dist
          merge-multiple: true
      - name: Publish to the physics-calculator release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view physics-calculator -R "$REPO" > /dev/null 2>&1 || \
            gh release create physics-calculator -R "$REPO" --latest=false --title "Physics Calculator" \
              --notes "Physics calculator desktop app. Mac: download PhysicsCalculator.dmg. Windows: download PhysicsCalculator.exe."
          gh release upload physics-calculator dist/* -R "$REPO" --clobber
          gh release edit physics-calculator -R "$REPO" --draft=false
