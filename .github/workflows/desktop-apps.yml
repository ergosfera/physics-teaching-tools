# Builds the desktop apps and publishes them on GitHub releases:
#   "countdown-timer":    CountdownTimer.dmg (Mac) and CountdownTimer.exe (Windows)
#   "physics-calculator": PhysicsCalculator.dmg (Mac) and PhysicsCalculator.exe (Windows)
#   "field-timer":        Field.dmg (Mac) and Field.exe (Windows)
#   "sticky-notes":       StickyNotes.dmg (Mac) and StickyNotes.exe (Windows)
#   "screen-ruler":       ScreenRuler.dmg (Mac) and ScreenRuler.exe (Windows)
#   "screen-shapes":      ScreenShapes.dmg (Mac) and ScreenShapes.exe (Windows)
# Pull requests only build the apps, so a broken build shows up before it reaches main.
name: Desktop apps

on:
  push:
    branches: [main]
    paths:
      - 'desktop-apps/**'
      - '.github/workflows/desktop-apps.yml'
  pull_request:
    paths:
      - 'desktop-apps/**'
      - '.github/workflows/desktop-apps.yml'
  workflow_dispatch:

jobs:
  timer-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./desktop-apps/countdown-timer-mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: timer-mac
          path: desktop-apps/countdown-timer-mac/build/CountdownTimer.dmg

  timer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop-apps/countdown-timer/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: timer-windows
          path: desktop-apps/countdown-timer/CountdownTimer.exe

  calc-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./desktop-apps/physics-calculator/mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: calc-mac
          path: desktop-apps/physics-calculator/mac/build/PhysicsCalculator.dmg

  calc-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop-apps/physics-calculator/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: calc-windows
          path: desktop-apps/physics-calculator/windows/PhysicsCalculator.exe

  field-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./desktop-apps/field-timer/mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: field-mac
          path: desktop-apps/field-timer/mac/build/Field.dmg

  field-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop-apps/field-timer/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: field-windows
          path: desktop-apps/field-timer/windows/Field.exe

  notes-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ./desktop-apps/sticky-notes-mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: notes-mac
          path: desktop-apps/sticky-notes-mac/build/StickyNotes.dmg

  notes-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop-apps/sticky-notes/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: notes-windows
          path: desktop-apps/sticky-notes/StickyNotes.exe

  ruler-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./desktop-apps/screen-ruler/mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-mac
          path: desktop-apps/screen-ruler/mac/build/ScreenRuler.dmg

  ruler-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop-apps/screen-ruler/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-windows
          path: desktop-apps/screen-ruler/windows/ScreenRuler.exe

  shapes-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./desktop-apps/screen-shapes/mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shapes-mac
          path: desktop-apps/screen-shapes/mac/build/ScreenShapes.dmg

  shapes-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop-apps/screen-shapes/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: shapes-windows
          path: desktop-apps/screen-shapes/windows/ScreenShapes.exe

  release-timer:
    if: github.event_name != 'pull_request'
    needs: [timer-mac, timer-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: timer-*
          path: dist
          merge-multiple: true
      - name: Publish to the countdown-timer release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view countdown-timer -R "$REPO" > /dev/null 2>&1 || \
            gh release create countdown-timer -R "$REPO" --latest=false --title "Countdown Timer" \
              --notes "Countdown timer desktop app. Mac: download CountdownTimer.dmg. Windows: download CountdownTimer.exe."
          gh release upload countdown-timer dist/* -R "$REPO" --clobber
          gh release edit countdown-timer -R "$REPO" --draft=false

  release-calc:
    if: github.event_name != 'pull_request'
    needs: [calc-mac, calc-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: calc-*
          path: dist
          merge-multiple: true
      - name: Publish to the physics-calculator release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view physics-calculator -R "$REPO" > /dev/null 2>&1 || \
            gh release create physics-calculator -R "$REPO" --latest=false --title "Physics Calculator" \
              --notes "Physics calculator desktop app. Mac: download PhysicsCalculator.dmg. Windows: download PhysicsCalculator.exe."
          gh release upload physics-calculator dist/* -R "$REPO" --clobber
          gh release edit physics-calculator -R "$REPO" --draft=false

  release-field:
    if: github.event_name != 'pull_request'
    needs: [field-mac, field-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: field-*
          path: dist
          merge-multiple: true
      - name: Publish to the field-timer release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view field-timer -R "$REPO" > /dev/null 2>&1 || \
            gh release create field-timer -R "$REPO" --latest=false --title "Field" \
              --notes "Field dot timer desktop app. Mac: download Field.dmg. Windows: download Field.exe."
          gh release upload field-timer dist/* -R "$REPO" --clobber
          gh release edit field-timer -R "$REPO" --draft=false

  release-notes:
    if: github.event_name != 'pull_request'
    needs: [notes-mac, notes-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: notes-*
          path: dist
          merge-multiple: true
      - name: Publish to the sticky-notes release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view sticky-notes -R "$REPO" > /dev/null 2>&1 || \
            gh release create sticky-notes -R "$REPO" --latest=false --title "Sticky Notes" \
              --notes "Sticky notes that sync between Mac and Windows through Google Drive. Mac: download StickyNotes.dmg. Windows: download StickyNotes.exe."
          gh release upload sticky-notes dist/* -R "$REPO" --clobber
          gh release edit sticky-notes -R "$REPO" --draft=false

  release-ruler:
    if: github.event_name != 'pull_request'
    needs: [ruler-mac, ruler-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ruler-*
          path: dist
          merge-multiple: true
      - name: Publish to the screen-ruler release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view screen-ruler -R "$REPO" > /dev/null 2>&1 || \
            gh release create screen-ruler -R "$REPO" --latest=false --title "Screen Ruler" \
              --notes "Rulers and a protractor that float over the screen. Mac: download ScreenRuler.dmg. Windows: download ScreenRuler.exe."
          gh release upload screen-ruler dist/* -R "$REPO" --clobber
          gh release edit screen-ruler -R "$REPO" --draft=false

  release-shapes:
    if: github.event_name != 'pull_request'
    needs: [shapes-mac, shapes-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shapes-*
          path: dist
          merge-multiple: true
      - name: Publish to the screen-shapes release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view screen-shapes -R "$REPO" > /dev/null 2>&1 || \
            gh release create screen-shapes -R "$REPO" --latest=false --title "Screen Shapes" \
              --notes "Lines, rectangles, circles and guide lines that float over the screen and measure. Mac: download ScreenShapes.dmg. Windows: download ScreenShapes.exe."
          gh release upload screen-shapes dist/* -R "$REPO" --clobber
          gh release edit screen-shapes -R "$REPO" --draft=false
